<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Диво Детейлинг — Заказ-наряды</title>
<link rel="stylesheet" href="/assets/style.css?v=84">
<link rel="stylesheet" href="/assets/auth.css?v=84">
<style>
/* === СТИЛИ СТРАНИЦЫ ЗАКАЗ-НАРЯДОВ === */
.ord-page { padding: 0; }

/* Шапка */
.ord-top {
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 16px; flex-wrap: wrap; margin-bottom: 20px;
}
.ord-title {
  font-size: 24px; font-weight: 800; color: #fafafa;
  display: flex; align-items: center; gap: 10px;
}
.ord-title-count {
  background: #27272a; color: #a1a1aa; font-size: 13px; font-weight: 700;
  padding: 4px 10px; border-radius: 6px;
}
.ord-subtitle { font-size: 13px; color: #a1a1aa; margin-top: 4px; }
.ord-btn-create {
  background: #22c55e; color: #0a0a0a; border: none;
  padding: 12px 22px; border-radius: 10px; font-weight: 700;
  cursor: pointer; font-size: 14px; font-family: inherit;
  transition: all .15s; display: flex; align-items: center; gap: 8px;
}
.ord-btn-create:hover { background: #16a34a; transform: translateY(-1px); }

/* Фильтры */
.ord-toolbar {
  display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center;
}
.ord-filters {
  display: flex; gap: 4px; background: #18181b;
  border: 1.5px solid #27272a; border-radius: 12px; padding: 4px;
}
.ord-filter-btn {
  padding: 8px 16px; background: transparent; color: #a1a1aa;
  border: none; border-radius: 8px; font-size: 13px; font-weight: 600;
  font-family: inherit; cursor: pointer; transition: all .15s;
}
.ord-filter-btn:hover { background: #27272a; color: #fafafa; }
.ord-filter-btn.active { background: #3b82f6; color: #fafafa; font-weight: 700; }
.ord-filter-btn .badge {
  background: rgba(0,0,0,0.2); padding: 1px 6px; border-radius: 4px;
  font-size: 11px; margin-left: 4px;
}
.ord-search {
  flex: 1; min-width: 200px; position: relative;
}
.ord-search input {
  width: 100%; padding: 10px 14px 10px 38px;
  background: #18181b; border: 1.5px solid #27272a; border-radius: 10px;
  color: #fafafa; font-size: 14px; font-family: inherit;
}
.ord-search input:focus { outline: none; border-color: #3b82f6; }
.ord-search input::placeholder { color: #52525b; }
.ord-search-icon {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  font-size: 14px; color: #52525b; pointer-events: none;
}

/* Список заказ-нарядов */
.ord-list { display: flex; flex-direction: column; gap: 10px; }

.ord-card {
  background: #18181b; border: 1.5px solid #27272a; border-radius: 12px;
  padding: 16px 18px; cursor: pointer; transition: all .15s;
  display: flex; gap: 16px; align-items: flex-start;
}
.ord-card:hover { border-color: #3f3f46; transform: translateY(-1px); }
.ord-card-status-bar {
  width: 4px; align-self: stretch; border-radius: 2px; flex-shrink: 0;
}
.ord-card-status-bar.new { background: #71717a; }
.ord-card-status-bar.in_progress { background: #fbbf24; }
.ord-card-status-bar.done { background: #22c55e; }
.ord-card-status-bar.issued { background: #3b82f6; }

.ord-card-main { flex: 1; min-width: 0; }
.ord-card-header {
  display: flex; gap: 12px; align-items: center; margin-bottom: 8px; flex-wrap: wrap;
}
.ord-card-num {
  font-size: 15px; font-weight: 800; color: #fafafa;
}
.ord-card-car-color {
  width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0;
  border: 1px solid rgba(255,255,255,0.15);
}
.ord-card-car {
  font-size: 14px; font-weight: 600; color: #d4d4d8;
  display: flex; align-items: center; gap: 6px;
}
.ord-card-plate {
  background: #0a0a0a; border: 1px solid #3f3f46; color: #fafafa;
  padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 700;
  font-family: monospace; letter-spacing: 1px;
}
.ord-card-status {
  font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 4px;
  text-transform: uppercase; letter-spacing: 0.5px;
}
.ord-card-status.new { background: #27272a; color: #a1a1aa; }
.ord-card-status.in_progress { background: #422006; color: #fbbf24; }
.ord-card-status.done { background: #14241a; color: #4ade80; }
.ord-card-status.issued { background: #1e293b; color: #93c5fd; }

.ord-card-info {
  display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: #a1a1aa;
  margin-bottom: 8px;
}
.ord-card-info-item { display: flex; align-items: center; gap: 6px; }
.ord-card-info-item b { color: #fafafa; font-weight: 600; }

.ord-card-services {
  font-size: 13px; color: #d4d4d8; line-height: 1.5;
}
.ord-card-services-label { color: #71717a; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; margin-right: 6px; }
.ord-card-service-tag {
  display: inline-block; background: #0a0a0a; border: 1px solid #27272a;
  padding: 2px 8px; border-radius: 4px; margin: 2px 4px 2px 0; font-size: 12px;
}

/* Пусто */
.ord-empty {
  text-align: center; padding: 60px 20px; color: #52525b;
}
.ord-empty-icon { font-size: 48px; margin-bottom: 12px; }
.ord-empty-text { font-size: 15px; margin-bottom: 16px; }

/* === МОДАЛКА === */
.ord-modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  z-index: 1000; align-items: flex-start; justify-content: center;
  padding: 20px; overflow-y: auto;
}
.ord-modal-overlay.show { display: flex; }
.ord-modal {
  background: #0a0a0a; border: 1.5px solid #27272a; border-radius: 16px;
  max-width: 640px; width: 100%; padding: 24px; margin: 20px auto;
}
.ord-modal-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1.5px solid #27272a;
}
.ord-modal-title { font-size: 20px; font-weight: 800; color: #fafafa; }
.ord-modal-close {
  background: #27272a; border: none; color: #a1a1aa;
  width: 32px; height: 32px; border-radius: 8px; cursor: pointer;
  font-size: 18px; font-family: inherit;
}
.ord-modal-close:hover { background: #3f3f46; color: #fafafa; }

.ord-form-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
}
.ord-form-group { display: flex; flex-direction: column; gap: 6px; }
.ord-form-group.full { grid-column: 1 / -1; }
.ord-form-label {
  font-size: 12px; font-weight: 700; color: #71717a;
  text-transform: uppercase; letter-spacing: 0.5px;
}
.ord-form-input, .ord-form-select, .ord-form-textarea {
  background: #18181b; border: 1.5px solid #27272a; border-radius: 8px;
  padding: 10px 12px; color: #fafafa; font-size: 14px; font-family: inherit;
  width: 100%; box-sizing: border-box;
}
.ord-form-input:focus, .ord-form-select:focus, .ord-form-textarea:focus {
  outline: none; border-color: #3b82f6;
}
.ord-form-textarea { resize: vertical; min-height: 60px; }
.ord-form-hint { font-size: 11px; color: #52525b; }

/* Палитра цветов */
.ord-color-palette {
  display: flex; gap: 6px; flex-wrap: wrap;
}
.ord-color-swatch {
  width: 32px; height: 32px; border-radius: 6px; cursor: pointer;
  border: 2px solid transparent; transition: all .15s;
}
.ord-color-swatch:hover { transform: scale(1.1); }
.ord-color-swatch.active { border-color: #fafafa; box-shadow: 0 0 0 2px #0a0a0a; }

/* Услуги */
.ord-services-row {
  display: flex; gap: 6px; margin-bottom: 6px;
}
.ord-services-row input { flex: 1; }
.ord-btn-add-service {
  background: #27272a; border: 1.5px solid #3f3f46; color: #a1a1aa;
  padding: 0 14px; border-radius: 8px; cursor: pointer; font-size: 18px;
  font-family: inherit; flex-shrink: 0;
}
.ord-btn-add-service:hover { background: #3f3f46; color: #fafafa; }
.ord-services-list {
  display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px;
}
.ord-service-chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: #18181b; border: 1px solid #27272a; color: #d4d4d8;
  padding: 4px 10px; border-radius: 6px; font-size: 13px;
}
.ord-service-chip-remove {
  cursor: pointer; color: #71717a; font-size: 16px; line-height: 1;
}
.ord-service-chip-remove:hover { color: #ef4444; }

/* Кнопки модалки */
.ord-modal-actions {
  display: flex; gap: 10px; justify-content: flex-end;
  margin-top: 24px; padding-top: 16px; border-top: 1.5px solid #27272a;
}
.ord-btn-cancel {
  background: #27272a; color: #d4d4d8; border: 1.5px solid #3f3f46;
  padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer;
  font-size: 14px; font-family: inherit;
}
.ord-btn-cancel:hover { background: #3f3f46; }
.ord-btn-save {
  background: #22c55e; color: #0a0a0a; border: none;
  padding: 10px 22px; border-radius: 8px; font-weight: 700; cursor: pointer;
  font-size: 14px; font-family: inherit;
}
.ord-btn-save:hover { background: #16a34a; }
.ord-btn-delete {
  background: transparent; color: #ef4444; border: 1.5px solid #7f1d1d;
  padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer;
  font-size: 14px; font-family: inherit; margin-right: auto;
}
.ord-btn-delete:hover { background: #7f1d1d; color: #fca5a5; }

@media (max-width: 600px) {
  .ord-form-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div id="divoAuthContainer"></div>

<div class="divo-layout" id="divoMainLayout" style="display:none;">
  <header class="divo-header" id="divo-header"></header>
  <div class="divo-body">
    <aside class="divo-sidebar" id="divo-sidebar"></aside>
    <main class="divo-content" id="divoContent">
      <div class="ord-page">
        <div class="ord-top">
          <div>
            <div class="ord-title">
              📋 Заказ-наряды
              <span class="ord-title-count" id="ordCount">0</span>
            </div>
            <div class="ord-subtitle">Записи клиентов · посты · услуги</div>
          </div>
          <button class="ord-btn-create" onclick="ordOpenModal()">
            ➕ Создать заказ-наряд
          </button>
        </div>

        <div class="ord-toolbar">
          <div class="ord-filters" id="ordFilters">
            <button class="ord-filter-btn active" data-filter="all">Все <span class="badge" id="cnt-all">0</span></button>
            <button class="ord-filter-btn" data-filter="new">Новые <span class="badge" id="cnt-new">0</span></button>
            <button class="ord-filter-btn" data-filter="in_progress">В работе <span class="badge" id="cnt-in_progress">0</span></button>
            <button class="ord-filter-btn" data-filter="done">Готово <span class="badge" id="cnt-done">0</span></button>
            <button class="ord-filter-btn" data-filter="issued">Выдано <span class="badge" id="cnt-issued">0</span></button>
          </div>
          <div class="ord-search">
            <span class="ord-search-icon">🔍</span>
            <input type="text" id="ordSearch" placeholder="Поиск по номеру, авто, госномеру..." oninput="ordRender()">
          </div>
        </div>

        <div class="ord-list" id="ordList">
          <div class="ord-empty">
            <div class="ord-empty-icon">📋</div>
            <div class="ord-empty-text">Пока нет заказ-нарядов</div>
            <button class="ord-btn-create" onclick="ordOpenModal()">➕ Создать первый</button>
          </div>
        </div>
      </div>

      <!-- Модалка создания/редактирования -->
      <div class="ord-modal-overlay" id="ordModal">
        <div class="ord-modal">
          <div class="ord-modal-header">
            <div class="ord-modal-title" id="ordModalTitle">Новый заказ-наряд</div>
            <button class="ord-modal-close" onclick="ordCloseModal()">✕</button>
          </div>

          <div class="ord-form-grid">
            <div class="ord-form-group">
              <label class="ord-form-label">Номер заказ-наряда *</label>
              <input type="text" class="ord-form-input" id="ordField-number" placeholder="Напр. 1234">
              <div class="ord-form-hint">Из внешней CRM</div>
            </div>
            <div class="ord-form-group">
              <label class="ord-form-label">Пост *</label>
              <select class="ord-form-select" id="ordField-post">
                <option value="1">Пост 1</option>
                <option value="2">Пост 2</option>
                <option value="3">Пост 3</option>
                <option value="4">Пост 4</option>
              </select>
            </div>

            <div class="ord-form-group">
              <label class="ord-form-label">Марка / модель *</label>
              <input type="text" class="ord-form-input" id="ordField-carBrand" placeholder="Toyota Camry">
            </div>
            <div class="ord-form-group">
              <label class="ord-form-label">Госномер</label>
              <input type="text" class="ord-form-input" id="ordField-carPlate" placeholder="А123ВС 77" style="text-transform:uppercase;">
            </div>

            <div class="ord-form-group full">
              <label class="ord-form-label">Цвет авто (для графика)</label>
              <div class="ord-color-palette" id="ordColorPalette"></div>
            </div>

            <div class="ord-form-group">
              <label class="ord-form-label">Дата заезда *</label>
              <input type="date" class="ord-form-input" id="ordField-dateIn">
            </div>
            <div class="ord-form-group">
              <label class="ord-form-label">Дата выезда *</label>
              <input type="date" class="ord-form-input" id="ordField-dateOut">
            </div>

            <div class="ord-form-group full">
              <label class="ord-form-label">Статус</label>
              <select class="ord-form-select" id="ordField-status">
                <option value="new">🆕 Новый</option>
                <option value="in_progress">🟡 В работе</option>
                <option value="done">🟢 Готово</option>
                <option value="issued">🔵 Выдано</option>
              </select>
            </div>

            <div class="ord-form-group full">
              <label class="ord-form-label">Услуги</label>
              <div class="ord-services-row">
                <input type="text" class="ord-form-input" id="ordServiceInput" placeholder="Полировка кузова, Химчистка салона..." onkeydown="if(event.key==='Enter'){event.preventDefault();ordAddService();}">
                <button type="button" class="ord-btn-add-service" onclick="ordAddService()">+</button>
              </div>
              <div class="ord-services-list" id="ordServicesList"></div>
            </div>

            <div class="ord-form-group full">
              <label class="ord-form-label">Комментарий</label>
              <textarea class="ord-form-textarea" id="ordField-note" placeholder="Доп. инфо..."></textarea>
            </div>
          </div>

          <div class="ord-modal-actions">
            <button class="ord-btn-delete" id="ordDeleteBtn" onclick="ordDelete()" style="display:none;">🗑 Удалить</button>
            <button class="ord-btn-cancel" onclick="ordCloseModal()">Отмена</button>
            <button class="ord-btn-save" onclick="ordSave()">💾 Сохранить</button>
          </div>
        </div>
      </div>
    </main>
  </div>
  <div class="divo-footer">© Диво Детейлинг • 2026</div>
</div>

<script src="/components/components.js?v=84"></script>
<script src="/components/access-config.js?v=84"></script>
<script>
// ============================================
// ЛОКАЛЬНОЕ ХРАНИЛИЩЕ (временно, до Supabase)
// ============================================
var ORDERS_KEY = 'divo_orders';
var ORD_EDITING_ID = null;
var ORD_SERVICES = [];
var ORD_FILTER = 'all';
var ORD_CAR_COLORS = [
  {hex:'#ef4444', name:'Красный'},
  {hex:'#3b82f6', name:'Синий'},
  {hex:'#22c55e', name:'Зелёный'},
  {hex:'#fbbf24', name:'Жёлтый'},
  {hex:'#f97316', name:'Оранжевый'},
  {hex:'#a78bfa', name:'Фиолетовый'},
  {hex:'#ec4899', name:'Розовый'},
  {hex:'#fafafa', name:'Белый'},
  {hex:'#525252', name:'Чёрный'},
  {hex:'#71717a', name:'Серый'}
];
var ORD_STATUS_NAMES = {
  new: 'Новый',
  in_progress: 'В работе',
  done: 'Готово',
  issued: 'Выдано'
};

function ordGetAll() {
  try {
    var data = localStorage.getItem(ORDERS_KEY);
    return data ? JSON.parse(data) : [];
  } catch(e) { return []; }
}

function ordSaveAll(orders) {
  try { localStorage.setItem(ORDERS_KEY, JSON.stringify(orders)); } catch(e) {}
}

// === РЕНДЕР СПИСКА ===
function ordRender() {
  var orders = ordGetAll();
  var search = (document.getElementById('ordSearch').value || '').toLowerCase().trim();

  // Считаем счётчики
  var counts = { all: orders.length, new: 0, in_progress: 0, done: 0, issued: 0 };
  for (var i = 0; i < orders.length; i++) {
    counts[orders[i].status] = (counts[orders[i].status] || 0) + 1;
  }
  for (var k in counts) {
    var el = document.getElementById('cnt-' + k);
    if (el) el.textContent = counts[k];
  }
  document.getElementById('ordCount').textContent = orders.length;

  // Фильтруем
  var filtered = [];
  for (var i = 0; i < orders.length; i++) {
    var o = orders[i];
    if (ORD_FILTER !== 'all' && o.status !== ORD_FILTER) continue;
    if (search) {
      var hay = (o.number + ' ' + o.carBrand + ' ' + (o.carPlate||'')).toLowerCase();
      if (hay.indexOf(search) === -1) continue;
    }
    filtered.push(o);
  }

  // Сортировка: новые по дате создания (обратный порядок)
  filtered.sort(function(a, b) {
    return (b.createdAt || 0) - (a.createdAt || 0);
  });

  var listEl = document.getElementById('ordList');
  if (filtered.length === 0) {
    listEl.innerHTML = '<div class="ord-empty"><div class="ord-empty-icon">📋</div><div class="ord-empty-text">' + (orders.length === 0 ? 'Пока нет заказ-нарядов' : 'Ничего не найдено') + '</div>' + (orders.length === 0 ? '<button class="ord-btn-create" onclick="ordOpenModal()">➕ Создать первый</button>' : '') + '</div>';
    return;
  }

  var html = '';
  for (var i = 0; i < filtered.length; i++) {
    var o = filtered[i];
    var servicesHtml = '';
    if (o.services && o.services.length) {
      servicesHtml = '<div class="ord-card-services"><span class="ord-card-services-label">Услуги:</span>';
      for (var j = 0; j < o.services.length; j++) {
        servicesHtml += '<span class="ord-card-service-tag">' + o.services[j] + '</span>';
      }
      servicesHtml += '</div>';
    }

    html += '<div class="ord-card" onclick="ordOpenModal(\'' + o.id + '\')">';
    html += '  <div class="ord-card-status-bar ' + o.status + '"></div>';
    html += '  <div class="ord-card-main">';
    html += '    <div class="ord-card-header">';
    html += '      <span class="ord-card-num">#' + (o.number || o.id) + '</span>';
    html += '      <span class="ord-card-car"><span class="ord-card-car-color" style="background:' + (o.carColor || '#525252') + '"></span>' + (o.carBrand || '—') + '</span>';
    if (o.carPlate) html += '<span class="ord-card-plate">' + o.carPlate + '</span>';
    html += '      <span class="ord-card-status ' + o.status + '">' + ORD_STATUS_NAMES[o.status] + '</span>';
    html += '    </div>';
    html += '    <div class="ord-card-info">';
    html += '      <span class="ord-card-info-item">📍 <b>Пост ' + (o.post || '?') + '</b></span>';
    if (o.dateIn) html += '<span class="ord-card-info-item">📅 <b>' + ordFormatDate(o.dateIn) + (o.dateOut ? ' → ' + ordFormatDate(o.dateOut) : '') + '</b></span>';
    html += '    </div>';
    html += servicesHtml;
    html += '  </div>';
    html += '</div>';
  }
  listEl.innerHTML = html;
}

function ordFormatDate(d) {
  if (!d) return '';
  var parts = d.split('-');
  return parts[2] + '.' + parts[1] + '.' + parts[0];
}

// === МОДАЛКА ===
function ordOpenModal(id) {
  ORD_EDITING_ID = id || null;
  var orders = ordGetAll();
  var o = id ? orders.find(function(x){return x.id === id;}) : null;

  document.getElementById('ordModalTitle').textContent = id ? 'Заказ-наряд #' + (o.number || o.id) : 'Новый заказ-наряд';
  document.getElementById('ordDeleteBtn').style.display = id ? 'block' : 'none';

  document.getElementById('ordField-number').value = o ? (o.number || '') : '';
  document.getElementById('ordField-carBrand').value = o ? (o.carBrand || '') : '';
  document.getElementById('ordField-carPlate').value = o ? (o.carPlate || '') : '';
  document.getElementById('ordField-dateIn').value = o ? (o.dateIn || '') : '';
  document.getElementById('ordField-dateOut').value = o ? (o.dateOut || '') : '';
  document.getElementById('ordField-status').value = o ? (o.status || 'new') : 'new';
  document.getElementById('ordField-note').value = o ? (o.note || '') : '';
  document.getElementById('ordField-post').value = o ? (o.post || 'auto') : 'auto';

  ORD_SERVICES = o && o.services ? o.services.slice() : [];
  ordRenderServices();
  ordRenderColorPalette(o ? o.carColor : null);

  document.getElementById('ordModal').classList.add('show');
}

function ordCloseModal() {
  document.getElementById('ordModal').classList.remove('show');
  ORD_EDITING_ID = null;
  ORD_SERVICES = [];
}

function ordRenderColorPalette(activeColor) {
  var el = document.getElementById('ordColorPalette');
  var html = '';
  for (var i = 0; i < ORD_CAR_COLORS.length; i++) {
    var c = ORD_CAR_COLORS[i];
    var active = (activeColor === c.hex) ? 'active' : '';
    html += '<div class="ord-color-swatch ' + active + '" style="background:' + c.hex + '" title="' + c.name + '" onclick="ordSelectColor(\'' + c.hex + '\')"></div>';
  }
  el.innerHTML = html;
}

function ordSelectColor(hex) {
  var swatches = document.querySelectorAll('.ord-color-swatch');
  for (var i = 0; i < swatches.length; i++) {
    swatches[i].classList.remove('active');
  }
  event.target.classList.add('active');
}

function ordGetSelectedColor() {
  var active = document.querySelector('.ord-color-swatch.active');
  return active ? active.style.backgroundColor : '#525252';
}

// Услуги
function ordAddService() {
  var input = document.getElementById('ordServiceInput');
  var val = input.value.trim();
  if (!val) return;
  ORD_SERVICES.push(val);
  input.value = '';
  ordRenderServices();
}

function ordRemoveService(idx) {
  ORD_SERVICES.splice(idx, 1);
  ordRenderServices();
}

function ordRenderServices() {
  var el = document.getElementById('ordServicesList');
  if (ORD_SERVICES.length === 0) { el.innerHTML = ''; return; }
  var html = '';
  for (var i = 0; i < ORD_SERVICES.length; i++) {
    html += '<span class="ord-service-chip">' + ORD_SERVICES[i] + ' <span class="ord-service-chip-remove" onclick="ordRemoveService(' + i + ')">✕</span></span>';
  }
  el.innerHTML = html;
}

// === СОХРАНЕНИЕ ===
function ordSave() {
  var number = document.getElementById('ordField-number').value.trim();
  var carBrand = document.getElementById('ordField-carBrand').value.trim();
  var carPlate = document.getElementById('ordField-carPlate').value.trim().toUpperCase();
  var dateIn = document.getElementById('ordField-dateIn').value;
  var dateOut = document.getElementById('ordField-dateOut').value;
  var status = document.getElementById('ordField-status').value;
  var post = document.getElementById('ordField-post').value;
  var note = document.getElementById('ordField-note').value.trim();
  var carColor = ordGetSelectedColor();

  if (!number) { alert('Укажите номер заказ-наряда'); return; }
  if (!carBrand) { alert('Укажите марку/модель авто'); return; }
  if (!dateIn) { alert('Укажите дату заезда'); return; }
  if (!dateOut) { alert('Укажите дату выезда'); return; }

  var orders = ordGetAll();
  if (ORD_EDITING_ID) {
    for (var i = 0; i < orders.length; i++) {
      if (orders[i].id === ORD_EDITING_ID) {
        orders[i].number = number;
        orders[i].carBrand = carBrand;
        orders[i].carPlate = carPlate;
        orders[i].carColor = carColor;
        orders[i].dateIn = dateIn;
        orders[i].dateOut = dateOut;
        orders[i].status = status;
        orders[i].post = post;
        orders[i].note = note;
        orders[i].services = ORD_SERVICES.slice();
        break;
      }
    }
  } else {
    var newOrder = {
      id: 'ord_' + Date.now() + '_' + Math.floor(Math.random()*1000),
      number: number,
      carBrand: carBrand,
      carPlate: carPlate,
      carColor: carColor,
      dateIn: dateIn,
      dateOut: dateOut,
      status: status,
      post: post,
      note: note,
      services: ORD_SERVICES.slice(),
      createdAt: Date.now()
    };
    orders.push(newOrder);
  }
  ordSaveAll(orders);
  ordCloseModal();
  ordRender();
}

function ordDelete() {
  if (!ORD_EDITING_ID) return;
  if (!confirm('Удалить заказ-наряд?')) return;
  var orders = ordGetAll();
  orders = orders.filter(function(x){return x.id !== ORD_EDITING_ID;});
  ordSaveAll(orders);
  ordCloseModal();
  ordRender();
}

// === ФИЛЬТРЫ ===
function ordInitFilters() {
  var btns = document.querySelectorAll('.ord-filter-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].addEventListener('click', function() {
      for (var j = 0; j < btns.length; j++) btns[j].classList.remove('active');
      this.classList.add('active');
      ORD_FILTER = this.getAttribute('data-filter');
      ordRender();
    });
  }
}

}
}

// === АВТОРИЗАЦИЯ + ИНИЦИАЛИЗАЦИЯ ===
function divoCheckAuthAndInit() {
  var user = divoGetUser();
  if (!user) {
    var mainLayout = document.getElementById('divoMainLayout');
    if (mainLayout) mainLayout.style.display = 'none';
    fetch('/components/auth-form.html?v=84')
      .then(function(r) { return r.text(); })
      .then(function(html) {
        var c = document.getElementById('divoAuthContainer');
        if (c) {
          c.innerHTML = html;
          var btn = document.getElementById('divoAuthBtn');
          if (btn) btn.addEventListener('click', divoDoLogin);
          var pass = document.getElementById('divoAuthPassword');
          if (pass) pass.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') divoDoLogin();
          });
        }
      });
    return;
  }

  // Доступ к заказ-нарядам — уровень 2 (мастер)
  if (!divoHasAccessToSection('orders')) {
    if (typeof divoCheckSectionAccess === 'function') {
      divoCheckSectionAccess('orders');
    } else {
      location.href = 'index.html';
    }
    return;
  }

  var mainLayout = document.getElementById('divoMainLayout');
  if (mainLayout) mainLayout.style.display = 'flex';
  var authContainer = document.getElementById('divoAuthContainer');
  if (authContainer) authContainer.innerHTML = '';

  divoInit();
  ordInitFilters();
  ordRender();

  // Закрытие модалки по клику вне
  document.getElementById('ordModal').addEventListener('click', function(e) {
    if (e.target === this) ordCloseModal();
  });
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', divoCheckAuthAndInit);
} else {
  divoCheckAuthAndInit();
}
</script>
