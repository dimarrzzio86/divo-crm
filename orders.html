// Конвертация: строка БД → наш формат
function ordFromDb(row) {
  return {
    id: row.id,
    number: row.number || '',
    carBrand: row.car_brand || '',
    carPlate: row.car_plate || '',
    carColor: row.car_color || '#525252',
    dateIn: row.date_in || '',
    dateOut: row.date_out || '',
    status: row.status || 'new',
    post: String(row.post || '1'),
    note: row.note || '',
    price: Number(row.price) || 0,
    services: row.services || [],
    createdAt: row.created_at ? new Date(row.created_at).getTime() : 0
  };
}

// Загрузить все заказы с сервера (с кэшем)
var ORD_CALC_ORDER_IDS = {}; // { orderId: true } — у каких заказов есть расчёт

function ordLoadCalcIds() {
  fetch(ORD_SUPABASE_URL + '/rest/v1/order_component_costs?select=order_id', {
    headers: { 'apikey': ORD_SUPABASE_KEY, 'Authorization': 'Bearer ' + ORD_SUPABASE_KEY }
  })
    .then(function(r) { return r.json(); })
    .then(function(rows) {
      ORD_CALC_ORDER_IDS = {};
      for (var i = 0; i < rows.length; i++) {
        ORD_CALC_ORDER_IDS[rows[i].order_id] = true;
      }
      // Перерисовать список, чтобы обновить кнопки
      ordRender();
    })
    .catch(function(e) { console.error('Ошибка загрузки расчётов:', e); });
}

function ordGetAll(callback) {
  if (ORD_CACHE) { if (callback) callback(ORD_CACHE); return; }
  fetch(ORD_SUPABASE_URL + '/rest/v1/orders?select=*&order=created_at.desc', {
    headers: {
      'apikey': ORD_SUPABASE_KEY,
      'Authorization': 'Bearer ' + ORD_SUPABASE_KEY
    }
  })
    .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(rows) {
      ORD_CACHE = rows.map(ordFromDb);
      if (callback) callback(ORD_CACHE);
      // Параллельно грузим ID заказов с расчётом
      ordLoadCalcIds();
    })
    .catch(function(e) {
      console.error('Ошибка загрузки заказов:', e);
      if (callback) callback([]);
    });
}

function ordInvalidateCache() { ORD_CACHE = null; }

// Поиск свободного поста
function ordFindFreePost(dateIn, dateOut, excludeId, orders) {
  if (!dateIn || !dateOut) return 1;
  for (var post = 1; post <= 4; post++) {
    var isFree = true;
    for (var i = 0; i < orders.length; i++) {
      var o = orders[i];
      if (excludeId && o.id === excludeId) continue;
      if (String(o.post) !== String(post)) continue;
      if (!o.dateIn || !o.dateOut) continue;
      if (dateIn <= o.dateOut && dateOut >= o.dateIn) { isFree = false; break; }
    }
    if (isFree) return post;
  }
  return 1;
}

function ordInitDateFilter() {
  ordSetDatePreset('month');
}

function ordSetDatePreset(preset) {
  ORD_DATE_PRESET = preset;
  var today = new Date();
  var from = '', to = '', info = '';

  if (preset === 'today') {
    var d = ordFmtDate(today);
    from = d; to = d;
    info = 'Записи за сегодня (' + d + ')';
  } else if (preset === 'week') {
    var day = today.getDay() || 7; // Вс=0 → 7
    var monday = new Date(today);
    monday.setDate(today.getDate() - day + 1);
    var sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);
    from = ordFmtDate(monday);
    to = ordFmtDate(sunday);
    info = 'Записи за эту неделю (' + from + ' — ' + to + ')';
  } else if (preset === 'month') {
    var first = new Date(today.getFullYear(), today.getMonth(), 1);
    var last = new Date(today.getFullYear(), today.getMonth() + 1, 0);
    from = ordFmtDate(first);
    to = ordFmtDate(last);
    info = 'Записи за ' + ordMonthName(today.getMonth()) + ' ' + today.getFullYear();
  } else if (preset === 'all') {
    from = ''; to = '';
    info = 'Показаны все записи';
  } else if (preset === 'custom') {
    // Оставляем текущие значения инпутов
    from = document.getElementById('ordDateFrom').value || '';
    to = document.getElementById('ordDateTo').value || '';
    info = from && to ? 'Период: ' + from + ' — ' + to : (from ? 'С ' + from : (to ? 'До ' + to : 'Выберите даты'));
  }

  ORD_DATE_FROM = from;
  ORD_DATE_TO = to;

  // Обновляем UI
  var btns = document.querySelectorAll('.ord-date-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.toggle('active', btns[i].dataset.preset === preset);
  }

  var range = document.getElementById('ordDateRange');
  if (range) range.style.display = (preset === 'custom') ? 'flex' : 'none';

  if (preset === 'custom') {
    var f = document.getElementById('ordDateFrom'); if (f && !f.value) f.value = from;
    var t = document.getElementById('ordDateTo'); if (t && !t.value) t.value = to;
  }

  var infoEl = document.getElementById('ordDateInfo');
  if (infoEl) infoEl.textContent = info;

  ordRender();
}

function ordOnDateRangeChange() {
  ORD_DATE_FROM = document.getElementById('ordDateFrom').value || '';
  ORD_DATE_TO = document.getElementById('ordDateTo').value || '';
  var infoEl = document.getElementById('ordDateInfo');
  if (infoEl) {
    if (ORD_DATE_FROM && ORD_DATE_TO) infoEl.textContent = 'Период: ' + ORD_DATE_FROM + ' — ' + ORD_DATE_TO;
    else if (ORD_DATE_FROM) infoEl.textContent = 'С ' + ORD_DATE_FROM;
    else if (ORD_DATE_TO) infoEl.textContent = 'До ' + ORD_DATE_TO;
    else infoEl.textContent = 'Выберите период';
  }
  ordRender();
}

function ordOnSingleDateChange() {
  var d = document.getElementById('ordDateSingle').value;
  if (d) {
    ORD_DATE_FROM = d;
    ORD_DATE_TO = d;
    var infoEl = document.getElementById('ordDateInfo');
    if (infoEl) infoEl.textContent = 'Дата: ' + d;
    ordRender();
  }
}

function ordFilterByDate(order) {
  if (!ORD_DATE_FROM && !ORD_DATE_TO) return true; // фильтр отключен
  var d = order.dateIn || '';
  if (!d) return false;
  if (ORD_DATE_FROM && d < ORD_DATE_FROM) return false;
  if (ORD_DATE_TO && d > ORD_DATE_TO) return false;
  return true;
}

function ordFmtDate(d) {
  var y = d.getFullYear();
  var m = String(d.getMonth() + 1).padStart(2, '0');
  var day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}

function ordMonthName(m) {
  var names = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  return names[m] || '';
}

function ordRender() {
  var listEl = document.getElementById('ordList');
  if (listEl) listEl.innerHTML = '<div class="ord-empty"><div class="ord-empty-icon">⏳</div><div class="ord-empty-text">Загрузка...</div></div>';
  ordGetAll(function(orders) { ordRenderList(orders); });
}

function ordRenderList(orders) {
  var search = (document.getElementById('ordSearch').value || '').toLowerCase().trim();

  var counts = { all: orders.length, new: 0, in_progress: 0, done: 0, issued: 0 };
  for (var i = 0; i < orders.length; i++) {
    counts[orders[i].status] = (counts[orders[i].status] || 0) + 1;
  }
  for (var k in counts) {
    var el = document.getElementById('cnt-' + k);
    if (el) el.textContent = counts[k];
  }
  document.getElementById('ordCount').textContent = orders.length;

  var filtered = [];
  for (var i = 0; i < orders.length; i++) {
    var o = orders[i];
    if (ORD_FILTER !== 'all' && o.status !== ORD_FILTER) continue;
    if (!ordFilterByDate(o)) continue;
    if (search) {
      var hay = (o.number + ' ' + o.carBrand + ' ' + (o.carPlate||'')).toLowerCase();
      if (hay.indexOf(search) === -1) continue;
    }
    filtered.push(o);
  }

  filtered.sort(function(a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });

  var listEl = document.getElementById('ordList');
  if (filtered.length === 0) {
    listEl.innerHTML = '<div class="ord-empty"><div class="ord-empty-icon">📋</div><div class="ord-empty-text">' + (orders.length === 0 ? 'Пока нет заказ-нарядов' : 'Ничего не найдено') + '</div>' + (orders.length === 0 ? '<button class="ord-btn-create" onclick="ordOpenForm()">➕ Создать первый</button>' : '') + '</div>';
    return;
  }

  var html = '';
  for (var i = 0; i < filtered.length; i++) {
    var o = filtered[i];
    var parts = [];
    parts.push('<span class="ord-card-num">#' + (o.number || o.id) + '</span>');
    parts.push('<span class="ord-card-sep">•</span>');
    parts.push('<span class="ord-card-car"><span class="ord-card-car-color" style="background:' + (o.carColor || '#525252') + '"></span>' + (o.carBrand || '—') + '</span>');
    if (o.carPlate) {
      parts.push('<span class="ord-card-sep">•</span>');
      parts.push('<span class="ord-card-plate">' + o.carPlate + '</span>');
    }
    parts.push('<span class="ord-card-sep">•</span>');
    parts.push('<span class="ord-card-meta">📍 <b>Пост ' + (o.post || '?') + '</b></span>');
    if (o.dateIn) {
      parts.push('<span class="ord-card-sep">•</span>');
      parts.push('<span class="ord-card-meta">📅 <b>' + ordFormatDate(o.dateIn) + (o.dateOut ? ' → ' + ordFormatDate(o.dateOut) : '') + '</b></span>');
    }
    if (o.price && o.price > 0) {
      parts.push('<span class="ord-card-sep">•</span>');
      parts.push('<span class="ord-card-price">💰 ' + ordFormatPrice(o.price) + ' ₽</span>');
    }
    parts.push('<span class="ord-card-status ' + o.status + '">' + ORD_STATUS_NAMES[o.status] + '</span>');
    html += '<div class="ord-card" data-oid="' + o.id + '" onclick="ordOpenForm(this.dataset.oid)">';
    html += '<div class="ord-card-status-bar ' + o.status + '"></div>';
    html += '<div class="ord-card-main">' + parts.join('') + '</div>';
    var hasCalc = !!ORD_CALC_ORDER_IDS[o.id];
    var calcBtnClass = hasCalc ? 'ord-card-calc-btn has-calc' : 'ord-card-calc-btn';
    var calcBtnIcon = hasCalc ? '📊' : '🧮';
    var calcBtnText = hasCalc ? 'Посмотреть расчёты' : 'Рассчитать';
    html += '<button type="button" class="' + calcBtnClass + '" data-oid="' + o.id + '" onclick="event.stopPropagation();ordOpenCalc(this.dataset.oid)">' + calcBtnIcon + ' ' + calcBtnText + '</button>';
    html += '</div>';
  }
  listEl.innerHTML = html;
}

function ordFormatDate(d) {
  if (!d) return '';
  var parts = d.split('-');
  return parts[2] + '.' + parts[1] + '.' + parts[0];
}

function ordFormatPrice(p) {
  var n = Number(p) || 0;
  return n.toLocaleString('ru-RU');
}

// === МОДАЛКА ===
function ordNewOrder() {
  // Очищаем форму для нового заказа
  ORD_EDITING_ID = null;
  ordLoadPrices(function() {
    ordResetRows();
    ordFillForm(null);
    document.getElementById('ordFormTitle').textContent = 'Новый заказ-наряд';
    document.getElementById('ordDeleteBtn').style.display = 'none';
    document.getElementById('ordFormCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
}

function ordOpenForm(id) {
  // Открываем существующий заказ на редактирование
  ORD_EDITING_ID = id || null;
  ordLoadPrices(function() {
    if (!id) { ordNewOrder(); return; }
    ordGetAll(function(orders) {
      var o = orders.find(function(x){return x.id === id;});
      ordFillForm(o);
      document.getElementById('ordFormTitle').textContent = 'Заказ-наряд #' + (o ? o.number : id);
      document.getElementById('ordDeleteBtn').style.display = 'block';
      document.getElementById('ordFormCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
}

function ordCloseForm() {
  // Сбрасываем форму к пустому состоянию
  ordNewOrder();
}

function ordFillForm(o) {
  var id = ORD_EDITING_ID;
  document.getElementById('ordFormTitle').textContent = id ? 'Заказ-наряд #' + (o ? o.number : id) : 'Новый заказ-наряд';
  document.getElementById('ordDeleteBtn').style.display = id ? 'block' : 'none';
  document.getElementById('ordField-number').value = o ? (o.number || '') : '';
  document.getElementById('ordField-carBrand').value = o ? (o.carBrand || '') : '';
  document.getElementById('ordField-carPlate').value = o ? (o.carPlate || '') : '';
  document.getElementById('ordField-dateIn').value = o ? (o.dateIn || '') : '';
  document.getElementById('ordField-dateOut').value = o ? (o.dateOut || '') : '';
  document.getElementById('ordField-status').value = o ? (o.status || 'new') : 'new';
  document.getElementById('ordField-note').value = o ? (o.note || '') : '';
  document.getElementById('ordField-post').value = o ? (o.post || 'auto') : 'auto';
  // Загружаем услуги в строки таблицы
  if (o && o.services && o.services.length) {
    ordServicesToRows(o.services);
  } else {
    ordResetRows();
  }
  ordRenderRows();
  ordRecalcTotal();
  ordRenderColorPalette(o ? o.carColor : null);
}



function ordRenderColorPalette(activeColor) {

  var html = '';
  for (var i = 0; i < ORD_CAR_COLORS.length; i++) {
    var c = ORD_CAR_COLORS[i];

    html += '<div class="ord-color-swatch ' + active + '" style="background:' + c.hex + '" title="' + c.name + '" onclick="ordSelectColor(\'' + c.hex + '\')"></div>';
  }

}

function ordSelectColor(hex) {
  var swatches = document.querySelectorAll('.ord-color-swatch');
  for (var i = 0; i < swatches.length; i++) swatches[i].classList.remove('active');

}

function ordGetSelectedColor() {
  var active = document.querySelector('.ord-color-swatch.active');

}

function ordAddRow() {
  ORD_ROWS.push({ catId: '', subcatId: '', svcId: '', svcName: '', price: 0, manual: false });
  ordRenderRows();
}

function ordRemoveRow(idx) {
  ORD_ROWS.splice(idx, 1);
  ordRenderRows();
  ordRecalcTotal();
}


function ordOnRowManualToggle(idx, isManual) {
  var r = ORD_ROWS[idx];
  r.manual = isManual;
  if (isManual) {
    // Переходим в ручной режим — сохраняем svcName если было выбрано
    if (!r.svcName) r.svcName = '';
    r.catId = '';
    r.subcatId = '';
    r.svcId = '';
  } else {
    // Возвращаемся к прайсу — сбрасываем ручное название
    r.svcName = '';
  }
  ordRenderRows();
  ordRecalcTotal();
}

function ordRenderRows() {
  var el = document.getElementById('ordRowsBody');
  if (ORD_ROWS.length === 0) {
    el.innerHTML = '<div class="ord-empty-row">Нажмите «Добавить строку», чтобы выбрать услуги</div>';
    return;
  }
  var html = '';
  for (var i = 0; i < ORD_ROWS.length; i++) {
    var r = ORD_ROWS[i];
    html += '<div class="ord-row" data-idx="' + i + '">';
    // Чекбокс "Ручной ввод" — отдельный для каждой строки
    var checked = r.manual ? ' checked' : '';
    html += '<div class="ord-row-check"><input type="checkbox" id="ordRowManual' + i + '"' + checked + ' onchange="ordOnRowManualToggle(' + i + ', this.checked)" title="Ручной ввод"></div>';
    // Содержимое строки зависит от режима
    if (r.manual) {
      // Ручной режим: одно текстовое поле на 3 колонки
      html += '<input type="text" class="ord-manual-name" value="' + ordEscape(r.svcName) + '" placeholder="Название услуги..." oninput="ordOnRowManualName(' + i + ', this.value)" style="grid-column: span 3;">';
    } else {
      // Режим прайса: 3 селекта
      html += '<select onchange="ordOnRowCat(' + i + ', this.value)">' + ordCatOptions(r.catId) + '</select>';
      if (r.catId) {
        html += '<select onchange="ordOnRowSubcat(' + i + ', this.value)">' + ordSubcatOptions(r.catId, r.subcatId) + '</select>';
        html += '<select onchange="ordOnRowSvc(' + i + ', this.value, this.options[this.selectedIndex])">' + ordSvcOptions(r.catId, r.subcatId, r.svcId) + '</select>';
      } else {
        html += '<select disabled><option>—</option></select>';
        html += '<select disabled><option>—</option></select>';
      }
    }
    // Цена
    html += '<input type="number" class="ord-price" value="' + (r.price || 0) + '" placeholder="0" min="0" step="100" oninput="ordOnRowPrice(' + i + ', this.value)">';
    // Удаление
    html += '<button type="button" class="ord-row-del" onclick="ordRemoveRow(' + i + ')">✕</button>';
    html += '</div>';
  }
  el.innerHTML = html;
}

function ordEscape(s) {
  if (!s) return '';
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function ordCatOptions(selected) {
  var html = '<option value="">— Категория —</option>';
  for (var i = 0; i < ORD_PRICE_CATS.length; i++) {
    var c = ORD_PRICE_CATS[i];
    var sel = (String(c.id) === String(selected)) ? ' selected' : '';
    html += '<option value="' + c.id + '"' + sel + '>' + c.name + '</option>';
  }
  return html;
}

function ordOnRowManualName(idx, val) {
  ORD_ROWS[idx].svcName = val;
}

function ordSubcatOptions(catId, selected) {
  var subs = ORD_PRICE_SUBCATS.filter(function(s) { return String(s.category_id) === String(catId); });
  if (subs.length === 0) {
    return '<option value="">(любая)</option>';
  }
  var html = '<option value="">— Подкатегория —</option>';
  for (var i = 0; i < subs.length; i++) {
    var sel = (String(subs[i].id) === String(selected)) ? ' selected' : '';
    html += '<option value="' + subs[i].id + '"' + sel + '>' + subs[i].name + '</option>';
  }
  return html;
}

function ordSvcOptions(catId, subcatId, selected) {
  var svcs;
  if (subcatId) {
    svcs = ORD_PRICE_SERVICES.filter(function(s) { return String(s.subcategory_id) === String(subcatId); });
  } else {
    svcs = ORD_PRICE_SERVICES.filter(function(s) { return String(s.category_id) === String(catId); });
  }
  if (svcs.length === 0) return '<option value="">— Нет услуг —</option>';
  var html = '<option value="">— Услуга —</option>';
  for (var i = 0; i < svcs.length; i++) {
    var sel = (String(svcs[i].id) === String(selected)) ? ' selected' : '';
    html += '<option value="' + svcs[i].id + '" data-name="' + svcs[i].name + '"' + sel + '>' + svcs[i].name + '</option>';
  }
  return html;
}

function ordOnRowCat(idx, val) {
  var r = ORD_ROWS[idx];
  r.catId = val;
  r.subcatId = '';
  r.svcId = '';
  r.svcName = '';
  ordRenderRows();
}

function ordOnRowSubcat(idx, val) {
  var r = ORD_ROWS[idx];
  r.subcatId = val;
  r.svcId = '';
  r.svcName = '';
  ordRenderRows();
}

function ordOnRowSvc(idx, val, opt) {
  var r = ORD_ROWS[idx];
  r.svcId = val;
  r.svcName = opt ? (opt.dataset.name || opt.text) : '';
  ordRecalcTotal();
}

function ordOnRowPrice(idx, val) {
  var p = parseFloat(val) || 0;
  if (p < 0) p = 0;
  ORD_ROWS[idx].price = p;
  ordRecalcTotal();
}

function ordRecalcTotal() {
  var total = 0;
  for (var i = 0; i < ORD_ROWS.length; i++) {
    total += (ORD_ROWS[i].price || 0);
  }
  var el = document.getElementById('ordTotalPrice');
  if (el) el.textContent = total.toLocaleString('ru-RU');
}

function ordLoadPrices(callback) {
  if (ORD_PRICE_CATS !== null) { callback(); return; }
  Promise.all([
    fetch(ORD_SUPABASE_URL + '/rest/v1/service_categories?select=*&order=sort_order.asc,name.asc', { headers: { 'apikey': ORD_SUPABASE_KEY } }).then(function(r) { return r.json(); }),
    fetch(ORD_SUPABASE_URL + '/rest/v1/service_subcategories?select=*&order=sort_order.asc,name.asc', { headers: { 'apikey': ORD_SUPABASE_KEY } }).then(function(r) { return r.json(); }),
    fetch(ORD_SUPABASE_URL + '/rest/v1/services?select=*&order=name.asc', { headers: { 'apikey': ORD_SUPABASE_KEY } }).then(function(r) { return r.json(); })
  ]).then(function(results) {
    ORD_PRICE_CATS = results[0] || [];
    ORD_PRICE_SUBCATS = results[1] || [];
    ORD_PRICE_SERVICES = results[2] || [];

  });
}

function ordResetRows() {
  ORD_ROWS = [{ catId: '', subcatId: '', svcId: '', svcName: '', price: 0, manual: false }];
  ordRenderRows();
  ordRecalcTotal();
}

// Конвертация строк таблицы ORD_ROWS → массив услуг для сохранения
function ordRowsToServices() {
  var services = [];
  for (var i = 0; i < ORD_ROWS.length; i++) {
    var r = ORD_ROWS[i];
    if (!r.svcName) continue; // пустые строки пропускаем
    services.push({
      name: r.svcName,
      serviceId: r.manual ? null : (r.svcId ? parseInt(r.svcId) : null),
      manual: r.manual,
      price: Number(r.price) || 0
    });
  }
  return services;
}

// Загрузка сохранённых услуг → строки таблицы
function ordServicesToRows(services) {
  ORD_ROWS = [];
  if (!services || services.length === 0) {
    ORD_ROWS.push({ catId: '', subcatId: '', svcId: '', svcName: '', price: 0, manual: false });
    return;
  }
  for (var i = 0; i < services.length; i++) {
    var s = services[i];
    var name = (typeof s === 'string') ? s : (s.name || '');
    var price = (typeof s === 'object' && s.price) ? Number(s.price) : 0;
    var svcId = (typeof s === 'object' && s.serviceId) ? s.serviceId : '';
    // Попробуем найти категорию/подкатегорию по serviceId
    var catId = '', subcatId = '';
    if (svcId && ORD_PRICE_SERVICES) {
      for (var j = 0; j < ORD_PRICE_SERVICES.length; j++) {
        if (String(ORD_PRICE_SERVICES[j].id) === String(svcId)) {
          catId = ORD_PRICE_SERVICES[j].category_id;
          subcatId = ORD_PRICE_SERVICES[j].subcategory_id || '';
          break;
        }
      }
    }
    ORD_ROWS.push({ catId: catId, subcatId: subcatId, svcId: svcId, svcName: name, price: price });
  }
}

// === СОХРАНЕНИЕ ===
function ordSave() {
  var number = document.getElementById('ordField-number').value.trim();
  var carBrand = document.getElementById('ordField-carBrand').value.trim();
  var carPlate = document.getElementById('ordField-carPlate').value.trim().toUpperCase();
  var dateIn = document.getElementById('ordField-dateIn').value;
  var dateOut = document.getElementById('ordField-dateOut').value;
  var status = document.getElementById('ordField-status').value;
  var post = document.getElementById('ordField-post').value;
  var note = document.getElementById('ordField-note').value.trim();
  var carColor = ordGetSelectedColor();

  // Считаем итоговую цену и собираем услуги из строк таблицы
  var services = ordRowsToServices();
  var totalPrice = 0;
  for (var i = 0; i < services.length; i++) {
    totalPrice += (services[i].price || 0);
  }

  if (!number) { alert('Укажите номер заказ-наряда'); return; }
  if (!carBrand) { alert('Укажите марку/модель авто'); return; }
  if (!carPlate) { alert('⚠️ Без госномера сохранение невозможно.\n\nУкажите госномер авто.'); return; }
  if (!dateIn) { alert('Укажите дату заезда'); return; }
  if (!dateOut) { alert('Укажите дату выезда'); return; }

  if (post === 'auto') {
    ordGetAll(function(orders) {
      post = String(ordFindFreePost(dateIn, dateOut, ORD_EDITING_ID, orders));
      ordDoSave(number, carBrand, carPlate, carColor, dateIn, dateOut, status, post, note, totalPrice, services);
    });
  } else {
    ordDoSave(number, carBrand, carPlate, carColor, dateIn, dateOut, status, post, note, totalPrice, services);
  }
}

function ordDoSave(number, carBrand, carPlate, carColor, dateIn, dateOut, status, post, note, price, services) {
  var data = {
    number: number, car_brand: carBrand, car_plate: carPlate, car_color: carColor,
    date_in: dateIn, date_out: dateOut, status: status, post: post,
    note: note || '', price: Number(price) || 0, services: services
  };

  var saveBtn = document.querySelector('.ord-btn-save');
  if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = '⏳ Сохранение...'; }

  var url, method;
  if (ORD_EDITING_ID) {
    url = ORD_SUPABASE_URL + '/rest/v1/orders?id=eq.' + encodeURIComponent(ORD_EDITING_ID);
    method = 'PATCH';
  } else {
    url = ORD_SUPABASE_URL + '/rest/v1/orders';
    method = 'POST';
  }

  fetch(url, {
    method: method,
    headers: {
      'apikey': ORD_SUPABASE_KEY,
      'Authorization': 'Bearer ' + ORD_SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation'
    },
    body: JSON.stringify(data)
  })
    .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function() {
      ordInvalidateCache();
      // Если заказ-наряд в работе — создаём/обновляем записи в "Расчётах" для контрагентов
      if (status === 'in_progress') {
        ordPushContractorPayments(ORD_EDITING_ID, number, dateOut || dateIn, services, price);
      }
      ordCloseForm();
      ordRender();
    })
    .catch(function(e) {
      console.error('Ошибка сохранения:', e);
      alert('❌ Ошибка сохранения: ' + e.message);
      if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = '💾 Сохранить'; }
    });
}

// Создать записи в таблице entries (Раздел "Расчёты") для всех контрагентов заказ-наряда
// Вызывается при переводе заказ-наряда в статус "Готово"
function ordPushContractorPayments(orderId, orderNumber, orderDate, services, orderTotal) {
  if (!orderId) return;
  // 0. Удаляем старые записи этого заказ-наряда (по комментарию "Заказ #XXX")
  // чтобы при повторном сохранении не было дублей
  var oldCommentPattern = 'Заказ #' + orderNumber + ' %';
  var delUrl = ORD_SUPABASE_URL + '/rest/v1/entries?comments=like.' + encodeURIComponent(oldCommentPattern) + '&contractor_id=not.is.null';
  fetch(delUrl, {
    method: 'DELETE',
    headers: {
      'apikey': ORD_SUPABASE_KEY,
      'Authorization': 'Bearer ' + ORD_SUPABASE_KEY
    }
  }).then(function(r) {
    if (!r.ok) console.error('Ошибка удаления старых записей: HTTP ' + r.status);
    // Продолжаем в любом случае
    // 1. Загружаем: компоненты услуг, цены (с contractor_id) и доп. расходы
  var svcIds = [];
  for (var i = 0; i < services.length; i++) {
    var sid = services[i].serviceId;
    if (sid && svcIds.indexOf(sid) === -1) svcIds.push(sid);
  }
  var compUrl = ORD_SUPABASE_URL + '/rest/v1/service_components?select=*&service_id=in.(' + svcIds.join(',') + ')';
  var costUrl = ORD_SUPABASE_URL + '/rest/v1/order_component_costs?select=*&order_id=eq.' + encodeURIComponent(orderId);
  var extraUrl = ORD_SUPABASE_URL + '/rest/v1/order_extra_costs?select=*&order_id=eq.' + encodeURIComponent(orderId);
  var contrUrl = ORD_SUPABASE_URL + '/rest/v1/contractors?select=id,category,name,phone';

    return Promise.all([
      svcIds.length ? fetch(compUrl, { headers: { 'apikey': ORD_SUPABASE_KEY, 'Authorization': 'Bearer ' + ORD_SUPABASE_KEY } }).then(function(r) { return r.json(); }) : Promise.resolve([]),
      fetch(costUrl, { headers: { 'apikey': ORD_SUPABASE_KEY, 'Authorization': 'Bearer ' + ORD_SUPABASE_KEY } }).then(function(r) { return r.json(); }),
      fetch(extraUrl, { headers: { 'apikey': ORD_SUPABASE_KEY, 'Authorization': 'Bearer ' + ORD_SUPABASE_KEY } }).then(function(r) { return r.json(); }),
      fetch(contrUrl, { headers: { 'apikey': ORD_SUPABASE_KEY, 'Authorization': 'Bearer ' + ORD_SUPABASE_KEY } }).then(function(r) { return r.json(); })
    ]);
  }).then(function(results) {
    var comps = results[0] || [];
    var costs = results[1] || [];
    var extras = results[2] || [];
    var contrs = results[3] || [];

    // Карта: componentId → { serviceName, componentName }
    var compMap = {};
    for (var i = 0; i < comps.length; i++) {
      // Найти название услуги для этого компонента
      var svcName = '';
      for (var j = 0; j < services.length; j++) {
        if (services[j].serviceId === comps[i].service_id) { svcName = services[j].name; break; }
      }
      compMap[comps[i].id] = { serviceName: svcName, componentName: comps[i].name };
    }
    // Карта: contractorId → name
    var contrMap = {};
    for (var k = 0; k < contrs.length; k++) {
      contrMap[contrs[k].id] = contrs[k];
    }

    // Формируем дату (ДД.ММ.ГГГГ)
    var dt = orderDate ? new Date(orderDate) : new Date();
    var dd = String(dt.getDate()).padStart(2, '0');
    var mm = String(dt.getMonth() + 1).padStart(2, '0');
    var yyyy = dt.getFullYear();
    var dateStr = dd + '.' + mm + '.' + yyyy;
    var entryDate = yyyy + '-' + mm + '-' + dd;

    var tasks = [];

    // 2. Компоненты с contractor_id и ценой > 0
    for (var ci = 0; ci < costs.length; ci++) {
      var cost = costs[ci];
      if (!cost.contractor_id) continue;
      var price = Number(cost.price) || 0;
      if (price <= 0) continue;
      var compInfo = compMap[cost.component_id] || { serviceName: '', componentName: '' };
      var contr = contrMap[cost.contractor_id] || { name: '' };
      var comment = 'Заказ #' + orderNumber + ' от ' + dateStr + ' • ' + compInfo.serviceName;
      if (compInfo.componentName) comment += ' → ' + compInfo.componentName;
      tasks.push(ordPushOnePayment(contr, price, comment, entryDate, cost.contractor_id));
    }

    // 3. Доп. расходы с contractor_id и ценой > 0
    for (var ei = 0; ei < extras.length; ei++) {
      var ex = extras[ei];
      if (!ex.contractor_id) continue;
      var exPrice = Number(ex.price) || 0;
      if (exPrice <= 0) continue;
      var exContr = contrMap[ex.contractor_id] || { name: '' };
      var exComment = 'Заказ #' + orderNumber + ' от ' + dateStr + ' • Доп. расход';
      if (ex.name) exComment += ' → ' + ex.name;
      tasks.push(ordPushOnePayment(exContr, exPrice, exComment, entryDate, ex.contractor_id));
    }

    if (tasks.length === 0) {
      console.log('Нет контрагентов с суммами для записей в расчёты');
      return;
    }
    console.log('Создаём ' + tasks.length + ' записей в "Расчёты" для контрагентов');
    Promise.all(tasks).then(function() {
      console.log('✅ Записи в "Расчёты" созданы');
    }).catch(function(e) {
      console.error('Ошибка создания записей в расчёты:', e);
    });
  }).catch(function(e) {
    console.error('Ошибка загрузки данных для расчётов:', e);
  });
}

// Тестовая функция для ручного запуска из консоли
function ordTestPayments(orderId) {
  if (!orderId) { console.log('Укажите orderId'); return; }
  fetch(ORD_SUPABASE_URL + '/rest/v1/orders?id=eq.' + encodeURIComponent(orderId) + '&select=*', {
    headers: { 'apikey': ORD_SUPABASE_KEY, 'Authorization': 'Bearer ' + ORD_SUPABASE_KEY }
  }).then(function(r) { return r.json(); }).then(function(rows) {
    if (!rows.length) { console.log('Заказ не найден'); return; }
    var o = rows[0];
    console.log('Тестируем заказ #' + o.number, o);
    ordPushContractorPayments(o.id, o.number, o.date_out || o.date_in, o.services || [], o.price);
  });
}

function ordPushOnePayment(contr, amount, comment, entryDate, contractorId) {
  var body = {
    name: contr.name || '',
    amount: Math.round(amount * 100) / 100,
    comments: comment,
    entry_date: entryDate,
    is_checked: false,
    contractor_id: contractorId
  };
  return fetch(ORD_SUPABASE_URL + '/rest/v1/entries', {
    method: 'POST',
    headers: {
      'apikey': ORD_SUPABASE_KEY,
      'Authorization': 'Bearer ' + ORD_SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'return=minimal'
    },
    body: JSON.stringify(body)
  }).then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  });
}

    }
  })

          }
        }).then(function(r) {
          if (!r.ok) console.error('Ошибка удаления записей из расчётов: HTTP ' + r.status);
          else console.log('Удалены записи из расчётов для заказа #' + orderNumber);
        }).catch(function(e) {
          console.error('Ошибка удаления записей из расчётов:', e);
        });
      }
      ordInvalidateCache();
      ordCloseForm();
      ordRender();
    })
    .catch(function(e) {
      console.error('Ошибка удаления:', e);
      alert('❌ Ошибка удаления: ' + e.message);
    });
}

// === РАСЧЁТ СТОИМОСТИ ===

var ORD_CALC_ORDER = null;
var ORD_CALC_COMPONENTS = {};
var ORD_CALC_COSTS = {};
var ORD_CALC_EXTRA = []; // [{id, name, price, contractorId}] — доп. расходы заказ-наряда
var ORD_CALC_CONTRACTORS = []; // [{id, category, name, phone}] — список контрагентов
var ORD_CALC_COMP_CONTRACTORS = {}; // { componentId: contractorId } — контакты компонентов
var ORD_CALC_EXTRA_DEL = []; // id доп. расходов на удаление
var ORD_CALC_DIRTY = false; // были ли несохранённые изменения
var ORD_CALC_EXTRA_DEL = []; // id доп. расходов на удаление

function ordOpenCalc(orderId) {
  ordGetAll(function(orders) {
    var o = orders.find(function(x) { return x.id === orderId; });
    if (!o) { alert('Заказ не найден'); return; }
    ORD_CALC_ORDER = o;
    document.getElementById('ordCalcModal').classList.add('show');
    document.getElementById('ordCalcBody').innerHTML = '<div class="ord-calc-loading">Загрузка...</div>';
    ORD_CALC_DIRTY = false;
    ordCalcRender();
  });
}

function ordCloseCalc() {
  if (ORD_CALC_DIRTY) {
    if (!confirm('Есть несохранённые изменения. Закрыть без сохранения?')) return;
  }
  document.getElementById('ordCalcModal').classList.remove('show');
  ORD_CALC_ORDER = null;
  ORD_CALC_COMPONENTS = {};
  ORD_CALC_COSTS = {};
  ORD_CALC_EXTRA = [];
  ORD_CALC_EXTRA_DEL = [];
  ORD_CALC_CONTRACTORS = [];
  ORD_CALC_COMP_CONTRACTORS = {};
  ORD_CALC_DIRTY = false;
}

function ordCalcRender() {
  var o = ORD_CALC_ORDER;
  if (!o) return;
  var services = o.services || [];
  if (services.length === 0) {
    document.getElementById('ordCalcBody').innerHTML = '<div class="ord-calc-nosvc">В этом заказ-наряде нет услуг</div>';
    return;
  }
  var svcIds = [];
  for (var i = 0; i < services.length; i++) {
    var sid = services[i].serviceId;
    if (sid && svcIds.indexOf(sid) === -1) svcIds.push(sid);
  }
  if (svcIds.length === 0) {
    var extraUrl2 = ORD_SUPABASE_URL + '/rest/v1/order_extra_costs?select=*&order_id=eq.' + encodeURIComponent(o.id) + '&order=sort_order.asc,created_at.asc';
    var contrUrl2 = ORD_SUPABASE_URL + '/rest/v1/contractors?select=id,category,name,phone&order=category.asc,name.asc';
    Promise.all([
      fetch(extraUrl2, { headers: { 'apikey': ORD_SUPABASE_KEY, 'Authorization': 'Bearer ' + ORD_SUPABASE_KEY } }).then(function(r) { return r.json(); }),
      fetch(contrUrl2, { headers: { 'apikey': ORD_SUPABASE_KEY, 'Authorization': 'Bearer ' + ORD_SUPABASE_KEY } }).then(function(r) { return r.json(); })
    ]).then(function(results2) {
      var rows = results2[0] || [];
      var contrs2 = results2[1] || [];
      ORD_CALC_CONTRACTORS = contrs2;
      ORD_CALC_EXTRA = rows.map(function(r) { return { id: r.id, name: r.name || '', price: Number(r.price) || 0, contractorId: r.contractor_id ? Number(r.contractor_id) : null }; });
      ORD_CALC_EXTRA_DEL = [];
        var html = ordCalcTopHTML(o) + '<div class="ord-calc-nosvc">Услуги без состава (ручные)</div>';
        for (var i = 0; i < services.length; i++) {
          html += ordCalcAccHTML(services[i], i, true);
        }
        html += ordCalcExtraHTML();
        html += ordCalcBottomHTML();
        document.getElementById('ordCalcBody').innerHTML = html;
        ordCalcRecalcAll();
      });
    return;
  }
  var compUrl = ORD_SUPABASE_URL + '/rest/v1/service_components?select=*&service_id=in.(' + svcIds.join(',') + ')&order=service_id.asc,sort_order.asc,name.asc';
  var costUrl = ORD_SUPABASE_URL + '/rest/v1/order_component_costs?select=*&order_id=eq.' + encodeURIComponent(o.id);
  var extraUrl = ORD_SUPABASE_URL + '/rest/v1/order_extra_costs?select=*&order_id=eq.' + encodeURIComponent(o.id) + '&order=sort_order.asc,created_at.asc';
  var contrUrl = ORD_SUPABASE_URL + '/rest/v1/contractors?select=id,category,name,phone&order=category.asc,name.asc';
  Promise.all([
    fetch(compUrl, { headers: { 'apikey': ORD_SUPABASE_KEY, 'Authorization': 'Bearer ' + ORD_SUPABASE_KEY } }).then(function(r) { return r.json(); }),
    fetch(costUrl, { headers: { 'apikey': ORD_SUPABASE_KEY, 'Authorization': 'Bearer ' + ORD_SUPABASE_KEY } }).then(function(r) { return r.json(); }),
    fetch(extraUrl, { headers: { 'apikey': ORD_SUPABASE_KEY, 'Authorization': 'Bearer ' + ORD_SUPABASE_KEY } }).then(function(r) { return r.json(); }),
    fetch(contrUrl, { headers: { 'apikey': ORD_SUPABASE_KEY, 'Authorization': 'Bearer ' + ORD_SUPABASE_KEY } }).then(function(r) { return r.json(); })
  ]).then(function(results) {
    var comps = results[0] || [];
    var costs = results[1] || [];
    var extras = results[2] || [];
    var contrs = results[3] || [];
    ORD_CALC_CONTRACTORS = contrs;
    ORD_CALC_COMPONENTS = {};
    for (var i = 0; i < comps.length; i++) {
      var sid = comps[i].service_id;
      if (!ORD_CALC_COMPONENTS[sid]) ORD_CALC_COMPONENTS[sid] = [];
      ORD_CALC_COMPONENTS[sid].push(comps[i]);
    }
    ORD_CALC_COSTS = {};
    ORD_CALC_COMP_CONTRACTORS = {};
    for (var j = 0; j < costs.length; j++) {
      ORD_CALC_COSTS[costs[j].component_id] = Number(costs[j].price) || 0;
      if (costs[j].contractor_id) {
        ORD_CALC_COMP_CONTRACTORS[costs[j].component_id] = Number(costs[j].contractor_id);
      }
    }
    ORD_CALC_EXTRA = extras.map(function(r) { return { id: r.id, name: r.name || '', price: Number(r.price) || 0, contractorId: r.contractor_id ? Number(r.contractor_id) : null }; });
    ORD_CALC_EXTRA_DEL = [];
    var html = ordCalcTopHTML(o);
    for (var i = 0; i < services.length; i++) {
      html += ordCalcAccHTML(services[i], i, false);
    }
    html += ordCalcExtraHTML();
    html += ordCalcBottomHTML();
    document.getElementById('ordCalcBody').innerHTML = html;
    // Пересчитываем каждый аккордеон (сумма/остаток) + нижний отчёт
    for (var k = 0; k < services.length; k++) {
      ordCalcRecalcAccordion('ordCalcAcc' + k);
    }
    ordCalcRecalcAll();
  }).catch(function(e) {
    console.error('Ошибка загрузки:', e);
    document.getElementById('ordCalcBody').innerHTML = '<div class="ord-calc-nosvc">Ошибка загрузки данных</div>';
  });
}

function ordCalcContractorSelect(selectedId, type, dataVal) {
  // Найти категорию выбранного контакта
  var selCat = '';
  if (selectedId) {
    for (var si = 0; si < ORD_CALC_CONTRACTORS.length; si++) {
      if (Number(ORD_CALC_CONTRACTORS[si].id) === Number(selectedId)) {
        selCat = ORD_CALC_CONTRACTORS[si].category || 'Без категории';
        break;
      }
    }
  }
  // Собираем категории
  var cats = {};
  var catOrder = [];
  for (var i = 0; i < ORD_CALC_CONTRACTORS.length; i++) {
    var ct = ORD_CALC_CONTRACTORS[i].category || 'Без категории';
    if (!cats[ct]) { cats[ct] = []; catOrder.push(ct); }
    cats[ct].push(ORD_CALC_CONTRACTORS[i]);
  }
  // 1. Select категории
  var html = '<select class="ord-calc-cat-select" data-type="' + type + '" data-val="' + dataVal + '" onchange="ordCalcOnCategoryChange(this)">';
  html += '<option value="">— категория —</option>';
  for (var ci = 0; ci < catOrder.length; ci++) {
    var sel = (selCat === catOrder[ci]) ? ' selected' : '';
    html += '<option value="' + ordEscape(catOrder[ci]) + '"' + sel + '>' + ordEscape(catOrder[ci]) + '</option>';
  }
  html += '</select>';
  // 2. Select контакта (только из выбранной категории)
  html += '<select class="ord-calc-comp-select" data-type="' + type + '" data-val="' + dataVal + '" onchange="ordCalcOnContractorChange(this)">';
  html += '<option value="">— контакт —</option>';
  if (selCat && cats[selCat]) {
    var list = cats[selCat];
    for (var li = 0; li < list.length; li++) {
      var con = list[li];
      var sel = (Number(selectedId) === Number(con.id)) ? ' selected' : '';
      html += '<option value="' + con.id + '"' + sel + '>' + ordEscape(con.name) + '</option>';
    }
  }
  html += '</select>';
  return html;
}

function ordCalcOnCategoryChange(catSelect) {
  var cat = catSelect.value;
  var type = catSelect.dataset.type;
  var dataVal = catSelect.dataset.val;
  var row = catSelect.parentElement;
  // Найти select контакта в той же строке (следующий select)
  var allSelects = row.querySelectorAll('select');
  var contrSelect = null;
  for (var i = 0; i < allSelects.length; i++) {
    if (allSelects[i] !== catSelect && allSelects[i].classList.contains('ord-calc-comp-select')) {
      contrSelect = allSelects[i];
      break;
    }
  }
  if (!contrSelect) return;
  // Очищаем select контакта
  contrSelect.innerHTML = '<option value="">— контакт —</option>';
  if (cat) {
    // Добавляем контакты только из выбранной категории
    for (var i = 0; i < ORD_CALC_CONTRACTORS.length; i++) {
      var con = ORD_CALC_CONTRACTORS[i];
      var conCat = con.category || 'Без категории';
      if (conCat === cat) {
        var opt = document.createElement('option');
        opt.value = con.id;
        opt.textContent = con.name;
        contrSelect.appendChild(opt);
      }
    }
  }
  // Сбрасываем выбранный контакт
  contrSelect.value = '';
  // Обновляем состояние
  if (type === 'comp') {
    ORD_CALC_COMP_CONTRACTORS[dataVal] = null;
  } else if (type === 'extra') {
    var idx = parseInt(dataVal, 10);
    if (!isNaN(idx) && ORD_CALC_EXTRA[idx]) {
      ORD_CALC_EXTRA[idx].contractorId = null;
    }
  }
  ORD_CALC_DIRTY = true;
  var hint = document.getElementById('ordCalcDirtyHint');
  if (hint) hint.style.display = 'inline';
  var btn = document.getElementById('ordCalcSaveBtn');
  if (btn) btn.classList.add('dirty');
}

function ordCalcOnContractorChange(contrSelect) {
  var val = contrSelect.value ? parseInt(contrSelect.value, 10) : null;
  var type = contrSelect.dataset.type;
  var dataVal = contrSelect.dataset.val;
  if (type === 'comp') {
    ORD_CALC_COMP_CONTRACTORS[dataVal] = val;
  } else if (type === 'extra') {
    var idx = parseInt(dataVal, 10);
    if (!isNaN(idx) && ORD_CALC_EXTRA[idx]) {
      ORD_CALC_EXTRA[idx].contractorId = val;
    }
  }
  ORD_CALC_DIRTY = true;
  var hint = document.getElementById('ordCalcDirtyHint');
  if (hint) hint.style.display = 'inline';
  var btn = document.getElementById('ordCalcSaveBtn');
  if (btn) btn.classList.add('dirty');
}

function ordCalcExtraHTML() {
  var html = '<div class="ord-calc-extra">';
  html += '<div class="ord-calc-extra-head">';
  html += '<div class="ord-calc-extra-title">➕ Доп. расходы</div>';
  html += '<button type="button" class="ord-calc-extra-add" onclick="ordCalcExtraAdd()">+ Добавить</button>';
  html += '</div>';
  html += '<div id="ordCalcExtraList">';
  if (ORD_CALC_EXTRA.length === 0) {
    html += '<div class="ord-calc-extra-empty">Нет доп. расходов</div>';
  } else {
    for (var i = 0; i < ORD_CALC_EXTRA.length; i++) {
      var ex = ORD_CALC_EXTRA[i];
      html += '<div class="ord-calc-extra-row">';
      html += '<input type="text" class="ord-calc-extra-name" placeholder="Название" value="' + ordEscape(ex.name) + '" data-ex="' + i + '" oninput="ordCalcExtraEdit(this,\'name\')">';
      html += '<input type="number" class="ord-calc-extra-price" inputmode="decimal" min="0" step="any" placeholder="0" value="' + (ex.price || '') + '" data-ex="' + i + '" oninput="ordCalcExtraEdit(this,\'price\')">';
      html += ordCalcContractorSelect(ex.contractorId, 'extra', i);
      html += '<button type="button" class="ord-calc-extra-del" onclick="ordCalcExtraDel(' + i + ')">✕</button>';
      html += '</div>';
    }
  }
  html += '</div>';
  html += '</div>';
  return html;
}

function ordCalcExtraAdd() {
  ORD_CALC_EXTRA.push({ id: null, name: '', price: 0, contractorId: null });
  ORD_CALC_DIRTY = true;
  var listEl = document.getElementById('ordCalcExtraList');
  if (listEl) {
    var wrap = listEl.parentElement;
    wrap.outerHTML = ordCalcExtraHTML();
  }
  ordCalcRecalcAll();
  var hint = document.getElementById('ordCalcDirtyHint');
  if (hint) hint.style.display = 'inline';
  var btn = document.getElementById('ordCalcSaveBtn');
  if (btn) btn.classList.add('dirty');
}

function ordCalcExtraEdit(input, field) {
  var idx = parseInt(input.dataset.ex, 10);
  if (isNaN(idx) || !ORD_CALC_EXTRA[idx]) return;
  if (field === 'name') {
    ORD_CALC_EXTRA[idx].name = input.value;
  } else {
    ORD_CALC_EXTRA[idx].price = Math.round((parseFloat(input.value) || 0) * 100) / 100;
  }
  ORD_CALC_DIRTY = true;
  ordCalcRecalcAll();
  var hint = document.getElementById('ordCalcDirtyHint');
  if (hint) hint.style.display = 'inline';
  var btn = document.getElementById('ordCalcSaveBtn');
  if (btn) btn.classList.add('dirty');
}

function ordCalcExtraDel(idx) {
  if (isNaN(idx) || !ORD_CALC_EXTRA[idx]) return;
  if (ORD_CALC_EXTRA[idx].id) {
    ORD_CALC_EXTRA_DEL.push(ORD_CALC_EXTRA[idx].id);
  }
  ORD_CALC_EXTRA.splice(idx, 1);
  ORD_CALC_DIRTY = true;
  var listEl = document.getElementById('ordCalcExtraList');
  if (listEl) {
    var wrap = listEl.parentElement;
    wrap.outerHTML = ordCalcExtraHTML();
  }
  ordCalcRecalcAll();
  var hint = document.getElementById('ordCalcDirtyHint');
  if (hint) hint.style.display = 'inline';
  var btn = document.getElementById('ordCalcSaveBtn');
  if (btn) btn.classList.add('dirty');
}

function ordCalcTopHTML(o) {
  var orderTotal = Number(o.price) || 0;
  var html = '<div class="ord-calc-top">';
  html += '<div class="ord-calc-top-label">Сумма заказ-наряда</div>';
  html += '<div class="ord-calc-top-value" id="ordCalcTopValue">' + ordFormatPrice(orderTotal) + ' ₽</div>';
  html += '</div>';
  return html;
}

function ordCalcBottomHTML() {
  var html = '<div class="ord-calc-bottom">';
  html += '<div class="ord-calc-bot-title">📋 Отчёт</div>';
  html += '<div class="ord-calc-sum-row"><span>Сумма заказ-наряда:</span><span class="ord-calc-bot-total" id="ordCalcBotTotal">—</span></div>';
  html += '<div class="ord-calc-sum-row"><span>Затраты по услугам:</span><span class="ord-calc-bot-spent" id="ordCalcBotSpent">—</span></div>';
  html += '<div class="ord-calc-sum-row"><span>Доп. расходы:</span><span class="ord-calc-bot-extra" id="ordCalcBotExtra">—</span></div>';
  html += '<div class="ord-calc-sum-row total"><span>Прибыль:</span><span class="ord-calc-bot-profit" id="ordCalcBotProfit">—</span></div>';
  html += '<div class="ord-calc-save-wrap">';
  html += '<button type="button" class="ord-calc-save-btn" id="ordCalcSaveBtn" onclick="ordCalcSaveAll()">💾 Сохранить</button>';
  html += '<span class="ord-calc-dirty-hint" id="ordCalcDirtyHint" style="display:none;">несохранённые изменения</span>';
  html += '</div>';
  html += '</div>';
  return html;
}

function ordCalcAccHTML(svc, idx, isManual) {
  var name = svc.name || '—';
  var price = Number(svc.price) || 0;
  var sid = svc.serviceId;
  var components = (sid && ORD_CALC_COMPONENTS[sid]) || [];
  var accId = 'ordCalcAcc' + idx;
  var html = '<div class="ord-calc-accordion' + (idx === 0 ? ' open' : '') + '" id="' + accId + '">';
  html += '<div class="ord-calc-acc-head" onclick="ordCalcToggle(\'' + accId + '\')">';
  html += '<span class="ord-calc-acc-arrow">▶</span>';
  html += '<span class="ord-calc-acc-name">' + ordEscape(name) + '</span>';
  if (price > 0) {
    html += '<span class="ord-calc-acc-price">' + ordFormatPrice(price) + ' ₽</span>';
  } else {
    html += '<span class="ord-calc-acc-price zero">—</span>';
  }
  html += '</div>';
  html += '<div class="ord-calc-acc-body">';
  if (isManual) {
    html += '<div class="ord-calc-comp-empty">Ручная услуга — состав не задан</div>';
  } else if (components.length === 0) {
    html += '<div class="ord-calc-comp-empty">Состав не задан. Добавьте в разделе «Расчёт стоимости»</div>';
  } else {
    for (var i = 0; i < components.length; i++) {
      var comp = components[i];
      var cost = ORD_CALC_COSTS[comp.id] || '';
      html += '<div class="ord-calc-comp">';
      html += '<span class="ord-calc-comp-num">' + (i + 1) + '.</span>';
      html += '<span class="ord-calc-comp-name">' + ordEscape(comp.name) + '</span>';
      html += '<input type="number" class="ord-calc-comp-input" inputmode="decimal" min="0" step="any" placeholder="0" value="' + cost + '" data-comp="' + comp.id + '" data-acc="' + accId + '" oninput="ordCalcOnPriceInput(this)">';
      html += '<span class="ord-calc-comp-cur">₽</span>';
      var compContrId = ORD_CALC_COMP_CONTRACTORS[comp.id] || null;
      html += ordCalcContractorSelect(compContrId, 'comp', comp.id);
      html += '</div>';
    }
    html += '<div class="ord-calc-summary" id="' + accId + '_summary">';
    html += '<div class="ord-calc-sum-row"><span>Сумма расходов:</span><span class="ord-calc-sum-spent" id="' + accId + '_spent">0 ₽</span></div>';
    html += '<div class="ord-calc-sum-row total"><span>Остаток:</span><span class="ord-calc-sum-rest pos" id="' + accId + '_rest">' + ordFormatPrice(price) + ' ₽</span></div>';
    html += '</div>';
  }
  html += '</div>';
  html += '</div>';
  return html;
}

function ordCalcOnPriceInput(input) {
  var compId = input.dataset.comp;
  var accId = input.dataset.acc;
  var val = Math.round((parseFloat(input.value) || 0) * 100) / 100;
  ORD_CALC_COSTS[compId] = val;
  ORD_CALC_DIRTY = true;
  ordCalcRecalcAccordion(accId);
  ordCalcRecalcAll();
  var hint = document.getElementById('ordCalcDirtyHint');
  if (hint) hint.style.display = 'inline';
  var btn = document.getElementById('ordCalcSaveBtn');
  if (btn) btn.classList.add('dirty');
}

function ordCalcRecalcAll() {
  var o = ORD_CALC_ORDER;
  if (!o) return;
  var services = o.services || [];
  var orderTotal = Math.round((Number(o.price) || 0) * 100) / 100;
  // Берём суммы из DOM (как ordCalcRecalcAccordion) — надёжнее
  var totalSpent = 0;
  var allInputs = document.querySelectorAll('.ord-calc-comp-input');
  for (var i = 0; i < allInputs.length; i++) {
    totalSpent += (parseFloat(allInputs[i].value) || 0);
  }
  totalSpent = Math.round(totalSpent * 100) / 100;
  // Доп. расходы (из DOM)
  var extraSpent = 0;
  var extraInputs = document.querySelectorAll('.ord-calc-extra-price');
  for (var j = 0; j < extraInputs.length; j++) {
    extraSpent += (parseFloat(extraInputs[j].value) || 0);
  }
  extraSpent = Math.round(extraSpent * 100) / 100;
  var profit = Math.round((orderTotal - totalSpent - extraSpent) * 100) / 100;
  var totalEl = document.getElementById('ordCalcBotTotal');
  var spentEl = document.getElementById('ordCalcBotSpent');
  var profitEl = document.getElementById('ordCalcBotProfit');
  var extraEl = document.getElementById('ordCalcBotExtra');
  if (totalEl) totalEl.textContent = ordFormatPrice(orderTotal) + ' ₽';
  if (spentEl) spentEl.textContent = ordFormatPrice(totalSpent) + ' ₽';
  if (extraEl) extraEl.textContent = ordFormatPrice(extraSpent) + ' ₽';
  if (profitEl) {
    profitEl.textContent = (profit < 0 ? '−' + ordFormatPrice(Math.abs(profit)) : ordFormatPrice(profit)) + ' ₽';
    profitEl.className = 'ord-calc-bot-profit ' + (profit < 0 ? 'neg' : (profit === 0 ? 'zero' : 'pos'));
  }
}

function ordCalcRecalcAccordion(accId) {
  var acc = document.getElementById(accId);
  if (!acc) return;
  var inputs = acc.querySelectorAll('.ord-calc-comp-input');
  var spent = 0;
  for (var i = 0; i < inputs.length; i++) {
    spent += (parseFloat(inputs[i].value) || 0);
  }
  spent = Math.round(spent * 100) / 100;
  var svc = ordCalcFindSvcByAccId(accId);
  var price = Math.round((svc ? (Number(svc.price) || 0) : 0) * 100) / 100;
  var rest = Math.round((price - spent) * 100) / 100;
  var spentEl = document.getElementById(accId + '_spent');
  var restEl = document.getElementById(accId + '_rest');
  if (spentEl) spentEl.textContent = ordFormatPrice(spent) + ' ₽';
  if (restEl) {
    restEl.textContent = (rest < 0 ? '−' + ordFormatPrice(Math.abs(rest)) : ordFormatPrice(rest)) + ' ₽';
    restEl.className = 'ord-calc-sum-rest ' + (rest < 0 ? 'neg' : (rest === 0 ? 'zero' : 'pos'));
  }
}

function ordCalcFindSvcByAccId(accId) {
  var idx = parseInt(accId.replace('ordCalcAcc', ''), 10);
  var services = (ORD_CALC_ORDER && ORD_CALC_ORDER.services) || [];
  return services[idx] || null;
}

function ordCalcSaveAll() {
  if (!ORD_CALC_ORDER) return;
  var btn = document.getElementById('ordCalcSaveBtn');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Сохранение...'; }
  var order_id = ORD_CALC_ORDER.id;
  var services = ORD_CALC_ORDER.services || [];
  var tasks = [];
  for (var i = 0; i < services.length; i++) {
    var sid = services[i].serviceId;
    var components = (sid && ORD_CALC_COMPONENTS[sid]) || [];
    for (var j = 0; j < components.length; j++) {
      var compId = components[j].id;
      var price = ORD_CALC_COSTS[compId] || 0;
      tasks.push(ordCalcSaveOne(order_id, compId, price));
    }
  }
  if (tasks.length === 0) {
    if (btn) { btn.disabled = false; btn.textContent = '💾 Сохранить'; }
    ORD_CALC_DIRTY = false;
    return;
  }
  // 2. Сохраняем доп. расходы
  for (var k = 0; k < ORD_CALC_EXTRA.length; k++) {
    var ex = ORD_CALC_EXTRA[k];
    tasks.push(ordCalcSaveExtra(order_id, ex));
  }
  // 3. Удаляем помеченные
  for (var m = 0; m < ORD_CALC_EXTRA_DEL.length; m++) {
    tasks.push(ordCalcDelExtra(ORD_CALC_EXTRA_DEL[m]));
  }
  Promise.all(tasks).then(function() {
    if (btn) { btn.disabled = false; btn.textContent = '💾 Сохранить'; btn.classList.remove('dirty'); }
    var hint = document.getElementById('ordCalcDirtyHint');
    if (hint) hint.style.display = 'none';
    ORD_CALC_DIRTY = false;
    ORD_CALC_EXTRA_DEL = [];
  }).catch(function(e) {
    console.error('Ошибка сохранения:', e);
    if (btn) { btn.disabled = false; btn.textContent = '💾 Сохранить'; }
    alert('❌ Ошибка сохранения: ' + e.message);
  });
}

function ordCalcSaveOne(order_id, compId, price) {
  // on_conflict указывает PostgREST делать UPSERT по (order_id, component_id)
  var url = ORD_SUPABASE_URL + '/rest/v1/order_component_costs?on_conflict=order_id,component_id';
  return fetch(url, {
    method: 'POST',
    headers: {
      'apikey': ORD_SUPABASE_KEY,
      'Authorization': 'Bearer ' + ORD_SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'resolution=merge-duplicates'
    },
    body: JSON.stringify({
      order_id: order_id,
      component_id: compId,
      price: Number(price) || 0,
      contractor_id: ORD_CALC_COMP_CONTRACTORS[compId] || null,
      updated_at: new Date().toISOString()
    })
  }).then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    // тело может быть пустым — не парсим
    return r.text();
  });
}

function ordCalcSaveExtra(order_id, ex) {
  var url = ORD_SUPABASE_URL + '/rest/v1/order_extra_costs';
  var body = {
    order_id: order_id,
    name: ex.name || '',
    price: Number(ex.price) || 0,
    contractor_id: ex.contractorId || null,
    sort_order: 0
  };
  var method = 'POST';
  var headers = {
    'apikey': ORD_SUPABASE_KEY,
    'Authorization': 'Bearer ' + ORD_SUPABASE_KEY,
    'Content-Type': 'application/json',
    'Prefer': 'return=representation'
  };
  if (ex.id) {
    url = url + '?id=eq.' + encodeURIComponent(ex.id);
    method = 'PATCH';
  }
  return fetch(url, {
    method: method,
    headers: headers,
    body: JSON.stringify(body)
  }).then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  });
}

function ordCalcDelExtra(extraId) {
  var url = ORD_SUPABASE_URL + '/rest/v1/order_extra_costs?id=eq.' + encodeURIComponent(extraId);
  return fetch(url, {
    method: 'DELETE',
    headers: {
      'apikey': ORD_SUPABASE_KEY,
      'Authorization': 'Bearer ' + ORD_SUPABASE_KEY
    }
  }).then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  });
}

function ordCalcToggle(accId) {
  var el = document.getElementById(accId);
  if (el) el.classList.toggle('open');
}

// === ФИЛЬТРЫ ===// === ФИЛЬТРЫ ===// === ФИЛЬТРЫ ===
function ordInitFilters() {
  var btns = document.querySelectorAll('.ord-filter-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].addEventListener('click', function() {
      for (var j = 0; j < btns.length; j++) btns[j].classList.remove('active');
      this.classList.add('active');
      ORD_FILTER = this.getAttribute('data-filter');
      ordRender();
    });
  }
}

// === АВТОРИЗАЦИЯ + ИНИЦИАЛИЗАЦИЯ ===
function divoCheckAuthAndInit() {
  var user = divoGetUser();
  if (!user) {
    var mainLayout = document.getElementById('divoMainLayout');
    if (mainLayout) mainLayout.style.display = 'none';
    fetch('/components/auth-form.html?v=127')
      .then(function(r) { return r.text(); })
      .then(function(html) {
        var c = document.getElementById('divoAuthContainer');
        if (c) {
          c.innerHTML = html;
          var btn = document.getElementById('divoAuthBtn');
          if (btn) btn.addEventListener('click', divoDoLogin);
          var pass = document.getElementById('divoAuthPassword');
          if (pass) pass.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') divoDoLogin();
          });
        }
      });
    return;
  }

  if (typeof divoLoadAccessConfig === 'function') {
    divoLoadAccessConfig(function() {
      if (!divoHasAccessToSection('orders')) {
        location.href = 'index.html';
        return;
      }
      ordStartPage();
    });
  } else {
    ordStartPage();
  }
}

function ordStartPage() {
  var mainLayout = document.getElementById('divoMainLayout');
  if (mainLayout) mainLayout.style.display = 'flex';
  var authContainer = document.getElementById('divoAuthContainer');
  if (authContainer) authContainer.innerHTML = '';
  divoInit();
  ordInitFilters();
  ordInitDateFilter();
  ordRender();

}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', divoCheckAuthAndInit);
} else {
  divoCheckAuthAndInit();
}
</script>
