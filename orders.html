<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Диво Детейлинг — Заказ-наряды</title>
<link rel="stylesheet" href="/assets/style.css?v=114">
<link rel="stylesheet" href="/assets/auth.css?v=114">
<style>
/* === СТИЛИ СТРАНИЦЫ ЗАКАЗ-НАРЯДОВ === */
.ord-page { padding: 0; }
.ord-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.ord-title { font-size: 24px; font-weight: 800; color: #fafafa; display: flex; align-items: center; gap: 10px; }
.ord-title-count { background: #27272a; color: #a1a1aa; font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 6px; }
.ord-subtitle { font-size: 13px; color: #a1a1aa; margin-top: 4px; }
.ord-btn-create { background: #22c55e; color: #0a0a0a; border: none; padding: 12px 22px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 14px; font-family: inherit; transition: all .15s; display: flex; align-items: center; gap: 8px; }
.ord-btn-create:hover { background: #16a34a; transform: translateY(-1px); }
.ord-form-card { background: #0a0a0a; border: 1.5px solid #27272a; border-radius: 14px; padding: 20px; margin-bottom: 20px; }
.ord-form-card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1.5px solid #27272a; }
.ord-form-card-title { font-size: 18px; font-weight: 800; color: #fafafa; }
.ord-form-card-close { background: #27272a; border: none; color: #a1a1aa; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-family: inherit; }
.ord-form-card-close:hover { background: #3f3f46; color: #fafafa; }
.ord-services-block { margin-top: 16px; }
.ord-services-block-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.ord-manual-toggle { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #a1a1aa; cursor: pointer; user-select: none; font-weight: 600; }
.ord-manual-toggle input { cursor: pointer; width: 16px; height: 16px; }
.ord-manual-toggle input:checked + span { color: #fbbf24; }
.ord-form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; padding-top: 14px; border-top: 1.5px solid #27272a; }
.ord-datebar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; padding: 10px 12px; background: #18181b; border: 1.5px solid #27272a; border-radius: 10px; }
.ord-date-presets { display: flex; gap: 4px; flex-wrap: wrap; }
.ord-date-btn { padding: 7px 12px; background: transparent; color: #a1a1aa; border: 1px solid #27272a; border-radius: 6px; font-size: 12px; font-weight: 600; font-family: inherit; cursor: pointer; transition: all .15s; }
.ord-date-btn:hover { background: #27272a; color: #fafafa; }
.ord-date-btn.active { background: #3b82f6; color: #fafafa; border-color: #3b82f6; font-weight: 700; }
.ord-date-range { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.ord-date-input { background: #0a0a0a; border: 1px solid #27272a; border-radius: 6px; padding: 7px 10px; color: #fafafa; font-size: 12px; font-family: inherit; }
.ord-date-input:focus { outline: none; border-color: #3b82f6; }
.ord-date-sep { color: #52525b; font-size: 13px; }
.ord-date-info { margin-left: auto; font-size: 12px; color: #71717a; font-weight: 600; }
.ord-toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
.ord-filters { display: flex; gap: 4px; background: #18181b; border: 1.5px solid #27272a; border-radius: 12px; padding: 4px; }
.ord-filter-btn { padding: 8px 16px; background: transparent; color: #a1a1aa; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; transition: all .15s; }
.ord-filter-btn:hover { background: #27272a; color: #fafafa; }
.ord-filter-btn.active { background: #3b82f6; color: #fafafa; font-weight: 700; }
.ord-filter-btn .badge { background: rgba(0,0,0,0.2); padding: 1px 6px; border-radius: 4px; font-size: 11px; margin-left: 4px; }
.ord-search { flex: 1; min-width: 200px; position: relative; }
.ord-search input { width: 100%; padding: 10px 14px 10px 38px; background: #18181b; border: 1.5px solid #27272a; border-radius: 10px; color: #fafafa; font-size: 14px; font-family: inherit; }
.ord-search input:focus { outline: none; border-color: #3b82f6; }
.ord-search input::placeholder { color: #52525b; }
.ord-search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 14px; color: #52525b; pointer-events: none; }
.ord-list { display: flex; flex-direction: column; gap: 10px; }
.ord-card { background: #18181b; border: 1.5px solid #27272a; border-radius: 10px; padding: 10px 14px; cursor: pointer; transition: all .15s; display: flex; gap: 10px; align-items: center; }
.ord-card:hover { border-color: #3f3f46; transform: translateY(-1px); }
.ord-card-status-bar { width: 3px; align-self: stretch; border-radius: 2px; flex-shrink: 0; min-height: 32px; }
.ord-card-status-bar.new { background: #71717a; }
.ord-card-status-bar.in_progress { background: #fbbf24; }
.ord-card-status-bar.done { background: #22c55e; }
.ord-card-status-bar.issued { background: #3b82f6; }
.ord-card-main { flex: 1; min-width: 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.ord-card-num { font-size: 14px; font-weight: 800; color: #fafafa; flex-shrink: 0; }
.ord-card-car-color { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.15); }
.ord-card-car { font-size: 14px; font-weight: 600; color: #d4d4d8; display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.ord-card-plate { background: #0a0a0a; border: 1px solid #3f3f46; color: #fafafa; padding: 2px 7px; border-radius: 4px; font-size: 12px; font-weight: 700; font-family: monospace; letter-spacing: 1px; flex-shrink: 0; }
.ord-card-meta { font-size: 13px; color: #a1a1aa; display: flex; align-items: center; gap: 4px; flex-shrink: 0; white-space: nowrap; }
.ord-card-meta b { color: #fafafa; font-weight: 600; }
.ord-card-sep { color: #3f3f46; font-size: 12px; flex-shrink: 0; user-select: none; }
.ord-card-price { font-size: 13px; font-weight: 700; color: #4ade80; background: #052e16; border: 1px solid #166534; padding: 2px 8px; border-radius: 4px; flex-shrink: 0; white-space: nowrap; }
.ord-card-price.zero { color: #71717a; background: #18181b; border-color: #27272a; }
.ord-card-status { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.5px; flex-shrink: 0; margin-left: auto; }
.ord-card-status.new { background: #27272a; color: #a1a1aa; }
.ord-card-status.in_progress { background: #422006; color: #fbbf24; }
.ord-card-status.done { background: #14241a; color: #4ade80; }
.ord-card-status.issued { background: #1e293b; color: #93c5fd; }
.ord-empty { text-align: center; padding: 60px 20px; color: #52525b; }
.ord-empty-icon { font-size: 48px; margin-bottom: 12px; }
.ord-empty-text { font-size: 15px; margin-bottom: 16px; }
.ord-card-calc-btn { background: #1e293b; border: 1.5px solid #1e3a8a; color: #93c5fd; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; white-space: nowrap; flex-shrink: 0; }
.ord-card-calc-btn:hover { background: #1e3a8a; color: #fafafa; }
.ord-calc-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: flex-start; justify-content: center; padding: 20px; overflow-y: auto; }
.ord-calc-overlay.show { display: flex; }
.ord-calc-modal { background: #0a0a0a; border: 1.5px solid #27272a; border-radius: 16px; max-width: 720px; width: 100%; margin: 20px auto; padding: 24px; }
.ord-calc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1.5px solid #27272a; }
.ord-calc-title { font-size: 18px; font-weight: 800; color: #fafafa; }
.ord-calc-close { background: #27272a; border: none; color: #a1a1aa; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 18px; font-family: inherit; }
.ord-calc-close:hover { background: #3f3f46; color: #fafafa; }
.ord-calc-accordion { border: 1.5px solid #27272a; border-radius: 10px; overflow: hidden; margin-bottom: 8px; }
.ord-calc-acc-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #18181b; cursor: pointer; user-select: none; }
.ord-calc-acc-head:hover { background: #1f1f23; }
.ord-calc-acc-arrow { font-size: 12px; color: #71717a; transition: transform .2s; flex-shrink: 0; }
.ord-calc-accordion.open .ord-calc-acc-arrow { transform: rotate(90deg); }
.ord-calc-acc-name { flex: 1; font-size: 15px; font-weight: 700; color: #fafafa; }
.ord-calc-acc-price { font-size: 14px; font-weight: 800; color: #4ade80; }
.ord-calc-acc-price.zero { color: #71717a; }
.ord-calc-acc-body { display: none; padding: 10px 14px 14px; background: #0a0a0a; }
.ord-calc-accordion.open .ord-calc-acc-body { display: block; }
.ord-calc-comp { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px dashed #1f1f23; }
.ord-calc-comp:last-child { border-bottom: none; }
.ord-calc-comp-num { font-size: 12px; font-weight: 700; color: #52525b; min-width: 20px; text-align: right; }
.ord-calc-comp-name { flex: 1; font-size: 13px; color: #d4d4d8; }
.ord-calc-comp-input { width: 120px; background: #0a0a0a; border: 1px solid #27272a; border-radius: 6px; padding: 5px 8px; color: #fbbf24; font-size: 14px; font-weight: 800; font-family: inherit; text-align: right; box-sizing: border-box; }
.ord-calc-comp-input:focus { outline: none; border-color: #fbbf24; }
.ord-calc-comp-input::placeholder { color: #3f3f46; }
.ord-calc-comp-cur { font-size: 13px; color: #52525b; flex-shrink: 0; }
.ord-calc-summary { margin-top: 10px; padding-top: 8px; border-top: 1.5px solid #27272a; }
.ord-calc-sum-row { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; font-size: 13px; color: #a1a1aa; }
.ord-calc-sum-row.total { font-size: 15px; font-weight: 800; color: #fafafa; padding-top: 6px; }
.ord-calc-sum-spent { color: #fbbf24; font-weight: 700; }
.ord-calc-sum-rest.pos { color: #4ade80; font-weight: 800; }
.ord-calc-sum-rest.zero { color: #71717a; font-weight: 800; }
.ord-calc-sum-rest.neg { color: #ef4444; font-weight: 800; }
.ord-calc-comp-empty { text-align: center; color: #52525b; padding: 12px; font-size: 13px; }
.ord-calc-loading { text-align: center; color: #71717a; padding: 40px 20px; font-size: 14px; }
.ord-calc-nosvc { text-align: center; color: #71717a; padding: 30px 20px; font-size: 14px; }
@media (max-width: 600px) { .ord-card-calc-btn { font-size: 11px; padding: 5px 10px; } .ord-calc-modal { padding: 16px; } }

.ord-form-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.ord-form-group { display: flex; flex-direction: column; gap: 6px; }
.ord-form-group.full { grid-column: 1 / -1; }
.ord-form-label { font-size: 12px; font-weight: 700; color: #71717a; text-transform: uppercase; letter-spacing: 0.5px; }
.ord-form-input, .ord-form-select, .ord-form-textarea { background: #18181b; border: 1.5px solid #27272a; border-radius: 8px; padding: 10px 12px; color: #fafafa; font-size: 14px; font-family: inherit; width: 100%; box-sizing: border-box; }
.ord-form-input:focus, .ord-form-select:focus, .ord-form-textarea:focus { outline: none; border-color: #3b82f6; }
.ord-form-textarea { resize: vertical; min-height: 60px; }
.ord-form-hint { font-size: 11px; color: #52525b; }
.ord-color-palette { display: flex; gap: 6px; flex-wrap: wrap; }
.ord-color-swatch { width: 32px; height: 32px; border-radius: 6px; cursor: pointer; border: 2px solid transparent; transition: all .15s; }
.ord-color-swatch:hover { transform: scale(1.1); }
.ord-color-swatch.active { border-color: #fafafa; box-shadow: 0 0 0 2px #0a0a0a; }
.ord-services-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.ord-rows-table { border: 1.5px solid #27272a; border-radius: 10px; overflow: hidden; margin-top: 8px; background: #0a0a0a; }
.ord-row { display: grid; grid-template-columns: 22px 1fr 1fr 1.4fr 100px 26px; gap: 5px; padding: 7px 8px; align-items: center; border-bottom: 1px solid #27272a; }
.ord-row:last-child { border-bottom: none; }
.ord-row-head { background: #18181b; padding: 7px 8px; font-size: 10px; font-weight: 700; color: #71717a; text-transform: uppercase; letter-spacing: 0.3px; }
.ord-row-head div { font-size: 11px; }
.ord-row-body { }
.ord-row-body .ord-row { padding: 6px 8px; background: #18181b; }
.ord-row select, .ord-row input { background: #0a0a0a; border: 1px solid #27272a; border-radius: 5px; padding: 6px 7px; color: #fafafa; font-size: 12px; font-family: inherit; width: 100%; box-sizing: border-box; min-width: 0; }
.ord-row select:focus, .ord-row input:focus { outline: none; border-color: #3b82f6; }
.ord-row select:disabled { opacity: 0.4; cursor: not-allowed; }
.ord-row input.ord-price { color: #4ade80; font-weight: 800; font-size: 14px; text-align: right; background: #052e16; border-color: #166534; padding-right: 8px; }
.ord-row input.ord-price:focus { color: #fafafa; }
.ord-row .ord-row-del { background: transparent; border: none; color: #71717a; cursor: pointer; font-size: 14px; padding: 2px; border-radius: 4px; }
.ord-row .ord-row-del:hover { color: #ef4444; background: #1c0a0a; }
.ord-row-foot { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; background: #18181b; border-top: 1.5px solid #3f3f46; gap: 10px; flex-wrap: wrap; }
.ord-btn-add-row { background: #1e293b; border: 1.5px solid #1e3a8a; color: #93c5fd; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 700; font-family: inherit; }
.ord-btn-add-row:hover { background: #1e3a8a; color: #fafafa; }
.ord-row-total { font-size: 15px; font-weight: 800; color: #4ade80; }
.ord-row-total span { font-size: 17px; }
.ord-row-check { display: flex; align-items: center; justify-content: center; }
.ord-row-check input { width: 13px; height: 13px; cursor: pointer; accent-color: #fbbf24; margin: 0; }
.ord-row input.ord-manual-name { color: #fbbf24; font-weight: 600; }
.ord-row input.ord-manual-name:focus { color: #fafafa; }
.ord-empty-row { text-align: center; color: #52525b; padding: 20px; font-size: 13px; grid-column: 1 / -1; }
@media (max-width: 680px) {
  .ord-row { grid-template-columns: 22px 1fr 1fr 100px 26px; }
  .ord-row-head { display: none; }
  .ord-row input.ord-manual-name { grid-column: span 3; }
  .ord-row input.ord-price { grid-column: span 2; }
  .ord-row .ord-row-del { grid-column: -1; }
}

.ord-btn-cancel { background: #27272a; color: #d4d4d8; border: 1.5px solid #3f3f46; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; font-family: inherit; }
.ord-btn-cancel:hover { background: #3f3f46; }
.ord-btn-save { background: #22c55e; color: #0a0a0a; border: none; padding: 10px 22px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 14px; font-family: inherit; }
.ord-btn-save:hover { background: #16a34a; }
.ord-btn-save:disabled { opacity: 0.6; cursor: not-allowed; }
.ord-btn-delete { background: transparent; color: #ef4444; border: 1.5px solid #7f1d1d; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; font-family: inherit; margin-right: auto; }
.ord-btn-delete:hover { background: #7f1d1d; color: #fca5a5; }
@media (max-width: 900px) { .ord-form-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 600px) { .ord-form-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div id="divoAuthContainer"></div>

<div class="divo-layout" id="divoMainLayout" style="display:none;">
  <header class="divo-header" id="divo-header"></header>
  <div class="divo-body">
    <aside class="divo-sidebar" id="divo-sidebar"></aside>
    <main class="divo-content" id="divoContent">
      <div class="ord-page">
        <div class="ord-top">
          <div>
            <div class="ord-title">📋 Заказ-наряды <span class="ord-title-count" id="ordCount">0</span></div>
            <div class="ord-subtitle">Записи клиентов · посты · услуги</div>
          </div>
          <button class="ord-btn-create" onclick="ordNewOrder()">➕ Создать заказ-наряд</button>
        </div>

        <!-- ФОРМА СОЗДАНИЯ/РЕДАКТИРОВАНИЯ (на странице, не модалка) -->
        <div class="ord-form-card" id="ordFormCard">
          <div class="ord-form-card-head">
            <div class="ord-form-card-title" id="ordFormTitle">Новый заказ-наряд</div>
            <button class="ord-form-card-close" onclick="ordCloseForm()">✕ Свернуть</button>
          </div>

          <div class="ord-form-grid">
            <div class="ord-form-group">
              <label class="ord-form-label">Номер *</label>
              <input type="text" class="ord-form-input" id="ordField-number" placeholder="Напр. 1234">
            </div>
            <div class="ord-form-group">
              <label class="ord-form-label">Пост</label>
              <select class="ord-form-select" id="ordField-post">
                <option value="auto">Авто (свободный)</option>
                <option value="1">Пост 1</option>
                <option value="2">Пост 2</option>
                <option value="3">Пост 3</option>
                <option value="4">Пост 4</option>
              </select>
            </div>
            <div class="ord-form-group">
              <label class="ord-form-label">Марка / модель *</label>
              <input type="text" class="ord-form-input" id="ordField-carBrand" placeholder="Toyota Camry">
            </div>
            <div class="ord-form-group">
              <label class="ord-form-label">Госномер *</label>
              <input type="text" class="ord-form-input" id="ordField-carPlate" placeholder="А123ВС 77" style="text-transform:uppercase;">
            </div>
            <div class="ord-form-group">
              <label class="ord-form-label">Дата заезда *</label>
              <input type="date" class="ord-form-input" id="ordField-dateIn">
            </div>
            <div class="ord-form-group">
              <label class="ord-form-label">Дата выезда *</label>
              <input type="date" class="ord-form-input" id="ordField-dateOut">
            </div>
            <div class="ord-form-group">
              <label class="ord-form-label">Цвет авто</label>
              <div class="ord-color-palette" id="ordColorPalette"></div>
            </div>
            <div class="ord-form-group">
              <label class="ord-form-label">Статус</label>
              <select class="ord-form-select" id="ordField-status">
                <option value="new">🟕 Новый</option>
                <option value="in_progress">🟡 В работе</option>
                <option value="done">🟢 Готово</option>
                <option value="issued">🔵 Выдано</option>
              </select>
            </div>
          </div>

          <!-- ТАБЛИЦА УСЛУГ С ГАЛОЧКОЙ РУЧНОГО ВВОДА -->
          <div class="ord-services-block">
            <div class="ord-services-block-head">
              <label class="ord-form-label">Услуги и цены</label>
            </div>
            <div class="ord-rows-table" id="ordRowsTable">
              <div class="ord-row ord-row-head" id="ordRowHead">
                <div style="width:24px"></div>
                <div>Категория</div>
                <div>Подкатегория</div>
                <div>Услуга</div>
                <div>Цена, ₽</div>
                <div style="width:32px"></div>
              </div>
              <div class="ord-row-body" id="ordRowsBody"></div>
              <div class="ord-row-foot">
                <button type="button" class="ord-btn-add-row" onclick="ordAddRow()">＋ Добавить строку</button>
                <div class="ord-row-total">ИТОГО: <span id="ordTotalPrice">0</span> ₽</div>
              </div>
            </div>
          </div>

          <div class="ord-form-group full" style="margin-top:14px;">
            <label class="ord-form-label">Комментарий</label>
            <textarea class="ord-form-textarea" id="ordField-note" placeholder="Доп. инфо..."></textarea>
          </div>

          <div class="ord-form-actions">
            <button class="ord-btn-delete" id="ordDeleteBtn" onclick="ordDelete()" style="display:none;">🗑 Удалить</button>
            <button class="ord-btn-cancel" onclick="ordCloseForm()">Отмена</button>
            <button class="ord-btn-save" onclick="ordSave()">💾 Сохранить</button>
          </div>
        </div>

        <!-- ПАНЕЛЬ ФИЛЬТРА ПО ДАТАМ -->
        <div class="ord-datebar">
          <div class="ord-date-presets">
            <button class="ord-date-btn active" data-preset="month" onclick="ordSetDatePreset('month')">Этот месяц</button>
            <button class="ord-date-btn" data-preset="today" onclick="ordSetDatePreset('today')">Сегодня</button>
            <button class="ord-date-btn" data-preset="week" onclick="ordSetDatePreset('week')">Эта неделя</button>

var ORD_EDITING_ID = null;
var ORD_SERVICES = [];
var ORD_ROWS = [];
var ORD_FILTER = 'all';
var ORD_CACHE = null;
var ORD_PRICE_CATS = null;
var ORD_PRICE_SUBCATS = null;
var ORD_PRICE_SERVICES = null;
var ORD_MANUAL_MODE = false;
var ORD_DATE_PRESET = 'month';
var ORD_DATE_FROM = '';
var ORD_DATE_TO = '';

var ORD_CAR_COLORS = [
  {hex:'#ef4444', name:'Красный'},   {hex:'#3b82f6', name:'Синий'},
  {hex:'#22c55e', name:'Зелёный'},   {hex:'#fbbf24', name:'Жёлтый'},
  {hex:'#f97316', name:'Оранжевый'}, {hex:'#a78bfa', name:'Фиолетовый'},

// Конвертация: строка БД → наш формат
function ordFromDb(row) {
  return {
    id: row.id,
    number: row.number || '',
    carBrand: row.car_brand || '',
    carPlate: row.car_plate || '',
    carColor: row.car_color || '#525252',
    dateIn: row.date_in || '',
    dateOut: row.date_out || '',
    status: row.status || 'new',
    post: String(row.post || '1'),
    note: row.note || '',
    price: Number(row.price) || 0,
    services: row.services || [],
    createdAt: row.created_at ? new Date(row.created_at).getTime() : 0
  };
}

// Загрузить все заказы с сервера (с кэшем)
function ordGetAll(callback) {
  if (ORD_CACHE) { if (callback) callback(ORD_CACHE); return; }
  fetch(ORD_SUPABASE_URL + '/rest/v1/orders?select=*&order=created_at.desc', {
    headers: {
      'apikey': ORD_SUPABASE_KEY,
      'Authorization': 'Bearer ' + ORD_SUPABASE_KEY
    }
  })
    .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(rows) {
      ORD_CACHE = rows.map(ordFromDb);
      if (callback) callback(ORD_CACHE);
    })
    .catch(function(e) {
      console.error('Ошибка загрузки заказов:', e);
      if (callback) callback([]);
    });
}

function ordInvalidateCache() { ORD_CACHE = null; }

// Поиск свободного поста
function ordFindFreePost(dateIn, dateOut, excludeId, orders) {
  if (!dateIn || !dateOut) return 1;
  for (var post = 1; post <= 4; post++) {
    var isFree = true;
    for (var i = 0; i < orders.length; i++) {
      var o = orders[i];
      if (excludeId && o.id === excludeId) continue;
      if (String(o.post) !== String(post)) continue;
      if (!o.dateIn || !o.dateOut) continue;
      if (dateIn <= o.dateOut && dateOut >= o.dateIn) { isFree = false; break; }
    }
    if (isFree) return post;
  }
  return 1;
}

function ordInitDateFilter() {
  ordSetDatePreset('month');
}

function ordSetDatePreset(preset) {
  ORD_DATE_PRESET = preset;
  var today = new Date();
  var from = '', to = '', info = '';

  if (preset === 'today') {
    var d = ordFmtDate(today);
    from = d; to = d;
    info = 'Записи за сегодня (' + d + ')';
  } else if (preset === 'week') {
    var day = today.getDay() || 7; // Вс=0 → 7
    var monday = new Date(today);
    monday.setDate(today.getDate() - day + 1);
    var sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);
    from = ordFmtDate(monday);
    to = ordFmtDate(sunday);
    info = 'Записи за эту неделю (' + from + ' — ' + to + ')';
  } else if (preset === 'month') {
    var first = new Date(today.getFullYear(), today.getMonth(), 1);
    var last = new Date(today.getFullYear(), today.getMonth() + 1, 0);
    from = ordFmtDate(first);
    to = ordFmtDate(last);
    info = 'Записи за ' + ordMonthName(today.getMonth()) + ' ' + today.getFullYear();
  } else if (preset === 'all') {
    from = ''; to = '';
    info = 'Показаны все записи';
  } else if (preset === 'custom') {
    // Оставляем текущие значения инпутов
    from = document.getElementById('ordDateFrom').value || '';
    to = document.getElementById('ordDateTo').value || '';
    info = from && to ? 'Период: ' + from + ' — ' + to : (from ? 'С ' + from : (to ? 'До ' + to : 'Выберите даты'));
  }

  ORD_DATE_FROM = from;
  ORD_DATE_TO = to;

  // Обновляем UI
  var btns = document.querySelectorAll('.ord-date-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.toggle('active', btns[i].dataset.preset === preset);
  }

  var range = document.getElementById('ordDateRange');
  if (range) range.style.display = (preset === 'custom') ? 'flex' : 'none';

  if (preset === 'custom') {
    var f = document.getElementById('ordDateFrom'); if (f && !f.value) f.value = from;
    var t = document.getElementById('ordDateTo'); if (t && !t.value) t.value = to;
  }

  var infoEl = document.getElementById('ordDateInfo');
  if (infoEl) infoEl.textContent = info;

  ordRender();
}

function ordOnDateRangeChange() {
  ORD_DATE_FROM = document.getElementById('ordDateFrom').value || '';
  ORD_DATE_TO = document.getElementById('ordDateTo').value || '';
  var infoEl = document.getElementById('ordDateInfo');
  if (infoEl) {
    if (ORD_DATE_FROM && ORD_DATE_TO) infoEl.textContent = 'Период: ' + ORD_DATE_FROM + ' — ' + ORD_DATE_TO;
    else if (ORD_DATE_FROM) infoEl.textContent = 'С ' + ORD_DATE_FROM;
    else if (ORD_DATE_TO) infoEl.textContent = 'До ' + ORD_DATE_TO;
    else infoEl.textContent = 'Выберите период';
  }
  ordRender();
}

function ordOnSingleDateChange() {
  var d = document.getElementById('ordDateSingle').value;
  if (d) {
    ORD_DATE_FROM = d;
    ORD_DATE_TO = d;
    var infoEl = document.getElementById('ordDateInfo');
    if (infoEl) infoEl.textContent = 'Дата: ' + d;
    ordRender();
  }
}

function ordFilterByDate(order) {
  if (!ORD_DATE_FROM && !ORD_DATE_TO) return true; // фильтр отключен
  var d = order.dateIn || '';
  if (!d) return false;
  if (ORD_DATE_FROM && d < ORD_DATE_FROM) return false;
  if (ORD_DATE_TO && d > ORD_DATE_TO) return false;
  return true;
}

function ordFmtDate(d) {
  var y = d.getFullYear();
  var m = String(d.getMonth() + 1).padStart(2, '0');
  var day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}

function ordMonthName(m) {
  var names = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  return names[m] || '';
}

function ordRender() {
  var listEl = document.getElementById('ordList');
  if (listEl) listEl.innerHTML = '<div class="ord-empty"><div class="ord-empty-icon">⏳</div><div class="ord-empty-text">Загрузка...</div></div>';
  ordGetAll(function(orders) { ordRenderList(orders); });
}

function ordRenderList(orders) {
  var search = (document.getElementById('ordSearch').value || '').toLowerCase().trim();

  var counts = { all: orders.length, new: 0, in_progress: 0, done: 0, issued: 0 };
  for (var i = 0; i < orders.length; i++) {
    counts[orders[i].status] = (counts[orders[i].status] || 0) + 1;
  }
  for (var k in counts) {
    var el = document.getElementById('cnt-' + k);
    if (el) el.textContent = counts[k];
  }
  document.getElementById('ordCount').textContent = orders.length;

  var filtered = [];
  for (var i = 0; i < orders.length; i++) {
    var o = orders[i];
    if (ORD_FILTER !== 'all' && o.status !== ORD_FILTER) continue;
    if (!ordFilterByDate(o)) continue;
    if (search) {
      var hay = (o.number + ' ' + o.carBrand + ' ' + (o.carPlate||'')).toLowerCase();
      if (hay.indexOf(search) === -1) continue;
    }
    filtered.push(o);
  }

  filtered.sort(function(a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });

  var listEl = document.getElementById('ordList');
  if (filtered.length === 0) {
    listEl.innerHTML = '<div class="ord-empty"><div class="ord-empty-icon">📋</div><div class="ord-empty-text">' + (orders.length === 0 ? 'Пока нет заказ-нарядов' : 'Ничего не найдено') + '</div>' + (orders.length === 0 ? '<button class="ord-btn-create" onclick="ordOpenForm()">➕ Создать первый</button>' : '') + '</div>';
    return;
  }

  var html = '';
  for (var i = 0; i < filtered.length; i++) {
    var o = filtered[i];
    var parts = [];
    parts.push('<span class="ord-card-num">#' + (o.number || o.id) + '</span>');
    parts.push('<span class="ord-card-sep">•</span>');
    parts.push('<span class="ord-card-car"><span class="ord-card-car-color" style="background:' + (o.carColor || '#525252') + '"></span>' + (o.carBrand || '—') + '</span>');
    if (o.carPlate) {
      parts.push('<span class="ord-card-sep">•</span>');
      parts.push('<span class="ord-card-plate">' + o.carPlate + '</span>');
    }
    parts.push('<span class="ord-card-sep">•</span>');
    parts.push('<span class="ord-card-meta">📍 <b>Пост ' + (o.post || '?') + '</b></span>');
    if (o.dateIn) {
      parts.push('<span class="ord-card-sep">•</span>');
      parts.push('<span class="ord-card-meta">📅 <b>' + ordFormatDate(o.dateIn) + (o.dateOut ? ' → ' + ordFormatDate(o.dateOut) : '') + '</b></span>');
    }
    if (o.price && o.price > 0) {
      parts.push('<span class="ord-card-sep">•</span>');
      parts.push('<span class="ord-card-price">💰 ' + ordFormatPrice(o.price) + ' ₽</span>');
    }
    parts.push('<span class="ord-card-status ' + o.status + '">' + ORD_STATUS_NAMES[o.status] + '</span>');
    html += '<div class="ord-card" data-oid="' + o.id + '" onclick="ordOpenForm(this.dataset.oid)">';
    html += '<div class="ord-card-status-bar ' + o.status + '"></div>';
    html += '<div class="ord-card-main">' + parts.join('') + '</div>';
    html += '<button type="button" class="ord-card-calc-btn" data-oid="' + o.id + '" onclick="event.stopPropagation();ordOpenCalc(this.dataset.oid)">🧮 Рассчитать</button>';
    html += '</div>';
  }
  listEl.innerHTML = html;
}

function ordFormatDate(d) {
  if (!d) return '';
  var parts = d.split('-');
  return parts[2] + '.' + parts[1] + '.' + parts[0];
}

function ordFormatPrice(p) {
  var n = Number(p) || 0;
  return n.toLocaleString('ru-RU');
}

// === МОДАЛКА ===
function ordNewOrder() {
  // Очищаем форму для нового заказа
  ORD_EDITING_ID = null;
  ordLoadPrices(function() {
    ordResetRows();
    ordFillForm(null);
    document.getElementById('ordFormTitle').textContent = 'Новый заказ-наряд';
    document.getElementById('ordDeleteBtn').style.display = 'none';
    document.getElementById('ordFormCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
}

function ordOpenForm(id) {
  // Открываем существующий заказ на редактирование
  ORD_EDITING_ID = id || null;
  ordLoadPrices(function() {
    if (!id) { ordNewOrder(); return; }
    ordGetAll(function(orders) {
      var o = orders.find(function(x){return x.id === id;});
      ordFillForm(o);
      document.getElementById('ordFormTitle').textContent = 'Заказ-наряд #' + (o ? o.number : id);
      document.getElementById('ordDeleteBtn').style.display = 'block';
      document.getElementById('ordFormCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
}

function ordCloseForm() {
  // Сбрасываем форму к пустому состоянию
  ordNewOrder();
}

function ordFillForm(o) {
  var id = ORD_EDITING_ID;
  document.getElementById('ordFormTitle').textContent = id ? 'Заказ-наряд #' + (o ? o.number : id) : 'Новый заказ-наряд';
  document.getElementById('ordDeleteBtn').style.display = id ? 'block' : 'none';
  document.getElementById('ordField-number').value = o ? (o.number || '') : '';
  document.getElementById('ordField-carBrand').value = o ? (o.carBrand || '') : '';
  document.getElementById('ordField-carPlate').value = o ? (o.carPlate || '') : '';
  document.getElementById('ordField-dateIn').value = o ? (o.dateIn || '') : '';
  document.getElementById('ordField-dateOut').value = o ? (o.dateOut || '') : '';
  document.getElementById('ordField-status').value = o ? (o.status || 'new') : 'new';
  document.getElementById('ordField-note').value = o ? (o.note || '') : '';
  document.getElementById('ordField-post').value = o ? (o.post || 'auto') : 'auto';
  // Загружаем услуги в строки таблицы
  if (o && o.services && o.services.length) {
    ordServicesToRows(o.services);
  } else {
    ordResetRows();
  }
  ordRenderRows();
  ordRecalcTotal();
  ordRenderColorPalette(o ? o.carColor : null);
}



function ordRenderColorPalette(activeColor) {
  var el = document.getElementById('ordColorPalette');
  var html = '';
  for (var i = 0; i < ORD_CAR_COLORS.length; i++) {
    var c = ORD_CAR_COLORS[i];
    var active = (activeColor === c.hex) ? 'active' : '';
    html += '<div class="ord-color-swatch ' + active + '" style="background:' + c.hex + '" title="' + c.name + '" onclick="ordSelectColor(\'' + c.hex + '\')"></div>';
  }
  el.innerHTML = html;
}

function ordSelectColor(hex) {
  var swatches = document.querySelectorAll('.ord-color-swatch');
  for (var i = 0; i < swatches.length; i++) swatches[i].classList.remove('active');
  event.target.classList.add('active');
}

function ordGetSelectedColor() {
  var active = document.querySelector('.ord-color-swatch.active');
  return active ? active.style.backgroundColor : '#525252';
}

function ordAddRow() {
  ORD_ROWS.push({ catId: '', subcatId: '', svcId: '', svcName: '', price: 0, manual: false });
  ordRenderRows();
}

function ordRemoveRow(idx) {
  ORD_ROWS.splice(idx, 1);
  ordRenderRows();
  ordRecalcTotal();
}


function ordOnRowManualToggle(idx, isManual) {
  var r = ORD_ROWS[idx];
  r.manual = isManual;
  if (isManual) {
    // Переходим в ручной режим — сохраняем svcName если было выбрано
    if (!r.svcName) r.svcName = '';
    r.catId = '';
    r.subcatId = '';
    r.svcId = '';
  } else {
    // Возвращаемся к прайсу — сбрасываем ручное название
    r.svcName = '';
  }
  ordRenderRows();
  ordRecalcTotal();
}

function ordRenderRows() {
  var el = document.getElementById('ordRowsBody');
  if (ORD_ROWS.length === 0) {
    el.innerHTML = '<div class="ord-empty-row">Нажмите «Добавить строку», чтобы выбрать услуги</div>';
    return;
  }
  var html = '';
  for (var i = 0; i < ORD_ROWS.length; i++) {
    var r = ORD_ROWS[i];
    html += '<div class="ord-row" data-idx="' + i + '">';
    // Чекбокс "Ручной ввод" — отдельный для каждой строки
    var checked = r.manual ? ' checked' : '';
    html += '<div class="ord-row-check"><input type="checkbox" id="ordRowManual' + i + '"' + checked + ' onchange="ordOnRowManualToggle(' + i + ', this.checked)" title="Ручной ввод"></div>';
    // Содержимое строки зависит от режима
    if (r.manual) {
      // Ручной режим: одно текстовое поле на 3 колонки
      html += '<input type="text" class="ord-manual-name" value="' + ordEscape(r.svcName) + '" placeholder="Название услуги..." oninput="ordOnRowManualName(' + i + ', this.value)" style="grid-column: span 3;">';
    } else {
      // Режим прайса: 3 селекта
      html += '<select onchange="ordOnRowCat(' + i + ', this.value)">' + ordCatOptions(r.catId) + '</select>';
      if (r.catId) {
        html += '<select onchange="ordOnRowSubcat(' + i + ', this.value)">' + ordSubcatOptions(r.catId, r.subcatId) + '</select>';
        html += '<select onchange="ordOnRowSvc(' + i + ', this.value, this.options[this.selectedIndex])">' + ordSvcOptions(r.catId, r.subcatId, r.svcId) + '</select>';
      } else {
        html += '<select disabled><option>—</option></select>';
        html += '<select disabled><option>—</option></select>';
      }
    }
    // Цена
    html += '<input type="number" class="ord-price" value="' + (r.price || 0) + '" placeholder="0" min="0" step="100" oninput="ordOnRowPrice(' + i + ', this.value)">';
    // Удаление
    html += '<button type="button" class="ord-row-del" onclick="ordRemoveRow(' + i + ')">✕</button>';
    html += '</div>';
  }
  el.innerHTML = html;
}

function ordEscape(s) {
  if (!s) return '';
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function ordCatOptions(selected) {
  var html = '<option value="">— Категория —</option>';
  for (var i = 0; i < ORD_PRICE_CATS.length; i++) {
    var c = ORD_PRICE_CATS[i];
    var sel = (String(c.id) === String(selected)) ? ' selected' : '';
    html += '<option value="' + c.id + '"' + sel + '>' + c.name + '</option>';
  }
  return html;
}

function ordOnRowManualName(idx, val) {
  ORD_ROWS[idx].svcName = val;
}

function ordSubcatOptions(catId, selected) {
  var subs = ORD_PRICE_SUBCATS.filter(function(s) { return String(s.category_id) === String(catId); });
  if (subs.length === 0) {
    return '<option value="">(любая)</option>';
  }
  var html = '<option value="">— Подкатегория —</option>';
  for (var i = 0; i < subs.length; i++) {
    var sel = (String(subs[i].id) === String(selected)) ? ' selected' : '';
    html += '<option value="' + subs[i].id + '"' + sel + '>' + subs[i].name + '</option>';
  }
  return html;
}

function ordSvcOptions(catId, subcatId, selected) {
  var svcs;
  if (subcatId) {
    svcs = ORD_PRICE_SERVICES.filter(function(s) { return String(s.subcategory_id) === String(subcatId); });
  } else {
    svcs = ORD_PRICE_SERVICES.filter(function(s) { return String(s.category_id) === String(catId); });
  }
  if (svcs.length === 0) return '<option value="">— Нет услуг —</option>';
  var html = '<option value="">— Услуга —</option>';
  for (var i = 0; i < svcs.length; i++) {
    var sel = (String(svcs[i].id) === String(selected)) ? ' selected' : '';
    html += '<option value="' + svcs[i].id + '" data-name="' + svcs[i].name + '"' + sel + '>' + svcs[i].name + '</option>';
  }
  return html;
}

function ordOnRowCat(idx, val) {
  var r = ORD_ROWS[idx];
  r.catId = val;
  r.subcatId = '';
  r.svcId = '';
  r.svcName = '';
  ordRenderRows();
}

function ordOnRowSubcat(idx, val) {
  var r = ORD_ROWS[idx];
  r.subcatId = val;
  r.svcId = '';
  r.svcName = '';
  ordRenderRows();
}

function ordOnRowSvc(idx, val, opt) {
  var r = ORD_ROWS[idx];
  r.svcId = val;
  r.svcName = opt ? (opt.dataset.name || opt.text) : '';
  ordRecalcTotal();
}

function ordOnRowPrice(idx, val) {
  var p = parseFloat(val) || 0;
  if (p < 0) p = 0;
  ORD_ROWS[idx].price = p;
  ordRecalcTotal();
}

function ordRecalcTotal() {
  var total = 0;
  for (var i = 0; i < ORD_ROWS.length; i++) {
    total += (ORD_ROWS[i].price || 0);
  }
  var el = document.getElementById('ordTotalPrice');
  if (el) el.textContent = total.toLocaleString('ru-RU');
}

// === ЗАГРУЗКА ПРАЙСА ===

function ordLoadPrices(callback) {
  if (ORD_PRICE_CATS !== null) { callback(); return; }
  Promise.all([
    fetch(ORD_SUPABASE_URL + '/rest/v1/service_categories?select=*&order=sort_order.asc,name.asc', { headers: { 'apikey': ORD_SUPABASE_KEY } }).then(function(r) { return r.json(); }),
    fetch(ORD_SUPABASE_URL + '/rest/v1/service_subcategories?select=*&order=sort_order.asc,name.asc', { headers: { 'apikey': ORD_SUPABASE_KEY } }).then(function(r) { return r.json(); }),
    fetch(ORD_SUPABASE_URL + '/rest/v1/services?select=*&order=name.asc', { headers: { 'apikey': ORD_SUPABASE_KEY } }).then(function(r) { return r.json(); })
  ]).then(function(results) {
    ORD_PRICE_CATS = results[0] || [];
    ORD_PRICE_SUBCATS = results[1] || [];
    ORD_PRICE_SERVICES = results[2] || [];
    callback();
  }).catch(function(e) {
    console.error('Ошибка загрузки прайса:', e);
    callback();
  });
}

function ordResetRows() {
  ORD_ROWS = [{ catId: '', subcatId: '', svcId: '', svcName: '', price: 0, manual: false }];
  ordRenderRows();
  ordRecalcTotal();
}

// Конвертация строк таблицы ORD_ROWS → массив услуг для сохранения
function ordRowsToServices() {
  var services = [];
  for (var i = 0; i < ORD_ROWS.length; i++) {
    var r = ORD_ROWS[i];
    if (!r.svcName) continue; // пустые строки пропускаем
    services.push({
      name: r.svcName,
      serviceId: r.manual ? null : (r.svcId ? parseInt(r.svcId) : null),
      manual: r.manual,
      price: Number(r.price) || 0
    });
  }
  return services;
}

// Загрузка сохранённых услуг → строки таблицы
function ordServicesToRows(services) {
  ORD_ROWS = [];
  if (!services || services.length === 0) {
    ORD_ROWS.push({ catId: '', subcatId: '', svcId: '', svcName: '', price: 0, manual: false });
    return;
  }
  for (var i = 0; i < services.length; i++) {
    var s = services[i];
    var name = (typeof s === 'string') ? s : (s.name || '');
    var price = (typeof s === 'object' && s.price) ? Number(s.price) : 0;
    var svcId = (typeof s === 'object' && s.serviceId) ? s.serviceId : '';
    // Попробуем найти категорию/подкатегорию по serviceId
    var catId = '', subcatId = '';
    if (svcId && ORD_PRICE_SERVICES) {
      for (var j = 0; j < ORD_PRICE_SERVICES.length; j++) {
        if (String(ORD_PRICE_SERVICES[j].id) === String(svcId)) {
          catId = ORD_PRICE_SERVICES[j].category_id;
          subcatId = ORD_PRICE_SERVICES[j].subcategory_id || '';
          break;
        }
      }
    }
    ORD_ROWS.push({ catId: catId, subcatId: subcatId, svcId: svcId, svcName: name, price: price });
  }
}

// === СОХРАНЕНИЕ ===
function ordSave() {
  var number = document.getElementById('ordField-number').value.trim();
  var carBrand = document.getElementById('ordField-carBrand').value.trim();
  var carPlate = document.getElementById('ordField-carPlate').value.trim().toUpperCase();
  var dateIn = document.getElementById('ordField-dateIn').value;
  var dateOut = document.getElementById('ordField-dateOut').value;
  var status = document.getElementById('ordField-status').value;
  var post = document.getElementById('ordField-post').value;
  var note = document.getElementById('ordField-note').value.trim();
  var carColor = ordGetSelectedColor();

  // Считаем итоговую цену и собираем услуги из строк таблицы
  var services = ordRowsToServices();
  var totalPrice = 0;
  for (var i = 0; i < services.length; i++) {
    totalPrice += (services[i].price || 0);
  }

  if (!number) { alert('Укажите номер заказ-наряда'); return; }
  if (!carBrand) { alert('Укажите марку/модель авто'); return; }
  if (!carPlate) { alert('⚠️ Без госномера сохранение невозможно.\n\nУкажите госномер авто.'); return; }
  if (!dateIn) { alert('Укажите дату заезда'); return; }
  if (!dateOut) { alert('Укажите дату выезда'); return; }

  if (post === 'auto') {
    ordGetAll(function(orders) {
      post = String(ordFindFreePost(dateIn, dateOut, ORD_EDITING_ID, orders));
      ordDoSave(number, carBrand, carPlate, carColor, dateIn, dateOut, status, post, note, totalPrice, services);
    });
  } else {
    ordDoSave(number, carBrand, carPlate, carColor, dateIn, dateOut, status, post, note, totalPrice, services);
  }
}

function ordDoSave(number, carBrand, carPlate, carColor, dateIn, dateOut, status, post, note, price, services) {
  var data = {
    number: number, car_brand: carBrand, car_plate: carPlate, car_color: carColor,
    date_in: dateIn, date_out: dateOut, status: status, post: post,
    note: note || '', price: Number(price) || 0, services: services
  };

  var saveBtn = document.querySelector('.ord-btn-save');
  if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = '⏳ Сохранение...'; }

  var url, method;
  if (ORD_EDITING_ID) {
    url = ORD_SUPABASE_URL + '/rest/v1/orders?id=eq.' + encodeURIComponent(ORD_EDITING_ID);
    method = 'PATCH';
  } else {
    url = ORD_SUPABASE_URL + '/rest/v1/orders';
    method = 'POST';
  }

  fetch(url, {
    method: method,
    headers: {
      'apikey': ORD_SUPABASE_KEY,
      'Authorization': 'Bearer ' + ORD_SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation'
    },
    body: JSON.stringify(data)
  })
    .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function() {
      ordInvalidateCache();
      ordCloseForm();
      ordRender();
    })
    .catch(function(e) {
      console.error('Ошибка сохранения:', e);
      alert('❌ Ошибка сохранения: ' + e.message);
      if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = '💾 Сохранить'; }
    });
}

function ordDelete() {
  if (!ORD_EDITING_ID) return;
  if (!confirm('Удалить заказ-наряд?')) return;
  fetch(ORD_SUPABASE_URL + '/rest/v1/orders?id=eq.' + encodeURIComponent(ORD_EDITING_ID), {
    method: 'DELETE',
    headers: {
      'apikey': ORD_SUPABASE_KEY,
      'Authorization': 'Bearer ' + ORD_SUPABASE_KEY
    }
  })
    .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); })
    .then(function() {
      ordInvalidateCache();
      ordCloseForm();
      ordRender();
    })
    .catch(function(e) {
      console.error('Ошибка удаления:', e);
      alert('❌ Ошибка удаления: ' + e.message);
    });
}

// === РАСЧЁТ СТОИМОСТИ ===

var ORD_CALC_ORDER = null;
var ORD_CALC_COMPONENTS = {};
var ORD_CALC_COSTS = {};
var ORD_CALC_SAVE_TIMER = null;

function ordOpenCalc(orderId) {
  ordGetAll(function(orders) {
    var o = orders.find(function(x) { return x.id === orderId; });
    if (!o) { alert('Заказ не найден'); return; }
    ORD_CALC_ORDER = o;
    document.getElementById('ordCalcTitle').textContent = '\u{1F9EE} Расчёт — #' + (o.number || o.id);
    document.getElementById('ordCalcModal').classList.add('show');
    document.getElementById('ordCalcBody').innerHTML = '<div class="ord-calc-loading">Загрузка...</div>';
    ordCalcRender();
  });
}

function ordCloseCalc() {
  document.getElementById('ordCalcModal').classList.remove('show');
  ORD_CALC_ORDER = null;
  ORD_CALC_COMPONENTS = {};
  ORD_CALC_COSTS = {};
}

function ordCalcRender() {
  var o = ORD_CALC_ORDER;
  if (!o) return;
  var services = o.services || [];
  if (services.length === 0) {
    document.getElementById('ordCalcBody').innerHTML = '<div class="ord-calc-nosvc">В этом заказ-наряде нет услуг</div>';
    return;
  }
  var svcIds = [];
  for (var i = 0; i < services.length; i++) {
    var sid = services[i].serviceId;
    if (sid && svcIds.indexOf(sid) === -1) svcIds.push(sid);
  }
  if (svcIds.length === 0) {
    var html = '';
    for (var i = 0; i < services.length; i++) {
      html += ordCalcAccHTML(services[i], i, true);
    }
    document.getElementById('ordCalcBody').innerHTML = html;
    return;
  }
  var compUrl = ORD_SUPABASE_URL + '/rest/v1/service_components?select=*&service_id=in.(' + svcIds.join(',') + ')&order=service_id.asc,sort_order.asc,name.asc';
  var costUrl = ORD_SUPABASE_URL + '/rest/v1/order_component_costs?select=*&order_id=eq.' + encodeURIComponent(o.id);
  Promise.all([
    fetch(compUrl, { headers: { 'apikey': ORD_SUPABASE_KEY, 'Authorization': 'Bearer ' + ORD_SUPABASE_KEY } }).then(function(r) { return r.json(); }),
    fetch(costUrl, { headers: { 'apikey': ORD_SUPABASE_KEY, 'Authorization': 'Bearer ' + ORD_SUPABASE_KEY } }).then(function(r) { return r.json(); })
  ]).then(function(results) {
    var comps = results[0] || [];
    var costs = results[1] || [];
    ORD_CALC_COMPONENTS = {};
    for (var i = 0; i < comps.length; i++) {
      var sid = comps[i].service_id;
      if (!ORD_CALC_COMPONENTS[sid]) ORD_CALC_COMPONENTS[sid] = [];
      ORD_CALC_COMPONENTS[sid].push(comps[i]);
    }
    ORD_CALC_COSTS = {};
    for (var j = 0; j < costs.length; j++) {
      ORD_CALC_COSTS[costs[j].component_id] = Number(costs[j].price) || 0;
    }
    var html = '';
    for (var i = 0; i < services.length; i++) {
      html += ordCalcAccHTML(services[i], i, false);
    }
    document.getElementById('ordCalcBody').innerHTML = html;
  }).catch(function(e) {
    console.error('Ошибка загрузки:', e);
    document.getElementById('ordCalcBody').innerHTML = '<div class="ord-calc-nosvc">Ошибка загрузки данных</div>';
  });
}

function ordCalcAccHTML(svc, idx, isManual) {
  var name = svc.name || '—';
  var price = Number(svc.price) || 0;
  var sid = svc.serviceId;
  var components = (sid && ORD_CALC_COMPONENTS[sid]) || [];
  var accId = 'ordCalcAcc' + idx;
  var html = '<div class="ord-calc-accordion' + (idx === 0 ? ' open' : '') + '" id="' + accId + '">';
  html += '<div class="ord-calc-acc-head" onclick="ordCalcToggle(\'' + accId + '\')">';
  html += '<span class="ord-calc-acc-arrow">▶</span>';
  html += '<span class="ord-calc-acc-name">' + ordEscape(name) + '</span>';
  if (price > 0) {
    html += '<span class="ord-calc-acc-price">' + ordFormatPrice(price) + ' ₽</span>';
  } else {
    html += '<span class="ord-calc-acc-price zero">—</span>';
  }
  html += '</div>';
  html += '<div class="ord-calc-acc-body">';
  if (isManual) {
    html += '<div class="ord-calc-comp-empty">Ручная услуга — состав не задан</div>';
  } else if (components.length === 0) {
    html += '<div class="ord-calc-comp-empty">Состав не задан. Добавьте в разделе «Расчёт стоимости»</div>';
  } else {
    for (var i = 0; i < components.length; i++) {
      var comp = components[i];
      var cost = ORD_CALC_COSTS[comp.id] || '';
      html += '<div class="ord-calc-comp">';
      html += '<span class="ord-calc-comp-num">' + (i + 1) + '.</span>';
      html += '<span class="ord-calc-comp-name">' + ordEscape(comp.name) + '</span>';
      html += '<input type="number" class="ord-calc-comp-input" inputmode="decimal" min="0" step="any" placeholder="0" value="' + cost + '" data-comp="' + comp.id + '" data-acc="' + accId + '" oninput="ordCalcOnPriceInput(this)">';
      html += '<span class="ord-calc-comp-cur">₽</span>';
      html += '</div>';
    }
    html += '<div class="ord-calc-summary" id="' + accId + '_summary">';
    html += '<div class="ord-calc-sum-row"><span>Сумма расходов:</span><span class="ord-calc-sum-spent" id="' + accId + '_spent">0 ₽</span></div>';
    html += '<div class="ord-calc-sum-row total"><span>Остаток:</span><span class="ord-calc-sum-rest pos" id="' + accId + '_rest">' + ordFormatPrice(price) + ' ₽</span></div>';
    html += '</div>';
  }
  html += '</div>';
  html += '</div>';
  return html;
}

function ordCalcOnPriceInput(input) {
  var compId = input.dataset.comp;
  var accId = input.dataset.acc;
  var val = parseFloat(input.value) || 0;
  ORD_CALC_COSTS[compId] = val;
  ordCalcRecalcAccordion(accId);
  ordCalcScheduleSave(compId, val);
}

function ordCalcRecalcAccordion(accId) {
  var acc = document.getElementById(accId);
  if (!acc) return;
  var inputs = acc.querySelectorAll('.ord-calc-comp-input');
  var spent = 0;
  for (var i = 0; i < inputs.length; i++) {
    spent += (parseFloat(inputs[i].value) || 0);
  }
  var svc = ordCalcFindSvcByAccId(accId);
  var price = svc ? (Number(svc.price) || 0) : 0;
  var rest = price - spent;
  var spentEl = document.getElementById(accId + '_spent');
  var restEl = document.getElementById(accId + '_rest');
  if (spentEl) spentEl.textContent = ordFormatPrice(spent) + ' ₽';
  if (restEl) {
    restEl.textContent = (rest < 0 ? '−' + ordFormatPrice(Math.abs(rest)) : ordFormatPrice(rest)) + ' ₽';
    restEl.className = 'ord-calc-sum-rest ' + (rest < 0 ? 'neg' : (rest === 0 ? 'zero' : 'pos'));
  }
}

function ordCalcFindSvcByAccId(accId) {
  var idx = parseInt(accId.replace('ordCalcAcc', ''), 10);
  var services = (ORD_CALC_ORDER && ORD_CALC_ORDER.services) || [];
  return services[idx] || null;
}

function ordCalcScheduleSave(compId, price) {
  if (ORD_CALC_SAVE_TIMER) clearTimeout(ORD_CALC_SAVE_TIMER);
  ORD_CALC_SAVE_TIMER = setTimeout(function() {
    ordCalcSavePrice(compId, price);
  }, 800);
}

function ordCalcSavePrice(compId, price) {
  if (!ORD_CALC_ORDER) return;
  var url = ORD_SUPABASE_URL + '/rest/v1/order_component_costs?order_id=eq.' + encodeURIComponent(ORD_CALC_ORDER.id) + '&component_id=eq.' + encodeURIComponent(compId);
  fetch(url, {
    method: 'POST',
    headers: {
      'apikey': ORD_SUPABASE_KEY,
      'Authorization': 'Bearer ' + ORD_SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'resolution=merge-duplicates'
    },
    body: JSON.stringify({
      order_id: ORD_CALC_ORDER.id,
      component_id: compId,
      price: Number(price) || 0,
      updated_at: new Date().toISOString()
    })
  }).catch(function(e) {
    console.error('Ошибка сохранения цены:', e);
  });
}

function ordCalcToggle(accId) {
  var el = document.getElementById(accId);
  if (el) el.classList.toggle('open');
}

// === ФИЛЬТРЫ ===// === ФИЛЬТРЫ ===
function ordInitFilters() {
  var btns = document.querySelectorAll('.ord-filter-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].addEventListener('click', function() {
      for (var j = 0; j < btns.length; j++) btns[j].classList.remove('active');
      this.classList.add('active');
      ORD_FILTER = this.getAttribute('data-filter');
      ordRender();
    });
  }
}

// === АВТОРИЗАЦИЯ + ИНИЦИАЛИЗАЦИЯ ===
function divoCheckAuthAndInit() {
  var user = divoGetUser();
  if (!user) {
    var mainLayout = document.getElementById('divoMainLayout');
    if (mainLayout) mainLayout.style.display = 'none';
    fetch('/components/auth-form.html?v=114')
      .then(function(r) { return r.text(); })
      .then(function(html) {
        var c = document.getElementById('divoAuthContainer');
        if (c) {
          c.innerHTML = html;
          var btn = document.getElementById('divoAuthBtn');
          if (btn) btn.addEventListener('click', divoDoLogin);
          var pass = document.getElementById('divoAuthPassword');
          if (pass) pass.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') divoDoLogin();
          });
        }
      });
    return;
  }

  if (typeof divoLoadAccessConfig === 'function') {
    divoLoadAccessConfig(function() {
      if (!divoHasAccessToSection('orders')) {
        location.href = 'index.html';
        return;
      }
      ordStartPage();
    });
  } else {
    ordStartPage();
  }
}

function ordStartPage() {
  var mainLayout = document.getElementById('divoMainLayout');
  if (mainLayout) mainLayout.style.display = 'flex';
  var authContainer = document.getElementById('divoAuthContainer');
  if (authContainer) authContainer.innerHTML = '';
  divoInit();
  ordInitFilters();
  ordInitDateFilter();
  ordRender();

}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', divoCheckAuthAndInit);
} else {
  divoCheckAuthAndInit();
}
