<!-- Раздел: Услуги партнёров (для нас) -->
<!-- Уровень: 4 (админ+) -->

<div class="ps-page">
  <div class="ps-header">
    <div>
      <h1 class="ps-title">🔧 Услуги партнёров</h1>
      <div class="ps-subtitle">Прайсы на услуги, которые партнёры оказывают для нас</div>
    </div>
    <div class="ps-stats">
      <div class="ps-stat">
        <div class="ps-stat-label">Партнёров</div>
        <div class="ps-stat-value blue" id="psPartnerCount">—</div>
      </div>
      <div class="ps-stat">
        <div class="ps-stat-label">Услуг</div>
        <div class="ps-stat-value green" id="psSvcCount">—</div>
      </div>
    </div>
  </div>

  <!-- Форма добавления -->
  <div class="ps-add-form">
    <div class="ps-form-title">➕ Добавить услугу партнёра</div>

    <!-- Партнёр -->
    <div class="ps-form-section">
      <div class="ps-form-section-title">👤 Партнёр</div>
      <div class="ps-form-row ps-form-row-2">
        <div class="ps-field">
          <label>Категория</label>
          <select id="psPartnerCat"><option value="">-- Категория --</option></select>
        </div>
        <div class="ps-field">
          <label>Имя</label>
          <select id="psPartnerName" disabled><option value="">-- Имя --</option></select>
        </div>
      </div>
    </div>

    <!-- Услуга -->
    <div class="ps-form-section">
      <div class="ps-form-section-title">📋 Услуга</div>
      <div class="ps-form-row ps-form-row-2">
        <div class="ps-field">
          <label>Категория услуги</label>
          <div class="ps-cat-input-row">
            <select id="psSvcCat"><option value="">-- Выбрать --</option></select>
            <button type="button" class="ps-cat-add-btn" id="psCatAddBtn" title="Добавить категорию">+</button>
          </div>
        </div>
        <div class="ps-field">
          <label>Название услуги</label>
          <input type="text" id="psSvcName" placeholder="Например: Полировка кузова" autocomplete="off">
        </div>
      </div>
      <!-- Инлайн-форма добавления категории -->
      <div class="ps-cat-add-form" id="psCatAddForm" style="display:none;">
        <input type="text" id="psCatAddInput" placeholder="Название новой категории..." autocomplete="off">
        <button type="button" class="ps-cat-add-save" id="psCatAddSave">✓</button>
        <button type="button" class="ps-cat-add-cancel" id="psCatAddCancel">✕</button>
      </div>
    </div>

    <!-- Цены -->
    <div class="ps-form-section">
      <div class="ps-form-section-title">💰 Цены</div>
      <div class="ps-class-selector">
        <label>Количество классов:</label>
        <div class="ps-class-btns" id="psClassBtns">
          <button type="button" class="ps-class-btn" data-count="0">0</button>
          <button type="button" class="ps-class-btn active" data-count="4">4</button>
          <button type="button" class="ps-class-btn" data-count="1">1</button>
          <button type="button" class="ps-class-btn" data-count="2">2</button>
          <button type="button" class="ps-class-btn" data-count="3">3</button>
        </div>
      </div>
      <div class="ps-price-inputs" id="psPriceInputs"></div>
    </div>

    <button class="ps-add-btn" id="psAddBtn" disabled>+ Добавить услугу</button>
  </div>

  <div class="ps-status" id="psStatus"></div>

  <!-- Поиск -->
  <div class="ps-search-wrap">
    <span class="ps-search-icon">🔍</span>
    <input type="text" id="psSearch" class="ps-search-input" placeholder="Поиск по партнёру или услуге...">
  </div>

  <!-- Модалка редактирования -->
  <div class="ps-modal-overlay" id="psEditModal" style="display:none;">
    <div class="ps-modal-box">
      <div class="ps-modal-title" id="psEditTitle">✏️ Редактировать</div>
      <div class="ps-modal-partner" id="psEditPartner"></div>
      <div class="ps-modal-service-row">
        <label>Название услуги</label>
        <input type="text" id="psEditName" class="ps-modal-input">
      </div>
      <div class="ps-modal-service-row">
        <label>Категория</label>
        <div class="ps-cat-input-row">
          <select id="psEditCat"><option value="">-- Выбрать --</option></select>
          <button type="button" class="ps-cat-add-btn" id="psEditCatAddBtn" title="Добавить категорию">+</button>
        </div>
      </div>
      <div class="ps-modal-class-hint" id="psEditClassHint"></div>
      <div class="ps-modal-prices" id="psEditInputs"></div>
      <div class="ps-modal-buttons">
        <button class="ps-modal-btn cancel" id="psEditCancel">Отмена</button>
        <button class="ps-modal-btn save" id="psEditSave">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Список -->
  <div class="ps-list" id="psList">
    <div class="ps-loading">Загрузка...</div>
  </div>
</div>

<script>
(function() {
  var partners = [];
  var svcCategories = [];
  var partnerServices = [];
  var filtered = [];
  var selectedClassCount = 4;

  function $(id) { return document.getElementById(id); }
  function showStatus(msg, type) { var s = $('psStatus'); s.textContent = msg; s.className = 'ps-status show ' + type; }
  function hideStatus() { $('psStatus').className = 'ps-status'; }
  function escapeHtml(t) { var d = document.createElement('div'); d.textContent = t == null ? '' : String(t); return d.innerHTML; }
  function fmtPrice(p) { var n = Number(p || 0); if (n === 0) return '—'; if (n % 1 === 0) return String(n) + ' ₽'; return n.toFixed(2).replace(/\.?0+$/, '') + ' ₽'; }
  function getHeaders(extra) { var h = { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }; for (var k in extra) h[k] = extra[k]; return h; }

  function loadAll() {
    showStatus('Загрузка...', 'loading');
    Promise.all([
      fetch(SUPABASE_URL + '/rest/v1/contractors?select=*&order=category.asc,name.asc', { headers: getHeaders() }).then(function(r) { return r.json(); }),
      fetch(SUPABASE_URL + '/rest/v1/partner_service_categories?select=*&order=name.asc', { headers: getHeaders() }).then(function(r) { return r.json(); }),
      fetch(SUPABASE_URL + '/rest/v1/partner_service_prices?select=*&order=partner_id.asc,service_category.asc,service_name.asc', { headers: getHeaders() }).then(function(r) { return r.json(); })
    ])
      .then(function(results) {
        partners = results[0] || [];
        svcCategories = results[1] || [];
        partnerServices = results[2] || [];
        filtered = partnerServices.slice();
        hideStatus();
        renderPartnerCatSelect();
        renderSvcCatSelect();
        updateStats();
        renderPriceInputs(selectedClassCount, 'psPriceInputs');
        renderList();
      })
      .catch(function(e) { showStatus('Ошибка: ' + e.message, 'error'); });
  }

  // === ПАРТНЁРЫ ===
  function renderPartnerCatSelect() {
    var cats = []; var seen = {};
    for (var i = 0; i < partners.length; i++) {
      var cat = partners[i].category || 'Без категории';
      if (!seen[cat]) { seen[cat] = true; cats.push(cat); }
    }
    cats.sort();
    var html = '<option value="">-- Категория --</option>';
    for (var c = 0; c < cats.length; c++) html += '<option value="' + escapeHtml(cats[c]) + '">' + escapeHtml(cats[c]) + '</option>';
    $('psPartnerCat').innerHTML = html;
  }

  function renderPartnerNameSelect() {
    var cat = $('psPartnerCat').value;
    var sel = $('psPartnerName');
    if (!cat) { sel.innerHTML = '<option value="">-- Имя --</option>'; sel.disabled = true; return; }
    sel.disabled = false;
    var html = '<option value="">-- Имя --</option>';
    for (var i = 0; i < partners.length; i++) {
      if ((partners[i].category || 'Без категории') === cat) {
        html += '<option value="' + partners[i].id + '">' + escapeHtml(partners[i].name) + '</option>';
      }
    }
    sel.innerHTML = html;
  }

  // === КАТЕГОРИИ УСЛУГ ===
  function renderSvcCatSelect() {
    var html = '<option value="">-- Выбрать --</option>';
    for (var i = 0; i < svcCategories.length; i++) {
      html += '<option value="' + escapeHtml(svcCategories[i].name) + '">' + escapeHtml(svcCategories[i].name) + '</option>';
    }
    $('psSvcCat').innerHTML = html;
    // Обновить селект в модалке
    var editSel = $('psEditCat');
    if (editSel) {
      var eh = '<option value="">-- Выбрать --</option>';
      for (var i2 = 0; i2 < svcCategories.length; i2++) {
        eh += '<option value="' + escapeHtml(svcCategories[i2].name) + '">' + escapeHtml(svcCategories[i2].name) + '</option>';
      }
      editSel.innerHTML = eh;
    }
  }

  function showCatAddForm() {
    $('psCatAddForm').style.display = 'flex';
    $('psCatAddInput').focus();
  }
  function hideCatAddForm() {
    $('psCatAddForm').style.display = 'none';
    $('psCatAddInput').value = '';
  }
  function saveNewCat() {
    var name = $('psCatAddInput').value.trim();
    if (!name) { alert('Введите название категории!'); return; }
    showStatus('Добавляем категорию...', 'loading');
    fetch(SUPABASE_URL + '/rest/v1/partner_service_categories', {
      method: 'POST',
      headers: getHeaders({'Content-Type':'application/json','Prefer':'return=minimal'}),
      body: JSON.stringify({ name: name })
    })
      .then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return loadCats().then(function() {
          hideCatAddForm();
          showStatus('✅ Категория добавлена', 'success');
          setTimeout(hideStatus, 2000);
        });
      })
      .catch(function(e) { showStatus('Ошибка: ' + e.message, 'error'); });
  }
  function loadCats() {
    return fetch(SUPABASE_URL + '/rest/v1/partner_service_categories?select=*&order=name.asc', { headers: getHeaders() })
      .then(function(r) { return r.json(); })
      .then(function(data) { svcCategories = data || []; renderSvcCatSelect(); });
  }

  // === КЛАССЫ И ЦЕНЫ ===
  function updateClassBtns(count) {
    selectedClassCount = count;
    var btns = document.querySelectorAll('#psClassBtns .ps-class-btn');
    for (var i = 0; i < btns.length; i++) {
      var bc = parseInt(btns[i].getAttribute('data-count'), 10);
      btns[i].classList.toggle('active', bc === count);
    }
    renderPriceInputs(count, 'psPriceInputs');
    checkAddBtn();
  }

  function renderPriceInputs(count, containerId) {
    var html = '';
    if (count === 0) {
      html += '<div class="ps-price-group no-class">';
      html += '<div class="ps-price-group-title">Цена</div>';
      html += '<label>Цена</label>';
      html += '<input type="number" id="' + containerId + '_0" step="0.01" placeholder="0">';
      html += '</div>';
    } else {
      for (var c = 1; c <= count; c++) {
        html += '<div class="ps-price-group">';
        html += '<div class="ps-price-group-title">Класс ' + c + '</div>';
        html += '<label>Цена</label>';
        html += '<input type="number" id="' + containerId + '_' + c + '" step="0.01" placeholder="0">';
        html += '</div>';
      }
    }
    var cont = $(containerId);
    if (cont) cont.innerHTML = html;
  }

  function checkAddBtn() {
    var partnerId = parseInt($('psPartnerName').value, 10);
    var svcName = $('psSvcName').value.trim();
    $('psAddBtn').disabled = !(partnerId && svcName);
  }

  // === ДОБАВЛЕНИЕ ===
  function addService() {
    var partnerId = parseInt($('psPartnerName').value, 10);
    if (!partnerId) { alert('Выберите партнёра!'); return; }
    var svcName = $('psSvcName').value.trim();
    if (!svcName) { alert('Введите название услуги!'); return; }
    var svcCat = $('psSvcCat').value || 'Без категории';
    var cc = selectedClassCount;

    var payload = {
      partner_id: partnerId,
      service_category: svcCat,
      service_name: svcName,
      class_count: cc,
      price_c1: 0, price_c2: 0, price_c3: 0, price_c4: 0
    };
    if (cc === 0) {
      payload.price_c1 = parseFloat($('psPriceInputs_0').value) || 0;
    } else {
      for (var c = 1; c <= cc; c++) {
        payload['price_c' + c] = parseFloat($('psPriceInputs_' + c).value) || 0;
      }
    }

    showStatus('Добавляем услугу...', 'loading');
    fetch(SUPABASE_URL + '/rest/v1/partner_service_prices', {
      method: 'POST',
      headers: getHeaders({'Content-Type':'application/json','Prefer':'return=minimal'}),
      body: JSON.stringify(payload)
    })
      .then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        $('psSvcName').value = '';
        $('psSvcCat').value = '';
        updateClassBtns(4);
        loadAll();
        showStatus('✅ Услуга добавлена', 'success');
        setTimeout(hideStatus, 2000);
      })
      .catch(function(e) { showStatus('Ошибка: ' + e.message, 'error'); });
  }

  function deleteService(id) {
    if (!confirm('Удалить услугу?')) return;
    showStatus('Удаляем...', 'loading');
    fetch(SUPABASE_URL + '/rest/v1/partner_service_prices?id=eq.' + id, { method: 'DELETE', headers: getHeaders() })
      .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); loadAll(); showStatus('✅ Удалено', 'success'); setTimeout(hideStatus,2000); })
      .catch(function(e) { showStatus('Ошибка: ' + e.message, 'error'); loadAll(); });
  }

  // === РЕДАКТИРОВАНИЕ ===
  var pendingEditId = null;
  var pendingEditCC = 4;

  function openEditModal(id) {
    var svc = null;
    for (var i = 0; i < partnerServices.length; i++) { if (partnerServices[i].id === id) { svc = partnerServices[i]; break; } }
    if (!svc) return;
    pendingEditId = id;
    pendingEditCC = svc.class_count != null ? Number(svc.class_count) : 4;
    if (isNaN(pendingEditCC)) pendingEditCC = 4;
    var pName = getPartnerName(svc.partner_id);
    $('psEditTitle').textContent = '✏️ Редактировать услугу';
    $('psEditPartner').textContent = '🔧 ' + pName;
    $('psEditName').value = svc.service_name || '';
    $('psEditCat').value = svc.service_category || '';
    $('psEditClassHint').textContent = pendingEditCC === 0 ? 'Без классов — одна цена' : (pendingEditCC + ' ' + (pendingEditCC === 1 ? 'класс' : (pendingEditCC < 5 ? 'класса' : 'классов')));
    renderEditPriceInputs();
    $('psEditModal').style.display = 'flex';
  }

  function renderEditPriceInputs() {
    var html = '';
    if (pendingEditCC === 0) {
      var svc = getEditSvc();
      var v0 = svc ? Number(svc.price_c1 || 0) : 0;
      html += '<div class="ps-price-group no-class">';
      html += '<div class="ps-price-group-title">Цена</div>';
      html += '<label>Цена</label>';
      html += '<input type="number" id="psEditPrice_0" step="0.01" placeholder="0" value="' + (v0 || '') + '">';
      html += '</div>';
    } else {
      var svc2 = getEditSvc();
      for (var c = 1; c <= pendingEditCC; c++) {
        var v = svc2 ? Number(svc2['price_c' + c] || 0) : 0;
        html += '<div class="ps-price-group">';
        html += '<div class="ps-price-group-title">Класс ' + c + '</div>';
        html += '<label>Цена</label>';
        html += '<input type="number" id="psEditPrice_' + c + '" step="0.01" placeholder="0" value="' + (v || '') + '">';
        html += '</div>';
      }
    }
    $('psEditInputs').innerHTML = html;
  }

  function getEditSvc() {
    for (var i = 0; i < partnerServices.length; i++) { if (partnerServices[i].id === pendingEditId) return partnerServices[i]; }
    return null;
  }

  function closeEditModal() { $('psEditModal').style.display = 'none'; pendingEditId = null; }

  function saveEditModal() {
    if (!pendingEditId) return;
    var payload = {
      service_name: $('psEditName').value.trim(),
      service_category: $('psEditCat').value || 'Без категории'
    };
    if (pendingEditCC === 0) {
      payload.price_c1 = parseFloat($('psEditPrice_0').value) || 0;
    } else {
      for (var c = 1; c <= pendingEditCC; c++) {
        payload['price_c' + c] = parseFloat($('psEditPrice_' + c).value) || 0;
      }
    }
    showStatus('Сохраняем...', 'loading');
    closeEditModal();
    fetch(SUPABASE_URL + '/rest/v1/partner_service_prices?id=eq.' + pendingEditId, {
      method: 'PATCH',
      headers: getHeaders({'Content-Type':'application/json','Prefer':'return=minimal'}),
      body: JSON.stringify(payload)
    })
      .then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        loadAll();
        showStatus('✅ Сохранено', 'success');
        setTimeout(hideStatus, 2000);
      })
      .catch(function(e) { showStatus('Ошибка: ' + e.message, 'error'); loadAll(); });
  }

  // === СПИСОК ===
  function getPartnerName(id) {
    for (var i = 0; i < partners.length; i++) { if (partners[i].id === id) return partners[i].name; }
    return 'Неизвестно';
  }
  function getPartnerCat(id) {
    for (var i = 0; i < partners.length; i++) { if (partners[i].id === id) return partners[i].category || 'Без категории'; }
    return '';
  }

  function updateStats() {
    var pSet = {};
    for (var i = 0; i < partnerServices.length; i++) pSet[partnerServices[i].partner_id] = true;
    $('psPartnerCount').textContent = Object.keys(pSet).length;
    $('psSvcCount').textContent = filtered.length;
  }

  function filterData(query) {
    query = (query || '').toLowerCase().trim();
    if (!query) { filtered = partnerServices.slice(); }
    else {
      filtered = partnerServices.filter(function(p) {
        var pn = getPartnerName(p.partner_id).toLowerCase();
        var sn = (p.service_name || '').toLowerCase();
        var sc = (p.service_category || '').toLowerCase();
        return pn.indexOf(query) !== -1 || sn.indexOf(query) !== -1 || sc.indexOf(query) !== -1;
      });
    }
    updateStats();
    renderList();
  }

  function renderList() {
    var list = $('psList');
    if (!filtered.length) {
      list.innerHTML = '<div class="ps-empty">' + (partnerServices.length ? '🔍 Ничего не найдено' : 'Услуг пока нет. Добавьте первую!') + '</div>';
      return;
    }
    var groups = {}; var order = [];
    for (var i = 0; i < filtered.length; i++) {
      var pid = filtered[i].partner_id;
      if (!groups[pid]) { groups[pid] = []; order.push(pid); }
      groups[pid].push(filtered[i]);
    }

    var html = '';
    for (var g = 0; g < order.length; g++) {
      var pid = order[g];
      var items = groups[pid];
      var pName = getPartnerName(pid);
      var pCat = getPartnerCat(pid);
      html += '<div class="ps-partner-block" data-pid="' + pid + '">';
      html += '<div class="ps-partner-header" onclick="window.psTogglePartner(' + pid + ')">';
      html += '<span class="ps-partner-chevron">▼</span>';
      html += '<span class="ps-partner-name">🔧 ' + escapeHtml(pName) + '</span>';
      html += '<span class="ps-partner-cat">' + escapeHtml(pCat) + '</span>';
      html += '<span class="ps-partner-count">' + items.length + ' услуг</span>';
      html += '</div>';
      html += '<div class="ps-partner-body">';
      for (var k = 0; k < items.length; k++) {
        var item = items[k];
        var cc = item.class_count != null ? Number(item.class_count) : 4;
        if (isNaN(cc)) cc = 4;
        html += '<div class="ps-item">';
        html += '<div class="ps-item-service">' + escapeHtml(item.service_name) + '</div>';
        if (item.service_category) {
          html += '<span class="ps-item-cat">' + escapeHtml(item.service_category) + '</span>';
        }
        html += '<div class="ps-item-prices">';
        if (cc === 0) {
          var p0 = Number(item.price_c1 || 0);
          html += '<div class="ps-item-price' + (p0 ? '' : ' empty') + '"><div class="ps-item-price-label">Цена</div><div class="ps-item-price-value">' + escapeHtml(fmtPrice(p0)) + '</div></div>';
        } else {
          for (var c = 1; c <= cc; c++) {
            var pv = Number(item['price_c' + c] || 0);
            html += '<div class="ps-item-price' + (pv ? '' : ' empty') + '"><div class="ps-item-price-label">Кл.' + c + '</div><div class="ps-item-price-value">' + escapeHtml(fmtPrice(pv)) + '</div></div>';
          }
        }
        html += '</div>';
        html += '<button class="ps-item-edit" onclick="window.psEdit(' + item.id + ')" title="Редактировать">✏️</button>';
        html += '<button class="ps-item-delete" onclick="window.psDelete(' + item.id + ')" title="Удалить">🗑️</button>';
        html += '</div>';
      }
      html += '</div></div>';
    }
    list.innerHTML = html;
  }

  function togglePartner(pid) {
    var block = document.querySelector('.ps-partner-block[data-pid="' + pid + '"]');
    if (block) block.classList.toggle('collapsed');
  }

  // Модалка: добавление категории
  var psEditCatAddMode = false;
  function showEditCatAddForm() {
    psEditCatAddMode = true;
    var sel = $('psEditCat');
    var input = document.createElement('input');
    input.type = 'text';
    input.id = 'psEditCatInput';
    input.placeholder = 'Название новой категории...';
    input.className = 'ps-modal-input';
    input.style.flex = '1';
    sel.replaceWith(input);
    input.focus();
    $('psEditCatAddBtn').textContent = '✓';
  }
  function handleEditCatAdd() {
    if (psEditCatAddMode) {
      var name = $('psEditCatInput').value.trim();
      if (!name) { alert('Введите название!'); return; }
      // Добавить категорию в БД
      showStatus('Добавляем категорию...', 'loading');
      fetch(SUPABASE_URL + '/rest/v1/partner_service_categories', {
        method: 'POST',
        headers: getHeaders({'Content-Type':'application/json','Prefer':'return=minimal'}),
        body: JSON.stringify({ name: name })
      })
        .then(function(r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return loadCats().then(function() {
            // Восстановить селект и выбрать новую категорию
            var input = $('psEditCatInput');
            var newSel = document.createElement('select');
            newSel.id = 'psEditCat';
            var html = '<option value="">-- Выбрать --</option>';
            for (var i = 0; i < svcCategories.length; i++) {
              html += '<option value="' + escapeHtml(svcCategories[i].name) + '"' + (svcCategories[i].name === name ? ' selected' : '') + '>' + escapeHtml(svcCategories[i].name) + '</option>';
            }
            newSel.innerHTML = html;
            input.replaceWith(newSel);
            $('psEditCatAddBtn').textContent = '+';
            psEditCatAddMode = false;
            hideStatus();
          });
        })
        .catch(function(e) { showStatus('Ошибка: ' + e.message, 'error'); });
    } else {
      showEditCatAddForm();
    }
  }

  window.psDelete = deleteService;
  window.psEdit = openEditModal;
  window.psTogglePartner = togglePartner;

  // События
  $('psPartnerCat').addEventListener('change', renderPartnerNameSelect);
  $('psPartnerName').addEventListener('change', checkAddBtn);
  $('psSvcName').addEventListener('input', checkAddBtn);
  $('psCatAddBtn').addEventListener('click', showCatAddForm);
  $('psCatAddSave').addEventListener('click', saveNewCat);
  $('psCatAddCancel').addEventListener('click', hideCatAddForm);
  $('psCatAddInput').addEventListener('keydown', function(e) { if (e.key === 'Enter') saveNewCat(); if (e.key === 'Escape') hideCatAddForm(); });
  var classBtns = document.querySelectorAll('#psClassBtns .ps-class-btn');
  for (var cb = 0; cb < classBtns.length; cb++) {
    classBtns[cb].addEventListener('click', function() { updateClassBtns(parseInt(this.getAttribute('data-count'), 10)); });
  }
  $('psAddBtn').addEventListener('click', addService);
  $('psSearch').addEventListener('input', function() { var t; clearTimeout(t); t = setTimeout(function() { filterData($('psSearch').value); }, 300); });
  $('psEditCancel').addEventListener('click', closeEditModal);
  $('psEditSave').addEventListener('click', saveEditModal);
  $('psEditModal').addEventListener('click', function(e) { if (e.target === this) closeEditModal(); });
  $('psEditCatAddBtn').addEventListener('click', handleEditCatAdd);
  document.addEventListener('keydown', function(e) { if (e.key === 'Escape' && $('psEditModal').style.display === 'flex') closeEditModal(); });

  loadAll();
})();
</script>
