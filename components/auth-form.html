<!-- Форма авторизации DIVO CRM -->

<div class="divo-auth-overlay" id="divoAuthOverlay">
  <div class="divo-auth-box">
    <div class="divo-auth-logo">🔐</div>
    <div class="divo-auth-title">Диво Детейлинг</div>
    <div class="divo-auth-subtitle">Вход в систему</div>

    <form id="divoAuthForm" autocomplete="on" onsubmit="return false;" style="margin:0;padding:0;">
      <div class="divo-auth-field">
        <label class="divo-auth-label" for="divoAuthLogin">Логин</label>
        <input type="text" id="divoAuthLogin" class="divo-auth-input" placeholder="Введите логин" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
      </div>

      <div class="divo-auth-field">
        <label class="divo-auth-label" for="divoAuthPassword">Пароль</label>
        <input type="password" id="divoAuthPassword" class="divo-auth-input" placeholder="Введите пароль" autocomplete="current-password">
      </div>

      <button type="submit" class="divo-auth-btn" id="divoAuthBtn">Войти</button>
    </form>

    <div class="divo-auth-status" id="divoAuthStatus"></div>
  </div>
</div>
