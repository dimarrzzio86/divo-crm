<!-- Раздел: Примеры расчётов (АДМИНКА) -->
<!-- Авто → услуги (прайс) + работы контрагентов -->

<div class="ce-page">
  <div class="ce-header">
    <div>
      <h1 class="ce-title">🧮 Примеры расчётов</h1>
      <div class="ce-subtitle">Авто • услуги • работы контрагентов</div>
    </div>
    <button class="ce-add-btn" onclick="ceOpenCarModal()">➕ Добавить авто</button>
  </div>

  <div class="ce-status" id="ceStatus"></div>

  <div class="ce-search-wrap">
    <span class="ce-search-icon">🔍</span>
    <input type="text" id="ceSearch" class="ce-search-input" placeholder="Поиск по марке, модели..." oninput="ceRender()">
  </div>

  <div class="ce-tabs">
    <button class="ce-tab active" onclick="ceSwitchTab('cars', this)">🚗 Авто и услуги</button>
    <button class="ce-tab" onclick="ceSwitchTab('works', this)">🔧 Работы контрагентов</button>
  </div>

  <div id="ceTabCars">
    <div class="ce-list" id="ceList">
      <div class="ce-loading">Загрузка...</div>
    </div>
  </div>

  <div id="ceTabWorks" style="display:none;">
    <div style="margin-bottom: 16px;">
      <button class="ce-add-btn" onclick="ceOpenWorkModal()">➕ Добавить работу</button>
    </div>
    <div class="ce-list" id="ceWorksList">
      <div class="ce-loading">Загрузка...</div>
    </div>
  </div>
</div>

<!-- Модалка: Авто -->
<div class="ce-modal-overlay" id="ceCarModal" onclick="if(event.target===this)ceCloseCarModal()">
  <div class="ce-modal">
    <h2 class="ce-modal-title" id="ceCarModalTitle">Новое авто</h2>
    <label class="ce-label">Марка *</label>
    <input type="text" class="ce-input" id="ceBrand" placeholder="BMW, Mercedes, Toyota...">
    <label class="ce-label">Модель *</label>
    <input type="text" class="ce-input" id="ceModel" placeholder="X5, GLE, Camry...">
    <div class="ce-form-row">
      <div>
        <label class="ce-label">Поколение</label>
        <input type="text" class="ce-input" id="ceGeneration" placeholder="G05, W167, XV70">
      </div>
      <div>
        <label class="ce-label">Год от</label>
        <input type="number" class="ce-input" id="ceYearFrom" placeholder="2019">
      </div>
      <div>
        <label class="ce-label">Год до</label>
        <input type="number" class="ce-input" id="ceYearTo" placeholder="2024">
      </div>
    </div>
    <label class="ce-label">Комментарий</label>
    <textarea class="ce-textarea" id="ceCarComment" placeholder="Заметка об авто..."></textarea>
    <div class="ce-modal-actions">
      <button class="ce-btn ce-btn-save" onclick="ceSaveCar()">Сохранить</button>
      <button class="ce-btn ce-btn-cancel" onclick="ceCloseCarModal()">Отмена</button>
    </div>
  </div>
</div>

<!-- Модалка: Услуги авто -->
<div class="ce-modal-overlay" id="ceSrvModal" onclick="if(event.target===this)ceCloseSrvModal()">
  <div class="ce-modal" style="max-width: 700px;">
    <h2 class="ce-modal-title">Услуги авто</h2>
    <input type="hidden" id="ceSrvCarId">
    <div id="ceSrvRows"></div>
    <button class="ce-btn-add-srv" onclick="ceAddSrvRow()">➕ Добавить услугу</button>
    <div class="ce-modal-actions">
      <button class="ce-btn ce-btn-save" onclick="ceSaveServices()">Сохранить</button>
      <button class="ce-btn ce-btn-cancel" onclick="ceCloseSrvModal()">Отмена</button>
    </div>
  </div>
</div>

<!-- Модалка: Работа контрагента -->
<div class="ce-modal-overlay" id="ceWorkModal" onclick="if(event.target===this)ceCloseWorkModal()">
  <div class="ce-modal">
    <h2 class="ce-modal-title" id="ceWorkModalTitle">Новая работа</h2>
    <label class="ce-label">Авто *</label>
    <select class="ce-select" id="ceWorkCarId"></select>
    <label class="ce-label">Контрагент *</label>
    <select class="ce-select" id="ceWorkContractorId"></select>
    <label class="ce-label">Услуга *</label>
    <input type="text" class="ce-input" id="ceWorkService" placeholder="Полировка кузова, Керамика 9H...">
    <label class="ce-label">Цена</label>
    <input type="number" class="ce-input" id="ceWorkPrice" placeholder="0">
    <label class="ce-label">Комментарий</label>
    <textarea class="ce-textarea" id="ceWorkComment" placeholder="Заметка..."></textarea>
    <div class="ce-modal-actions">
      <button class="ce-btn ce-btn-save" onclick="ceSaveWork()">Сохранить</button>
      <button class="ce-btn ce-btn-cancel" onclick="ceCloseWorkModal()">Отмена</button>
    </div>
  </div>
</div>

<script>
// ============ ГЛОБАЛЫ ============
var CE_CARS = [];
var CE_SERVICES = [];
var CE_WORKS = [];
var CE_CONTRACTORS = [];
var CE_PRICE_CATS = [];
var CE_PRICE_SUBCATS = [];
var CE_PRICE_SERVICES = [];
var CE_TAB = 'cars';
var CE_EDIT_CAR_ID = null;

function ceHeaders() {
  return { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=representation' };
}

function ceShowStatus(msg, type) {
  var s = document.getElementById('ceStatus');
  if (!s) return;
  s.textContent = msg;
  s.className = 'ce-status show ' + type;
  if (type !== 'loading') setTimeout(function() { s.className = 'ce-status'; }, 3000);
}

function ceEscape(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ============ ЗАГРУЗКА ============
function ceLoadAll(callback) {
  var h = ceHeaders();
  Promise.all([
    fetch(SUPABASE_URL + '/rest/v1/calc_cars?select=*&order=brand.asc,model.asc', { headers: h }).then(function(r){return r.json();}),
    fetch(SUPABASE_URL + '/rest/v1/calc_car_services?select=*&order=created_at.asc', { headers: h }).then(function(r){return r.json();}),
    fetch(SUPABASE_URL + '/rest/v1/calc_contractor_works?select=*&order=created_at.desc', { headers: h }).then(function(r){return r.json();}),
    fetch(SUPABASE_URL + '/rest/v1/contractors?select=id,name,category&order=name.asc', { headers: h }).then(function(r){return r.json();}),
    fetch(SUPABASE_URL + '/rest/v1/service_categories?select=*&order=sort_order.asc,name.asc', { headers: h }).then(function(r){return r.json();}),
    fetch(SUPABASE_URL + '/rest/v1/service_subcategories?select=*&order=sort_order.asc,name.asc', { headers: h }).then(function(r){return r.json();}),
    fetch(SUPABASE_URL + '/rest/v1/services?select=*&order=name.asc', { headers: h }).then(function(r){return r.json();})
  ]).then(function(results) {
    CE_CARS = results[0] || [];
    CE_SERVICES = results[1] || [];
    CE_WORKS = results[2] || [];
    CE_CONTRACTORS = results[3] || [];
    CE_PRICE_CATS = results[4] || [];
    CE_PRICE_SUBCATS = results[5] || [];
    CE_PRICE_SERVICES = results[6] || [];
    ceRender();
    ceRenderWorks();
    if (typeof callback === 'function') callback();
  }).catch(function(e) {
    console.error('CE load error:', e);
    ceShowStatus('Ошибка загрузки: ' + e.message, 'error');
    if (typeof callback === 'function') callback();
  });
}

// ============ РЕНДЕР: Авто + услуги ============
function ceRender() {
  var list = document.getElementById('ceList');
  if (!list) return;
  var search = (document.getElementById('ceSearch') ? document.getElementById('ceSearch').value : '').toLowerCase();
  
  if (!CE_CARS.length) {
    list.innerHTML = '<div class="ce-empty">Нет авто. Нажмите «Добавить авто»</div>';
    return;
  }
  
  var html = '';
  for (var i = 0; i < CE_CARS.length; i++) {
    var car = CE_CARS[i];
    var carTitle = car.brand + ' ' + car.model;
    var carSub = '';
    if (car.generation) carSub += car.generation;
    if (car.year_from || car.year_to) {
      carSub += (carSub ? ' • ' : '') + (car.year_from || '?') + '–' + (car.year_to || 'н.в.');
    }
    
    if (search && carTitle.toLowerCase().indexOf(search) === -1 && carSub.toLowerCase().indexOf(search) === -1) continue;
    
    var services = CE_SERVICES.filter(function(s){ return s.car_id === car.id; });
    var total = 0;
    services.forEach(function(s){ total += Number(s.price) || 0; });
    
    html += '<div class="ce-car-card" id="ceCar' + car.id + '">';
    html += '<div class="ce-car-header" onclick="ceToggleCar(' + car.id + ')">';
    html += '<span class="ce-car-icon">🚗</span>';
    html += '<div class="ce-car-info">';
    html += '<div class="ce-car-title">' + ceEscape(carTitle) + '</div>';
    if (carSub) html += '<div class="ce-car-sub">' + ceEscape(carSub) + '</div>';
    html += '</div>';
    html += '<div class="ce-car-actions" onclick="event.stopPropagation()">';
    html += '<button onclick="ceOpenSrvModal(' + car.id + ')">🔧 Услуги (' + services.length + ')</button>';
    html += '<button onclick="ceOpenWorkModalForCar(' + car.id + ')">🏗 Работа</button>';
    html += '<button onclick="ceEditCar(' + car.id + ')">✏️</button>';
    html += '<button class="del" onclick="ceDeleteCar(' + car.id + ')">🗑</button>';
    html += '</div>';
    html += '<span class="ce-car-arrow">▶</span>';
    html += '</div>';
    
    // Тело — список услуг
    html += '<div class="ce-car-body">';
    if (!services.length) {
      html += '<div class="ce-empty" style="padding:20px;">Нет услуг. Нажмите «🔧 Услуги (0)»</div>';
    } else {
      html += '<table class="ce-services-table"><thead><tr>';
      html += '<th>Услуга</th><th>Цена</th>';
      html += '</tr></thead><tbody>';
      for (var k = 0; k < services.length; k++) {
        var srv = services[k];
        html += '<tr>';
        html += '<td>' + ceEscape(srv.service_name) + '</td>';
        html += '<td class="ce-srv-price">' + (srv.price ? Number(srv.price).toLocaleString('ru') + ' ₽' : '—') + '</td>';
        html += '</tr>';
      }
      html += '<tr style="font-weight:bold;border-top:2px solid #3b82f6;"><td>Итого:</td><td class="ce-srv-price">' + total.toLocaleString('ru') + ' ₽</td></tr>';
      html += '</tbody></table>';
    }
    html += '</div>';
    html += '</div>';
  }
  
  list.innerHTML = html;
}

// ============ РЕНДЕР: Работы контрагентов ============
function ceRenderWorks() {
  var list = document.getElementById('ceWorksList');
  if (!list) return;
  
  if (!CE_WORKS.length) {
    list.innerHTML = '<div class="ce-empty">Нет работ. Нажмите «Добавить работу»</div>';
    return;
  }
  
  var html = '<table class="ce-works-table"><thead><tr>';
  html += '<th>Авто</th><th>Контрагент</th><th>Услуга</th><th>Цена</th><th>Комментарий</th><th></th>';
  html += '</tr></thead><tbody>';
  
  for (var i = 0; i < CE_WORKS.length; i++) {
    var w = CE_WORKS[i];
    var car = CE_CARS.find(function(c){return c.id===w.car_id;});
    var contractor = CE_CONTRACTORS.find(function(c){return c.id===w.contractor_id;});
    var carTitle = car ? (car.brand + ' ' + car.model) : '—';
    html += '<tr>';
    html += '<td>' + ceEscape(carTitle) + '</td>';
    html += '<td>' + (contractor ? ceEscape(contractor.name) : '—') + '</td>';
    html += '<td>' + ceEscape(w.service_name) + '</td>';
    html += '<td class="ce-work-price">' + (w.price ? Number(w.price).toLocaleString('ru') + ' ₽' : '—') + '</td>';
    html += '<td>' + ceEscape(w.comment) + '</td>';
    html += '<td><button class="ce-srv-del" onclick="ceDeleteWork(' + w.id + ')">🗑</button></td>';
    html += '</tr>';
  }
  
  html += '</tbody></table>';
  list.innerHTML = html;
}

// ============ ВКЛАДКИ ============
function ceSwitchTab(tab, btn) {
  CE_TAB = tab;
  document.querySelectorAll('.ce-tab').forEach(function(t){t.classList.remove('active');});
  if (btn) btn.classList.add('active');
  document.getElementById('ceTabCars').style.display = tab === 'cars' ? '' : 'none';
  document.getElementById('ceTabWorks').style.display = tab === 'works' ? '' : 'none';
}

// ============ TOGGLE ============
function ceToggleCar(id) {
  var el = document.getElementById('ceCar' + id);
  if (el) el.classList.toggle('expanded');
}

// ============ АВТО: CRUD ============
function ceOpenCarModal() {
  CE_EDIT_CAR_ID = null;
  document.getElementById('ceCarModalTitle').textContent = 'Новое авто';
  ['ceBrand','ceModel','ceGeneration','ceYearFrom','ceYearTo','ceCarComment'].forEach(function(id){
    document.getElementById(id).value = '';
  });
  document.getElementById('ceCarModal').classList.add('open');
}

function ceCloseCarModal() {
  document.getElementById('ceCarModal').classList.remove('open');
}

function ceEditCar(id) {
  var car = CE_CARS.find(function(c){return c.id===id;});
  if (!car) return;
  CE_EDIT_CAR_ID = id;
  document.getElementById('ceCarModalTitle').textContent = 'Редактировать авто';
  document.getElementById('ceBrand').value = car.brand || '';
  document.getElementById('ceModel').value = car.model || '';
  document.getElementById('ceGeneration').value = car.generation || '';
  document.getElementById('ceYearFrom').value = car.year_from || '';
  document.getElementById('ceYearTo').value = car.year_to || '';
  document.getElementById('ceCarComment').value = car.comment || '';
  document.getElementById('ceCarModal').classList.add('open');
}

function ceSaveCar() {
  var brand = document.getElementById('ceBrand').value.trim();
  var model = document.getElementById('ceModel').value.trim();
  if (!brand || !model) { ceShowStatus('Укажите марку и модель', 'error'); return; }
  
  var data = {
    brand: brand,
    model: model,
    generation: document.getElementById('ceGeneration').value.trim() || null,
    year_from: document.getElementById('ceYearFrom').value ? parseInt(document.getElementById('ceYearFrom').value) : null,
    year_to: document.getElementById('ceYearTo').value ? parseInt(document.getElementById('ceYearTo').value) : null,
    comment: document.getElementById('ceCarComment').value.trim() || null
  };
  
  var method = CE_EDIT_CAR_ID ? 'PATCH' : 'POST';
  var url = SUPABASE_URL + '/rest/v1/calc_cars' + (CE_EDIT_CAR_ID ? '?id=eq.' + CE_EDIT_CAR_ID : '');
  
  ceShowStatus('Сохранение...', 'loading');
  fetch(url, { method: method, headers: ceHeaders(), body: JSON.stringify(data) })
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function() {
      ceCloseCarModal();
      ceShowStatus('Сохранено', 'success');
      ceLoadAll();
    })
    .catch(function(e){ ceShowStatus('Ошибка: ' + e.message, 'error'); });
}

function ceDeleteCar(id) {
  if (!confirm('Удалить авто и все его услуги?')) return;
  ceShowStatus('Удаление...', 'loading');
  fetch(SUPABASE_URL + '/rest/v1/calc_cars?id=eq.' + id, { method: 'DELETE', headers: ceHeaders() })
    .then(function(){ ceShowStatus('Удалено', 'success'); ceLoadAll(); })
    .catch(function(e){ ceShowStatus('Ошибка: ' + e.message, 'error'); });
}

// ============ УСЛУГИ (каскадные селекты + ручной ввод) ============
function ceOpenSrvModal(carId) {
  document.getElementById('ceSrvCarId').value = carId;
  var rows = document.getElementById('ceSrvRows');
  rows.innerHTML = '';
  var existing = CE_SERVICES.filter(function(s){return s.car_id === carId;});
  if (existing.length) {
    existing.forEach(function(s){ ceAddSrvRow(s); });
  } else {
    ceAddSrvRow();
  }
  document.getElementById('ceSrvModal').classList.add('open');
}

function ceCloseSrvModal() {
  document.getElementById('ceSrvModal').classList.remove('open');
}

// --- Опции каскадных селектов ---
function ceCatOptions(selected) {
  var html = '<option value="">— Категория —</option>';
  for (var i = 0; i < CE_PRICE_CATS.length; i++) {
    var cat = CE_PRICE_CATS[i];
    var sel = (String(cat.id) === String(selected)) ? ' selected' : '';
    html += '<option value="' + cat.id + '"' + sel + '>' + ceEscape(cat.name) + '</option>';
  }
  return html;
}

function ceSubcatOptions(catId, selected) {
  var subs = CE_PRICE_SUBCATS.filter(function(s) { return String(s.category_id) === String(catId); });
  if (subs.length === 0) return '<option value="">(любая)</option>';
  var html = '<option value="">— Подкатегория —</option>';
  for (var i = 0; i < subs.length; i++) {
    var sel = (String(subs[i].id) === String(selected)) ? ' selected' : '';
    html += '<option value="' + subs[i].id + '"' + sel + '>' + ceEscape(subs[i].name) + '</option>';
  }
  return html;
}

function ceSvcOptions(catId, subcatId, selected) {
  var svcs;
  if (subcatId) {
    svcs = CE_PRICE_SERVICES.filter(function(s) { return String(s.subcategory_id) === String(subcatId); });
  } else {
    svcs = CE_PRICE_SERVICES.filter(function(s) { return String(s.category_id) === String(catId); });
  }
  if (svcs.length === 0) return '<option value="">— Нет услуг —</option>';
  var html = '<option value="">— Услуга —</option>';
  for (var i = 0; i < svcs.length; i++) {
    var sel = (String(svcs[i].id) === String(selected)) ? ' selected' : '';
    html += '<option value="' + svcs[i].id + '" data-name="' + ceEscape(svcs[i].name) + '"' + sel + '>' + ceEscape(svcs[i].name) + '</option>';
  }
  return html;
}

function ceFindCatByServiceId(svcId) {
  var svc = CE_PRICE_SERVICES.find(function(s){return String(s.id) === String(svcId);});
  return svc ? svc.category_id : '';
}
function ceFindSubByServiceId(svcId) {
  var svc = CE_PRICE_SERVICES.find(function(s){return String(s.id) === String(svcId);});
  return svc ? svc.subcategory_id : '';
}

// --- Создание строки услуги ---
function ceAddSrvRow(existing) {
  var rows = document.getElementById('ceSrvRows');
  var div = document.createElement('div');
  div.className = 'ce-srv-row';
  div.style.flexWrap = 'wrap';
  
  var manual = existing && existing.manual;
  var catId = existing && existing.service_id ? ceFindCatByServiceId(existing.service_id) : '';
  var subcatId = existing && existing.service_id ? ceFindSubByServiceId(existing.service_id) : '';
  
  div.innerHTML = 
    '<input type="hidden" class="ce-srv-id" value="' + (existing ? existing.id : '') + '">' +
    '<label class="ce-srv-check" title="Ручной ввод">' +
      '<input type="checkbox" class="ce-srv-manual"' + (manual ? ' checked' : '') + '>' +
      '<span>✍️</span>' +
    '</label>' +
    '<div class="ce-srv-selects" style="display:flex;gap:6px;flex:1 1 100%;flex-wrap:wrap;">' +
      '<select class="ce-srv-cat" style="flex:1;min-width:120px;">' + ceCatOptions(catId) + '</select>' +
      '<select class="ce-srv-subcat" style="flex:1;min-width:120px;"' + (catId ? '' : ' disabled') + '>' + ceSubcatOptions(catId, subcatId) + '</select>' +
      '<select class="ce-srv-svc" style="flex:1.5;min-width:140px;"' + (catId ? '' : ' disabled') + '>' + ceSvcOptions(catId, subcatId, existing ? existing.service_id : '') + '</select>' +
    '</div>' +
    '<input type="text" class="ce-srv-name" placeholder="Название услуги" value="' + ceEscape(existing ? existing.service_name : '') + '" style="display:' + (manual ? 'block' : 'none') + ';flex:1 1 100%;">' +
    '<input type="number" class="ce-srv-price-input" placeholder="Цена" value="' + (existing ? existing.price : '') + '">' +
    '<button class="ce-srv-del">🗑</button>';
  
  var catSel = div.querySelector('.ce-srv-cat');
  var subcatSel = div.querySelector('.ce-srv-subcat');
  var svcSel = div.querySelector('.ce-srv-svc');
  var manualCheck = div.querySelector('.ce-srv-manual');
  var delBtn = div.querySelector('.ce-srv-del');
  
  catSel.addEventListener('change', function() {
    var val = this.value;
    subcatSel.innerHTML = ceSubcatOptions(val, '');
    subcatSel.disabled = !val;
    svcSel.innerHTML = '<option value="">—</option>';
    svcSel.disabled = true;
  });
  
  subcatSel.addEventListener('change', function() {
    var val = this.value;
    var cid = catSel.value;
    svcSel.innerHTML = ceSvcOptions(cid, val, '');
    svcSel.disabled = !val;
  });
  
  svcSel.addEventListener('change', function() {
    var val = this.value;
    if (val) {
      var opt = this.options[this.selectedIndex];
      var nameInput = div.querySelector('.ce-srv-name');
      if (nameInput) nameInput.value = opt.dataset.name || opt.text;
    }
  });
  
  manualCheck.addEventListener('change', function() {
    var selects = div.querySelector('.ce-srv-selects');
    var nameInput = div.querySelector('.ce-srv-name');
    if (this.checked) {
      if (selects) selects.style.display = 'none';
      if (nameInput) nameInput.style.display = 'block';
    } else {
      if (selects) selects.style.display = 'flex';
      if (nameInput) nameInput.style.display = 'none';
    }
  });
  
  delBtn.addEventListener('click', function() {
    div.remove();
  });
  
  if (manual) {
    var sels = div.querySelector('.ce-srv-selects');
    if (sels) sels.style.display = 'none';
  }
  
  rows.appendChild(div);
}

// ============ СОХРАНЕНИЕ УСЛУГ ============
function ceSaveServices() {
  var carId = parseInt(document.getElementById('ceSrvCarId').value);
  var rows = document.querySelectorAll('.ce-srv-row');
  var toSave = [];
  var toDelete = [];
  var existingIds = CE_SERVICES.filter(function(s){return s.car_id === carId;}).map(function(s){return s.id;});
  var seenIds = [];
  
  rows.forEach(function(row) {
    var id = row.querySelector('.ce-srv-id').value;
    var isManual = row.querySelector('.ce-srv-manual').checked;
    var svcSelect = row.querySelector('.ce-srv-svc');
    var serviceId = svcSelect ? svcSelect.value : '';
    var name = row.querySelector('.ce-srv-name').value.trim();
    if (!isManual && serviceId) {
      var opt = svcSelect.options[svcSelect.selectedIndex];
      if (opt) name = opt.dataset.name || opt.text;
    }
    if (!name) return;
    var price = row.querySelector('.ce-srv-price-input').value;
    
    var item = {
      car_id: carId,
      service_name: name,
      service_id: serviceId ? parseInt(serviceId) : null,
      manual: isManual,
      price: price ? parseFloat(price) : null
    };
    
    if (id) {
      item.id = parseInt(id);
      seenIds.push(parseInt(id));
      toSave.push({ action: 'update', data: item });
    } else {
      toSave.push({ action: 'insert', data: item });
    }
  });
  
  existingIds.forEach(function(eid){
    if (seenIds.indexOf(eid) === -1) toDelete.push(eid);
  });
  
  ceShowStatus('Сохранение услуг...', 'loading');
  var promises = [];
  
  toDelete.forEach(function(id){
    promises.push(fetch(SUPABASE_URL + '/rest/v1/calc_car_services?id=eq.' + id, { method: 'DELETE', headers: ceHeaders() }));
  });
  
  toSave.forEach(function(item){
    if (item.action === 'update') {
      var d = Object.assign({}, item.data);
      delete d.id;
      promises.push(fetch(SUPABASE_URL + '/rest/v1/calc_car_services?id=eq.' + item.data.id, { method: 'PATCH', headers: ceHeaders(), body: JSON.stringify(d) }));
    } else {
      promises.push(fetch(SUPABASE_URL + '/rest/v1/calc_car_services', { method: 'POST', headers: ceHeaders(), body: JSON.stringify(item.data) }));
    }
  });
  
  Promise.all(promises)
    .then(function() {
      ceCloseSrvModal();
      ceShowStatus('Услуги сохранены', 'success');
      ceLoadAll();
    })
    .catch(function(e){ ceShowStatus('Ошибка: ' + e.message, 'error'); });
}

// ============ РАБОТЫ КОНТРАГЕНТОВ ============
function ceOpenWorkModal() {
  document.getElementById('ceWorkModalTitle').textContent = 'Новая работа';
  ceFillWorkSelects();
  document.getElementById('ceWorkService').value = '';
  document.getElementById('ceWorkPrice').value = '';
  document.getElementById('ceWorkComment').value = '';
  document.getElementById('ceWorkModal').classList.add('open');
}

function ceOpenWorkModalForCar(carId) {
  document.getElementById('ceWorkModalTitle').textContent = 'Новая работа';
  ceFillWorkSelects();
  document.getElementById('ceWorkCarId').value = carId;
  document.getElementById('ceWorkService').value = '';
  document.getElementById('ceWorkPrice').value = '';
  document.getElementById('ceWorkComment').value = '';
  document.getElementById('ceWorkModal').classList.add('open');
}

function ceFillWorkSelects() {
  var carSel = document.getElementById('ceWorkCarId');
  var conSel = document.getElementById('ceWorkContractorId');
  carSel.innerHTML = '<option value="">— выберите авто —</option>';
  CE_CARS.forEach(function(c){
    var t = c.brand + ' ' + c.model + (c.generation ? ' ' + c.generation : '');
    carSel.innerHTML += '<option value="' + c.id + '">' + ceEscape(t) + '</option>';
  });
  conSel.innerHTML = '<option value="">— выберите контрагента —</option>';
  CE_CONTRACTORS.forEach(function(c){
    conSel.innerHTML += '<option value="' + c.id + '">' + ceEscape(c.name) + '</option>';
  });
}

function ceCloseWorkModal() {
  document.getElementById('ceWorkModal').classList.remove('open');
}

function ceSaveWork() {
  var carId = document.getElementById('ceWorkCarId').value;
  var contractorId = document.getElementById('ceWorkContractorId').value;
  var service = document.getElementById('ceWorkService').value.trim();
  var price = document.getElementById('ceWorkPrice').value;
  var comment = document.getElementById('ceWorkComment').value.trim();
  
  if (!carId || !contractorId || !service) {
    ceShowStatus('Заполните авто, контрагента и услугу', 'error');
    return;
  }
  
  var data = {
    car_id: parseInt(carId),
    contractor_id: parseInt(contractorId),
    service_name: service,
    price: price ? parseFloat(price) : null,
    comment: comment || null
  };
  
  ceShowStatus('Сохранение...', 'loading');
  fetch(SUPABASE_URL + '/rest/v1/calc_contractor_works', { method: 'POST', headers: ceHeaders(), body: JSON.stringify(data) })
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function() {
      ceCloseWorkModal();
      ceShowStatus('Работа добавлена', 'success');
      ceLoadAll();
    })
    .catch(function(e){ ceShowStatus('Ошибка: ' + e.message, 'error'); });
}

function ceDeleteWork(id) {
  if (!confirm('Удалить работу?')) return;
  ceShowStatus('Удаление...', 'loading');
  fetch(SUPABASE_URL + '/rest/v1/calc_contractor_works?id=eq.' + id, { method: 'DELETE', headers: ceHeaders() })
    .then(function(){ ceShowStatus('Удалено', 'success'); ceLoadAll(); })
    .catch(function(e){ ceShowStatus('Ошибка: ' + e.message, 'error'); });
}

// ============ ИНИЦИАЛИЗАЦИЯ ============
ceLoadAll();
</script>
