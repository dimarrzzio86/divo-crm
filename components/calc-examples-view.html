<!-- Раздел: Примеры расчётов (ПРОСМОТР) -->

<div class="ce-page">
  <div class="ce-header">
    <div>
      <h1 class="ce-title">🧞 Примеры расчётов</h1>
      <div class="ce-subtitle">Выберите авто для просмотра услуг и работ</div>
    </div>
  </div>

  <div class="ce-status" id="ceStatus"></div>

  <div class="ce-tabs">
    <button class="ce-tab active" onclick="ceSwitchTab('cars', this)">🚗 Авто и услуги</button>
    <button class="ce-tab" onclick="ceSwitchTab('works', this)">🛧 Работы контрагентов</button>
  </div>

  <!-- ВКЛАДКА: АВТО И УСЛУГИ -->
  <div id="ceTabCars">
    <!-- Кнопка выбора авто как на auto.ru -->
    <div class="ce-pick-wrap">
      <div class="ce-pick-current" id="cePickDisplay" onclick="ceOpenPicker()">
        <span class="ce-pick-icon">🔍</span>
        <span class="ce-pick-text" id="cePickText">Выбрать марку</span>
        <span class="ce-pick-arrow">▼</span>
      </div>
      <button class="ce-pick-reset" id="cePickReset" onclick="ceResetPick()" style="display:none;">✕ Сбросить</button>
    </div>

    <!-- Список -->
    <div class="ce-list" id="ceList">
      <div class="ce-loading">Загрузка...</div>
    </div>
  </div>

  <!-- ВКЛАДКА: РАБОТЫ -->
  <div id="ceTabWorks" style="display:none;">
    <div class="ce-list" id="ceWorksList">
      <div class="ce-loading">Загрузка...</div>
    </div>
  </div>
</div>

<!-- Модалка выбора авто (как на auto.ru) -->
<div class="ce-picker-overlay" id="cePicker" onclick="if(event.target===this)ceClosePicker()">
  <div class="ce-picker">
    <div class="ce-picker-head">
      <h3 class="ce-picker-title" id="cePickerTitle">Выберите марку</h3>
      <button class="ce-picker-close" onclick="ceClosePicker()">✕</button>
    </div>
    <div class="ce-picker-search">
      <input type="text" id="cePickerSearch" placeholder="Поиск..." oninput="cePickerSearchInput()">
    </div>
    <div class="ce-picker-body" id="cePickerBody"></div>
    <div class="ce-picker-foot">
      <button class="ce-picker-back" id="cePickerBack" onclick="cePickerBack()" style="display:none;">← Назад</button>
    </div>
  </div>
</div>

<script>
var CE_CARS = [];
var CE_SERVICES = [];
var CE_WORKS = [];
var CE_CONTRACTORS = [];
var CE_PRICE_CATS = [];
var CE_PRICE_SUBCATS = [];
var CE_PRICE_SERVICES = [];
var CE_PICK_BRAND = '';
var CE_PICK_MODEL = '';
var CE_PICK_GEN = '';
var CE_PICK_STAGE = 'brand';
CE_TAB = 'cars';

function ceHeaders() {
  return { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY };
}

function ceEscape(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function ceShowStatus(msg, type) {
  var s = document.getElementById('ceStatus');
  if (!s) return;
  s.textContent = msg;
  s.className = 'ce-status show ' + type;
  if (type !== 'loading') setTimeout(function() { s.className = 'ce-status'; }, 3000);
}

// ============ ЗАГРУЗКА ============
function ceLoadAll() {
  var h = ceHeaders();
  Promise.all([
    fetch(SUPABASE_URL + '/rest/v1/calc_cars?select=*&order=brand.asc,model.asc,year_from.desc', { headers: h }).then(function(r){return r.json();}),
    fetch(SUPABASE_URL + '/rest/v1/calc_car_services?select=*&order=created_at.asc', { headers: h }).then(function(r){return r.json();}),
    fetch(SUPABASE_URL + '/rest/v1/calc_contractor_works?select=*&order=created_at.desc', { headers: h }).then(function(r){return r.json();}),
    fetch(SUPABASE_URL + '/rest/v1/contractors?select=id,name,category&order=name.asc', { headers: h }).then(function(r){return r.json();}),
    fetch(SUPABASE_URL + '/rest/v1/service_categories?select=*&order=sort_order.asc,name.asc', { headers: h }).then(function(r){return r.json();}),
    fetch(SUPABASE_URL + '/rest/v1/service_subcategories?select=*&order=sort_order.asc,name.asc', { headers: h }).then(function(r){return r.json();}),
    fetch(SUPABASE_URL + '/rest/v1/services?select=*&order=name.asc', { headers: h }).then(function(r){return r.json();})
  ]).then(function(results) {
    CE_CARS = results[0] || [];
    CE_SERVICES = results[1] || [];
    CE_WORKS = results[2] || [];
    CE_CONTRACTORS = results[3] || [];
    CE_PRICE_CATS = results[4] || [];
    CE_PRICE_SUBCATS = results[5] || [];
    CE_PRICE_SERVICES = results[6] || [];
    ceRenderList();
    ceRenderWorks();
  }).catch(function(e) {
    console.error('CE load error:', e);
    var list = document.getElementById('ceList');
    if (list) list.innerHTML = '<div class="ce-empty">Ошибка загрузки</div>';
  });
}

// ============ ПИКЕР (КАК НА AUTO.RU) ============
function ceOpenPicker() {
  CE_PICK_STAGE = 'brand';
  document.getElementById('cePickerSearch').value = '';
  cePickerRender();
  document.getElementById('cePicker').classList.add('open');
}

function ceClosePicker() {
  document.getElementById('cePicker').classList.remove('open');
}

function cePickerSearchInput() {
  cePickerRender();
}

function cePickerRender() {
  var body = document.getElementById('cePickerBody');
  var title = document.getElementById('cePickerTitle');
  var backBtn = document.getElementById('cePickerBack');
  var q = (document.getElementById('cePickerSearch').value || '').toLowerCase().trim();
  
  if (CE_PICK_STAGE === 'brand') {
    title.textContent = 'Выберите марку';
    backBtn.style.display = 'none';
    
    // Список марок
    var brands = [];
    var seen = {};
    for (var i = 0; i < CE_CARS.length; i++) {
      var b = CE_CARS[i].brand;
      var key = b.toLowerCase().trim();
      if (!seen[key]) { seen[key] = true; brands.push(b); }
    }
    brands.sort();
    if (q) brands = brands.filter(function(b){ return b.toLowerCase().indexOf(q) !== -1; });
    
    // Группировка по первой букве
    var groups = {};
    var groupKeys = [];
    for (var i = 0; i < brands.length; i++) {
      var first = brands[i].charAt(0).toUpperCase();
      if (!groups[first]) { groups[first] = []; groupKeys.push(first); }
      groups[first].push(brands[i]);
    }
    groupKeys.sort();
    
    var html = '';
    for (var gi = 0; gi < groupKeys.length; gi++) {
      var letter = groupKeys[gi];
      var items = groups[letter];
      html += '<div class="ce-picker-letter">' + ceEscape(letter) + '</div>';
      html += '<div class="ce-picker-grid">';
      for (var i = 0; i < items.length; i++) {
        var count = CE_CARS.filter(function(c){ return c.brand.toLowerCase().trim() === items[i].toLowerCase().trim(); }).length;
        html += '<div class="ce-picker-item" onclick="cePickBrand(\'' + ceEscape(items[i]).replace(/'/g,"\\'") + '\')">';
        html += '<span class="ce-picker-item-name">' + ceEscape(items[i]) + '</span>';
        html += '<span class="ce-picker-item-count">' + count + '</span>';
        html += '</div>';
      }
      html += '</div>';
    }
    body.innerHTML = html;
    
  } else if (CE_PICK_STAGE === 'model') {
    title.textContent = CE_PICK_BRAND + ' — выберите модель';
    backBtn.style.display = '';
    backBtn.textContent = '← К маркам';
    
    var models = [];
    var seenM = {};
    for (var i = 0; i < CE_CARS.length; i++) {
      if (CE_CARS[i].brand.toLowerCase().trim() === CE_PICK_BRAND.toLowerCase().trim()) {
        var m = CE_CARS[i].model;
        var key = m.toLowerCase().trim();
        if (!seenM[key]) { seenM[key] = true; models.push(m); }
      }
    }
    models.sort();
    if (q) models = models.filter(function(m){ return m.toLowerCase().indexOf(q) !== -1; });
    
    var html = '';
    if (!models.length) {
      html = '<div class="ce-picker-empty">Нет моделей</div>';
    } else {
      html += '<div class="ce-picker-grid">';
      for (var i = 0; i < models.length; i++) {
        var count = CE_CARS.filter(function(c){ 
          return c.brand.toLowerCase().trim() === CE_PICK_BRAND.toLowerCase().trim() && 
                 c.model.toLowerCase().trim() === models[i].toLowerCase().trim(); 
        }).length;
        html += '<div class="ce-picker-item" onclick="cePickModel(\'' + ceEscape(models[i]).replace(/'/g,"\\'") + '\')">';
        html += '<span class="ce-picker-item-name">' + ceEscape(models[i]) + '</span>';
        html += '<span class="ce-picker-item-count">' + count + '</span>';
        html += '</div>';
      }
      html += '</div>';
    }
    body.innerHTML = html;
    
  } else if (CE_PICK_STAGE === 'gen') {
    title.textContent = CE_PICK_BRAND + ' ' + CE_PICK_MODEL + ' — поколение';
    backBtn.style.display = '';
    backBtn.textContent = '← К моделям';
    
    var cars = CE_CARS.filter(function(c){
      return c.brand.toLowerCase().trim() === CE_PICK_BRAND.toLowerCase().trim() &&
             c.model.toLowerCase().trim() === CE_PICK_MODEL.toLowerCase().trim();
    });
    if (q) cars = cars.filter(function(c){ 
      var info = ceCarGenInfo(c).toLowerCase();
      return info.indexOf(q) !== -1;
    });
    
    var html = '';
    if (!cars.length) {
      html = '<div class="ce-picker-empty">Нет поколений</div>';
    } else {
      html += '<div class="ce-picker-list">';
      for (var i = 0; i < cars.length; i++) {
        var car = cars[i];
        var info = ceCarGenInfo(car) || 'Базовая версия';
        var classInfo = car.class ? ' • Класс ' + car.class : '';
        html += '<div class="ce-picker-item ce-picker-item-row" onclick="cePickGen(' + car.id + ', \'' + ceEscape(info).replace(/'/g,"\\'") + '\')">';
        html += '<span class="ce-picker-item-name">' + ceEscape(info) + classInfo + '</span>';
        html += '<span class="ce-picker-item-arrow">▶</span>';
        html += '</div>';
      }
      html += '</div>';
    }
    body.innerHTML = html;
  }
}

function cePickBrand(brand) {
  CE_PICK_BRAND = brand;
  CE_PICK_MODEL = '';
  CE_PICK_GEN = '';
  CE_PICK_STAGE = 'model';
  document.getElementById('cePickerSearch').value = '';
  cePickerRender();
}

function cePickModel(model) {
  CE_PICK_MODEL = model;
  CE_PICK_GEN = '';
  CE_PICK_STAGE = 'gen';
  document.getElementById('cePickerSearch').value = '';
  cePickerRender();
}

function cePickGen(carId, info) {
  CE_PICK_GEN = carId;
  ceClosePicker();
  ceUpdatePickDisplay();
  ceRenderList();
}

function cePickerBack() {
  if (CE_PICK_STAGE === 'gen') {
    CE_PICK_STAGE = 'model';
    CE_PICK_GEN = '';
  } else if (CE_PICK_STAGE === 'model') {
    CE_PICK_STAGE = 'brand';
    CE_PICK_BRAND = '';
    CE_PICK_MODEL = '';
  }
  document.getElementById('cePickerSearch').value = '';
  cePickerRender();
}

function ceUpdatePickDisplay() {
  var text = document.getElementById('cePickText');
  var resetBtn = document.getElementById('cePickReset');
  if (CE_PICK_GEN) {
    var car = CE_CARS.find(function(c){ return c.id === CE_PICK_GEN; });
    if (car) {
      var info = ceCarGenInfo(car);
      text.textContent = car.brand + ' ' + car.model + (info ? ' ' + info : '');
    }
    resetBtn.style.display = '';
  } else if (CE_PICK_MODEL) {
    text.textContent = CE_PICK_BRAND + ' ' + CE_PICK_MODEL + ' (все поколения)';
    resetBtn.style.display = '';
  } else if (CE_PICK_BRAND) {
    text.textContent = CE_PICK_BRAND + ' (все модели)';
    resetBtn.style.display = '';
  } else {
    text.textContent = 'Выбрать марку';
    resetBtn.style.display = 'none';
  }
}

function ceResetPick() {
  CE_PICK_BRAND = '';
  CE_PICK_MODEL = '';
  CE_PICK_GEN = '';
  ceUpdatePickDisplay();
  ceRenderList();
}

// ============ ГРУППИРОВКА + ФИЛЬТР ============
function ceCarGenInfo(car) {
  var parts = [];
  if (car.generation) parts.push(car.generation);
  if (car.year_from || car.year_to) parts.push((car.year_from || '?') + '–' + (car.year_to || 'н.в.'));
  return parts.join(' • ');
}

function getModelWord(n) {
  if (n === 1) return 'ь';
  if (n >= 2 && n <= 4) return 'и';
  return 'ей';
}

function ceGetFilteredCars() {
  var filtered = CE_CARS.slice();
  if (CE_PICK_BRAND) {
    filtered = filtered.filter(function(c){ return c.brand.toLowerCase().trim() === CE_PICK_BRAND.toLowerCase().trim(); });
  }
  if (CE_PICK_MODEL) {
    filtered = filtered.filter(function(c){ return c.model.toLowerCase().trim() === CE_PICK_MODEL.toLowerCase().trim(); });
  }
  if (CE_PICK_GEN) {
    filtered = filtered.filter(function(c){ return c.id === CE_PICK_GEN; });
  }
  return filtered;
}

function ceRenderList() {
  var list = document.getElementById('ceList');
  if (!list) return;
  
  if (!CE_CARS.length) {
    list.innerHTML = '<div class="ce-empty">Пока нет примеров расчётов</div>';
    return;
  }
  
  var cars = ceGetFilteredCars();
  
  if (!cars.length) {
    list.innerHTML = '<div class="ce-empty">Нет авто по выбранным критериям</div>';
    return;
  }
  
  // Группировка
  cars.sort(function(a, b) {
    var ba = (a.brand || '').toLowerCase(), bb = (b.brand || '').toLowerCase();
    if (ba < bb) return -1;
    if (ba > bb) return 1;
    var ma = (a.model || '').toLowerCase(), mb = (b.model || '').toLowerCase();
    if (ma < mb) return -1;
    if (ma > mb) return 1;
    return (b.year_from || 0) - (a.year_from || 0);
  });
  
  var brands = [];
  var brandMap = {};
  for (var i = 0; i < cars.length; i++) {
    var car = cars[i];
    var bKey = (car.brand || '').toLowerCase().trim();
    if (!brandMap[bKey]) {
      brandMap[bKey] = { brand: car.brand, models: {} };
      brands.push(brandMap[bKey]);
    }
    var brand = brandMap[bKey];
    var mKey = (car.model || '').toLowerCase().trim();
    if (!brand.models[mKey]) brand.models[mKey] = { model: car.model, cars: [] };
    brand.models[mKey].cars.push(car);
  }
  for (var i = 0; i < brands.length; i++) {
    var modelArr = [];
    for (var mk in brands[i].models) modelArr.push(brands[i].models[mk]);
    brands[i].models = modelArr;
  }
  
  var html = '';
  for (var bi = 0; bi < brands.length; bi++) {
    var brand = brands[bi];
    var totalCars = 0;
    for (var mi = 0; mi < brand.models.length; mi++) totalCars += brand.models[mi].cars.length;
    
    // Если выбрано поколение — не группируем, показываем сразу
    var skipBrandHeader = CE_PICK_GEN && brands.length === 1 && brand.models.length === 1 && brand.models[0].cars.length === 1;
    
    if (!skipBrandHeader) {
      html += '<div class="ce-car-card" id="ceBrand' + bi + '">';
      html += '<div class="ce-car-header" onclick="ceToggleBrand(' + bi + ')">';
      html += '<span class="ce-car-icon">🚗</span>';
      html += '<div class="ce-car-info">';
      html += '<div class="ce-car-title">' + ceEscape(brand.brand) + '</div>';
      html += '<div class="ce-car-sub">' + brand.models.length + ' модел' + getModelWord(brand.models.length) + ' • ' + totalCars + ' авто</div>';
      html += '</div>';
      html += '<span class="ce-car-arrow">▶</span>';
      html += '</div>';
      html += '<div class="ce-car-body">';
    }
    
    for (var mi = 0; mi < brand.models.length; mi++) {
      var model = brand.models[mi];
      var skipModelHeader = CE_PICK_GEN && brand.models.length === 1 && model.cars.length === 1;
      
      if (!skipModelHeader) {
        html += '<div class="ce-model-block" id="ceModel' + bi + '_' + mi + '">';
        html += '<div class="ce-model-header" onclick="ceToggleModel(' + bi + ',' + mi + ')">';
        html += '<span class="ce-model-arrow">▶</span>';
        html += '<span class="ce-model-title">' + ceEscape(model.model) + '</span>';
        html += '<span class="ce-model-count">' + model.cars.length + ' покол.</span>';
        html += '</div>';
        html += '<div class="ce-model-body">';
      }
      
      for (var ci = 0; ci < model.cars.length; ci++) {
        var car = model.cars[ci];
        var services = CE_SERVICES.filter(function(s){ return s.car_id === car.id; });
        var genInfo = ceCarGenInfo(car);
        var classInfo = car.class ? ' • Класс ' + car.class : '';
        
        html += '<div class="ce-gen-block">';
        html += '<div class="ce-gen-header"><span class="ce-gen-title">' + ceEscape(genInfo || 'Базовая версия') + classInfo + '</span></div>';
        
        if (!services.length) {
          html += '<div class="ce-empty" style="padding:12px;">Нет услуг</div>';
        } else {
          var groups = {};
          var groupOrder = [];
          for (var j = 0; j < services.length; j++) {
            var srv = services[j];
            var catId = 'manual';
            var catName = '✍️ Прочее';
            var subId = 'manual';
            var subName = '';
            if (srv.service_id) {
              var svc = CE_PRICE_SERVICES.find(function(s){ return String(s.id) === String(srv.service_id); });
              if (svc) {
                catId = 'cat_' + svc.category_id;
                var cat = CE_PRICE_CATS.find(function(s){ return String(s.id) === String(svc.category_id); });
                catName = cat ? cat.name : 'Без категории';
                subId = 'sub_' + (svc.subcategory_id || '0');
                if (svc.subcategory_id) {
                  var sub = CE_PRICE_SUBCATS.find(function(s){ return String(s.id) === String(svc.subcategory_id); });
                  subName = sub ? sub.name : '';
                }
              }
            }
            if (!groups[catId]) {
              groups[catId] = { name: catName, subs: {} };
              groupOrder.push(catId);
            }
            if (!groups[catId].subs[subId]) groups[catId].subs[subId] = { name: subName, items: [] };
            groups[catId].subs[subId].items.push(srv);
          }
          
          for (var gi = 0; gi < groupOrder.length; gi++) {
            var g = groups[groupOrder[gi]];
            var gKey = 'vcat' + bi + '_' + mi + '_' + ci + '_' + gi;
            html += '<div class="ce-srv-cat-block" id="ceSrvCat' + gKey + '">';
            html += '<div class="ce-srv-cat-header" onclick="ceToggleSrvCat(\'' + gKey + '\')">';
            html += '<span class="ce-srv-cat-arrow">▶</span>';
            html += '<span class="ce-srv-cat-title">' + ceEscape(g.name) + '</span>';
            html += '<span class="ce-srv-cat-count">' + Object.keys(g.subs).length + ' подк.</span>';
            html += '</div>';
            html += '<div class="ce-srv-cat-body">';
            
            for (var subId in g.subs) {
              var sub = g.subs[subId];
              html += '<div class="ce-srv-sub-block">';
              if (sub.name) html += '<div class="ce-srv-sub-title">' + ceEscape(sub.name) + '</div>';
              html += '<table class="ce-services-table"><tbody>';
              for (var k = 0; k < sub.items.length; k++) {
                var srv = sub.items[k];
                html += '<tr><td>' + ceEscape(srv.service_name) + (srv.comment ? '<div class="ce-srv-comment">' + ceEscape(srv.comment) + '</div>' : '') + '</td><td class="ce-srv-price">' + (srv.price ? Number(srv.price).toLocaleString('ru') + ' ₽' : '—') + '</td></tr>';
              }
              html += '</tbody></table>';
              html += '</div>';
            }
            html += '</div></div>';
          }
        }
        html += '</div>';
      }
      
      if (!skipModelHeader) {
        html += '</div></div>';
      }
    }
    
    if (!skipBrandHeader) {
      html += '</div></div>';
    }
  }
  list.innerHTML = html;
  
  // Если выбрано конкретное поколение — раскрываем всё автоматически
  if (CE_PICK_GEN) {
    var brandEl = document.getElementById('ceBrand0');
    if (brandEl) brandEl.classList.add('expanded');
    var modelEl = document.getElementById('ceModel0_0');
    if (modelEl) modelEl.classList.add('expanded');
  }
}

function ceToggleBrand(idx) {
  var el = document.getElementById('ceBrand' + idx);
  if (el) el.classList.toggle('expanded');
}
function ceToggleModel(bi, mi) {
  var el = document.getElementById('ceModel' + bi + '_' + mi);
  if (el) el.classList.toggle('expanded');
}
function ceToggleSrvCat(key) {
  var el = document.getElementById('ceSrvCat' + key);
  if (el) el.classList.toggle('expanded');
}

// ============ РАБОТЫ ============
function ceRenderWorks() {
  var list = document.getElementById('ceWorksList');
  if (!list) return;
  if (!CE_WORKS.length) {
    list.innerHTML = '<div class="ce-empty">Нет работ контрагентов</div>';
    return;
  }
  
  var carGroups = {};
  var carOrder = [];
  for (var i = 0; i < CE_WORKS.length; i++) {
    var w = CE_WORKS[i];
    var car = CE_CARS.find(function(c){return c.id===w.car_id;});
    var carTitle = car ? (car.brand + ' ' + car.model) : '—';
    if (!carGroups[w.car_id]) {
      carGroups[w.car_id] = { title: carTitle, works: [] };
      carOrder.push(w.car_id);
    }
    carGroups[w.car_id].works.push(w);
  }
  
  var html = '';
  for (var ci = 0; ci < carOrder.length; ci++) {
    var cg = carGroups[carOrder[ci]];
    var cKey = 'vwcar_' + ci;
    html += '<div class="ce-car-card" id="ceVwWorkCar' + cKey + '">';
    html += '<div class="ce-car-header" onclick="ceToggleVwWorkCar(\'' + cKey + '\')">';
    html += '<span class="ce-car-icon">🚗</span>';
    html += '<div class="ce-car-info">';
    html += '<div class="ce-car-title">' + ceEscape(cg.title) + '</div>';
    html += '<div class="ce-car-sub">' + cg.works.length + ' работ</div>';
    html += '</div>';
    html += '<span class="ce-car-arrow">▶</span>';
    html += '</div>';
    html += '<div class="ce-car-body">';
    
    var groups = {};
    var groupOrder = [];
    for (var wi = 0; wi < cg.works.length; wi++) {
      var work = cg.works[wi];
      var catId = 'manual';
      var catName = '✍️ Прочее';
      var subId = 'manual';
      var subName = '';
      if (work.service_id) {
        var svc = CE_PRICE_SERVICES.find(function(s){ return String(s.id) === String(work.service_id); });
        if (svc) {
          catId = 'cat_' + svc.category_id;
          var cat = CE_PRICE_CATS.find(function(s){ return String(s.id) === String(svc.category_id); });
          catName = cat ? cat.name : 'Без категории';
          subId = 'sub_' + (svc.subcategory_id || '0');
          if (svc.subcategory_id) {
            var sub = CE_PRICE_SUBCATS.find(function(s){ return String(s.id) === String(svc.subcategory_id); });
            subName = sub ? sub.name : '';
          }
        }
      }
      if (!groups[catId]) {
        groups[catId] = { name: catName, subs: {} };
        groupOrder.push(catId);
      }
      if (!groups[catId].subs[subId]) groups[catId].subs[subId] = { name: subName, items: [] };
      groups[catId].subs[subId].items.push(work);
    }
    
    for (var gi = 0; gi < groupOrder.length; gi++) {
      var g = groups[groupOrder[gi]];
      var gKey = cKey + '_cat' + gi;
      html += '<div class="ce-srv-cat-block" id="ceVwWorkSrvCat' + gKey + '">';
      html += '<div class="ce-srv-cat-header" onclick="ceToggleVwWorkSrvCat(\'' + gKey + '\')">';
      html += '<span class="ce-srv-cat-arrow">▶</span>';
      html += '<span class="ce-srv-cat-title">' + ceEscape(g.name) + '</span>';
      html += '<span class="ce-srv-cat-count">' + Object.keys(g.subs).length + ' подк.</span>';
      html += '</div>';
      html += '<div class="ce-srv-cat-body">';
      
      for (var subId in g.subs) {
        var sub = g.subs[subId];
        html += '<div class="ce-srv-sub-block">';
        if (sub.name) html += '<div class="ce-srv-sub-title">' + ceEscape(sub.name) + '</div>';
        html += '<table class="ce-services-table"><thead><tr><th>Услуга</th><th>Контрагент</th><th>Цена</th></tr></thead><tbody>';
        for (var k = 0; k < sub.items.length; k++) {
          var item = sub.items[k];
          var contractor = CE_CONTRACTORS.find(function(c){return c.id===item.contractor_id;});
          html += '<tr>';
          html += '<td>' + ceEscape(item.service_name) + (item.comment ? '<div class="ce-srv-comment">' + ceEscape(item.comment) + '</div>' : '') + '</td>';
          html += '<td class="ce-srv-contact">' + (contractor ? ceEscape(contractor.name) : '—') + '</td>';
          html += '<td class="ce-work-price">' + (item.price ? Number(item.price).toLocaleString('ru') + ' ₽' : '—') + '</td>';
          html += '</tr>';
        }
        html += '</tbody></table>';
        html += '</div>';
      }
      html += '</div></div>';
    }
    html += '</div></div>';
  }
  list.innerHTML = html;
}

function ceToggleVwWorkCar(key) {
  var el = document.getElementById('ceVwWorkCar' + key);
  if (el) el.classList.toggle('expanded');
}
function ceToggleVwWorkSrvCat(key) {
  var el = document.getElementById('ceVwWorkSrvCat' + key);
  if (el) el.classList.toggle('expanded');
}

// ============ ВКЛАДКИ ============
function ceSwitchTab(tab, btn) {
  CE_TAB = tab;
  document.getElementById('ceTabCars').style.display = (tab === 'cars') ? '' : 'none';
  document.getElementById('ceTabWorks').style.display = (tab === 'works') ? '' : 'none';
  var tabs = document.querySelectorAll('.ce-tab');
  tabs.forEach(function(t){ t.classList.remove('active'); });
  if (btn) btn.classList.add('active');
}

if (typeof SUPABASE_URL !== 'undefined') {
  ceLoadAll();
} else {
  document.addEventListener('DOMContentLoaded', function() {
    if (typeof SUPABASE_URL !== 'undefined') ceLoadAll();
  });
}
</script>
