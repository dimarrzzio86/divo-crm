<!-- Раздел: Примеры расчётов (ПРОСМОТР) -->
<!-- Авто → услуги (прайс) + работы контрагентов -->

<div class="ce-page">
  <div class="ce-header">
    <div>
      <h1 class="ce-title">🧞 Примеры расчётов</h1>
      <div class="ce-subtitle">Авто • услуги • работы контрагентов</div>
    </div>
  </div>

  <div class="ce-status" id="ceStatus"></div>

  <div class="ce-tabs">
    <button class="ce-tab active" onclick="ceSwitchTab('cars', this)">🚗 Авто и услуги</button>
    <button class="ce-tab" onclick="ceSwitchTab('works', this)">🛧 Работы контрагентов</button>
  </div>

  <!-- ВКЛАДКА: АВТО И УСЛУГИ -->
  <div id="ceTabCars">
    <!-- Выбор авто через каскадные селекты -->
    <div class="ce-selector-wrap" id="ceCarSelector">
      <div class="ce-selector-title">🔍 Выберите автомобиль для просмотра услуг:</div>
      <div class="ce-selector-row">
        <div class="ce-selector-field">
          <label class="ce-label">Марка</label>
          <select class="ce-select" id="ceSelBrand" onchange="ceOnBrandChange()">
            <option value="">— все марки —</option>
          </select>
        </div>
        <div class="ce-selector-field">
          <label class="ce-label">Модель</label>
          <select class="ce-select" id="ceSelModel" onchange="ceOnModelChange()" disabled>
            <option value="">— все модели —</option>
          </select>
        </div>
        <div class="ce-selector-field">
          <label class="ce-label">Поколение</label>
          <select class="ce-select" id="ceSelGen" onchange="ceRenderFiltered()" disabled>
            <option value="">— все поколения —</option>
          </select>
        </div>
        <button class="ce-btn ce-btn-reset" onclick="ceResetSelector()">↻ Сбросить</button>
      </div>
    </div>

    <!-- Список авто (сгруппированный) -->
    <div class="ce-list" id="ceList">
      <div class="ce-loading">Загрузка...</div>
    </div>
  </div>

  <!-- ВКЛАДКА: РАБОТЫ КОНТРАГЕНТОВ -->
  <div id="ceTabWorks" style="display:none;">
    <div class="ce-list" id="ceWorksList">
      <div class="ce-loading">Загрузка...</div>
    </div>
  </div>
</div>

<script>
var CE_CARS = [];
var CE_SERVICES = [];
var CE_WORKS = [];
var CE_CONTRACTORS = [];
var CE_PRICE_CATS = [];
var CE_PRICE_SUBCATS = [];
var CE_PRICE_SERVICES = [];
var CE_SELECTED_BRAND = '';
var CE_SELECTED_MODEL = '';
var CE_SELECTED_GEN = '';
var CE_TAB = 'cars';

function ceHeaders() {
  return { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' };
}

function ceEscape(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function ceShowStatus(msg, type) {
  var s = document.getElementById('ceStatus');
  if (!s) return;
  s.textContent = msg;
  s.className = 'ce-status show ' + type;
  if (type !== 'loading') setTimeout(function() { s.className = 'ce-status'; }, 3000);
}

// ============ ЗАГРУЗКА ============
function ceLoadAll() {
  var h = ceHeaders();
  Promise.all([
    fetch(SUPABASE_URL + '/rest/v1/calc_cars?select=*&order=brand.asc,model.asc', { headers: h }).then(function(r){return r.json();}),
    fetch(SUPABASE_URL + '/rest/v1/calc_car_services?select=*&order=created_at.asc', { headers: h }).then(function(r){return r.json();}),
    fetch(SUPABASE_URL + '/rest/v1/calc_contractor_works?select=*&order=created_at.desc', { headers: h }).then(function(r){return r.json();}),
    fetch(SUPABASE_URL + '/rest/v1/contractors?select=id,name,category&order=name.asc', { headers: h }).then(function(r){return r.json();}),
    fetch(SUPABASE_URL + '/rest/v1/service_categories?select=*&order=sort_order.asc,name.asc', { headers: h }).then(function(r){return r.json();}),
    fetch(SUPABASE_URL + '/rest/v1/service_subcategories?select=*&order=sort_order.asc,name.asc', { headers: h }).then(function(r){return r.json();}),
    fetch(SUPABASE_URL + '/rest/v1/services?select=*&order=name.asc', { headers: h }).then(function(r){return r.json();})
  ]).then(function(results) {
    CE_CARS = results[0] || [];
    CE_SERVICES = results[1] || [];
    CE_WORKS = results[2] || [];
    CE_CONTRACTORS = results[3] || [];
    CE_PRICE_CATS = results[4] || [];
    CE_PRICE_SUBCATS = results[5] || [];
    CE_PRICE_SERVICES = results[6] || [];
    ceFillBrandSelect();
    ceRenderFiltered();
    ceRenderWorks();
  }).catch(function(e) {
    console.error('CE load error:', e);
    var list = document.getElementById('ceList');
    if (list) list.innerHTML = '<div class="ce-empty">Ошибка загрузки</div>';
  });
}

// ============ КАСКАДНЫЕ СЕЛЕКТЫ ============
function ceFillBrandSelect() {
  var sel = document.getElementById('ceSelBrand');
  if (!sel) return;
  var brands = [];
  var seen = {};
  for (var i = 0; i < CE_CARS.length; i++) {
    var b = CE_CARS[i].brand;
    var key = b.toLowerCase().trim();
    if (!seen[key]) {
      seen[key] = true;
      brands.push(b);
    }
  }
  brands.sort();
  sel.innerHTML = '<option value="">— все марки —</option>';
  for (var i = 0; i < brands.length; i++) {
    sel.innerHTML += '<option value="' + ceEscape(brands[i]) + '">' + ceEscape(brands[i]) + '</option>';
  }
}

function ceOnBrandChange() {
  CE_SELECTED_BRAND = document.getElementById('ceSelBrand').value;
  CE_SELECTED_MODEL = '';
  CE_SELECTED_GEN = '';
  
  var modelSel = document.getElementById('ceSelModel');
  var genSel = document.getElementById('ceSelGen');
  
  if (CE_SELECTED_BRAND) {
    // Заполнить модели выбранной марки
    var models = [];
    var seen = {};
    for (var i = 0; i < CE_CARS.length; i++) {
      if (CE_CARS[i].brand.toLowerCase().trim() === CE_SELECTED_BRAND.toLowerCase().trim()) {
        var m = CE_CARS[i].model;
        var key = m.toLowerCase().trim();
        if (!seen[key]) { seen[key] = true; models.push(m); }
      }
    }
    models.sort();
    modelSel.innerHTML = '<option value="">— все модели —</option>';
    for (var i = 0; i < models.length; i++) {
      modelSel.innerHTML += '<option value="' + ceEscape(models[i]) + '">' + ceEscape(models[i]) + '</option>';
    }
    modelSel.disabled = false;
  } else {
    modelSel.innerHTML = '<option value="">— все модели —</option>';
    modelSel.disabled = true;
  }
  genSel.innerHTML = '<option value="">— все поколения —</option>';
  genSel.disabled = true;
  
  ceRenderFiltered();
}

function ceOnModelChange() {
  CE_SELECTED_MODEL = document.getElementById('ceSelModel').value;
  CE_SELECTED_GEN = '';
  
  var genSel = document.getElementById('ceSelGen');
  
  if (CE_SELECTED_MODEL) {
    // Заполнить поколения выбранной марки+модели
    var cars = CE_CARS.filter(function(c) {
      return c.brand.toLowerCase().trim() === CE_SELECTED_BRAND.toLowerCase().trim() &&
             c.model.toLowerCase().trim() === CE_SELECTED_MODEL.toLowerCase().trim();
    });
    genSel.innerHTML = '<option value="">— все поколения —</option>';
    for (var i = 0; i < cars.length; i++) {
      var car = cars[i];
      var genInfo = ceCarGenInfo(car) || 'Базовая';
      genSel.innerHTML += '<option value="' + car.id + '">' + ceEscape(genInfo) + '</option>';
    }
    genSel.disabled = false;
  } else {
    genSel.innerHTML = '<option value="">— все поколения —</option>';
    genSel.disabled = true;
  }
  
  ceRenderFiltered();
}

function ceResetSelector() {
  document.getElementById('ceSelBrand').value = '';
  document.getElementById('ceSelModel').value = '';
  document.getElementById('ceSelGen').value = '';
  document.getElementById('ceSelModel').disabled = true;
  document.getElementById('ceSelGen').disabled = true;
  CE_SELECTED_BRAND = '';
  CE_SELECTED_MODEL = '';
  CE_SELECTED_GEN = '';
  ceRenderFiltered();
}

// ============ ГРУППИРОВКА ============
function ceGroupCarsFiltered() {
  var filtered = CE_CARS.slice();
  
  // Фильтр по марке
  if (CE_SELECTED_BRAND) {
    filtered = filtered.filter(function(c) {
      return c.brand.toLowerCase().trim() === CE_SELECTED_BRAND.toLowerCase().trim();
    });
  }
  // Фильтр по модели
  if (CE_SELECTED_MODEL) {
    filtered = filtered.filter(function(c) {
      return c.model.toLowerCase().trim() === CE_SELECTED_MODEL.toLowerCase().trim();
    });
  }
  // Фильтр по поколению
  if (CE_SELECTED_GEN) {
    var genId = parseInt(CE_SELECTED_GEN);
    filtered = filtered.filter(function(c) { return c.id === genId; });
  }
  
  // Сортировка
  filtered.sort(function(a, b) {
    var ba = (a.brand || '').toLowerCase();
    var bb = (b.brand || '').toLowerCase();
    if (ba < bb) return -1;
    if (ba > bb) return 1;
    var ma = (a.model || '').toLowerCase();
    var mb = (b.model || '').toLowerCase();
    if (ma < mb) return -1;
    if (ma > mb) return 1;
    return (b.year_from || 0) - (a.year_from || 0);
  });
  
  var brands = [];
  var brandMap = {};
  for (var i = 0; i < filtered.length; i++) {
    var car = filtered[i];
    var bKey = (car.brand || '').toLowerCase().trim();
    if (!brandMap[bKey]) {
      brandMap[bKey] = { brand: car.brand, models: {} };
      brands.push(brandMap[bKey]);
    }
    var brand = brandMap[bKey];
    var mKey = (car.model || '').toLowerCase().trim();
    if (!brand.models[mKey]) brand.models[mKey] = { model: car.model, cars: [] };
    brand.models[mKey].cars.push(car);
  }
  for (var i = 0; i < brands.length; i++) {
    var modelArr = [];
    for (var mk in brands[i].models) modelArr.push(brands[i].models[mk]);
    brands[i].models = modelArr;
  }
  return brands;
}

function ceCarGenInfo(car) {
  var parts = [];
  if (car.generation) parts.push(car.generation);
  if (car.year_from || car.year_to) parts.push((car.year_from || '?') + '–' + (car.year_to || 'н.в.'));
  return parts.join(' • ');
}

function getModelWord(n) {
  if (n === 1) return 'ь';
  if (n >= 2 && n <= 4) return 'и';
  return 'ей';
}

// ============ РЕНДЕР: АВТО + УСЛУГИ ============
function ceRenderFiltered() {
  var list = document.getElementById('ceList');
  if (!list) return;
  
  if (!CE_CARS.length) {
    list.innerHTML = '<div class="ce-empty">Пока нет примеров расчётов</div>';
    return;
  }
  
  var brands = ceGroupCarsFiltered();
  
  if (!brands.length) {
    list.innerHTML = '<div class="ce-empty">Нет авто по выбранным критериям</div>';
    return;
  }
  
  var html = '';
  
  for (var bi = 0; bi < brands.length; bi++) {
    var brand = brands[bi];
    var brandName = brand.brand;
    
    var totalCars = 0;
    for (var mi = 0; mi < brand.models.length; mi++) {
      totalCars += brand.models[mi].cars.length;
    }
    
    html += '<div class="ce-car-card" id="ceBrand' + bi + '">';
    html += '<div class="ce-car-header" onclick="ceToggleBrand(' + bi + ')">';
    html += '<span class="ce-car-icon">🚗</span>';
    html += '<div class="ce-car-info">';
    html += '<div class="ce-car-title">' + ceEscape(brandName) + '</div>';
    html += '<div class="ce-car-sub">' + brand.models.length + ' модел' + getModelWord(brand.models.length) + ' • ' + totalCars + ' авто</div>';
    html += '</div>';
    html += '<span class="ce-car-arrow">▶</span>';
    html += '</div>';
    
    html += '<div class="ce-car-body">';
    
    for (var mi = 0; mi < brand.models.length; mi++) {
      var model = brand.models[mi];
      
      html += '<div class="ce-model-block" id="ceModel' + bi + '_' + mi + '">';
      html += '<div class="ce-model-header" onclick="ceToggleModel(' + bi + ',' + mi + ')">';
      html += '<span class="ce-model-arrow">▶</span>';
      html += '<span class="ce-model-title">' + ceEscape(model.model) + '</span>';
      html += '<span class="ce-model-count">' + model.cars.length + ' покол.</span>';
      html += '</div>';
      html += '<div class="ce-model-body">';
      
      for (var ci = 0; ci < model.cars.length; ci++) {
        var car = model.cars[ci];
        var services = CE_SERVICES.filter(function(s){ return s.car_id === car.id; });
        var genInfo = ceCarGenInfo(car);
        
        html += '<div class="ce-gen-block">';
        html += '<div class="ce-gen-header"><span class="ce-gen-title">' + ceEscape(genInfo || 'Базовая') + '</span></div>';
        if (!services.length) {
          html += '<div class="ce-empty" style="padding:12px;">Нет услуг</div>';
        } else {
          // Группировка по категории → подкатегории
          var groups = {};
          var groupOrder = [];
          for (var j = 0; j < services.length; j++) {
            var srv = services[j];
            var catId = 'manual';
            var catName = '✍️ Прочее';
            var subId = 'manual';
            var subName = '';
            if (srv.service_id) {
              var svc = CE_PRICE_SERVICES.find(function(s){ return String(s.id) === String(srv.service_id); });
              if (svc) {
                catId = 'cat_' + svc.category_id;
                var cat = CE_PRICE_CATS.find(function(s){ return String(s.id) === String(svc.category_id); });
                catName = cat ? cat.name : 'Без категории';
                subId = 'sub_' + (svc.subcategory_id || '0');
                if (svc.subcategory_id) {
                  var sub = CE_PRICE_SUBCATS.find(function(s){ return String(s.id) === String(svc.subcategory_id); });
                  subName = sub ? sub.name : '';
                }
              }
            }
            if (!groups[catId]) {
              groups[catId] = { name: catName, subs: {} };
              groupOrder.push(catId);
            }
            if (!groups[catId].subs[subId]) groups[catId].subs[subId] = { name: subName, items: [] };
            groups[catId].subs[subId].items.push(srv);
          }
          
          for (var gi = 0; gi < groupOrder.length; gi++) {
            var g = groups[groupOrder[gi]];
            var gKey = 'vcat' + bi + '_' + mi + '_' + ci + '_' + gi;
            html += '<div class="ce-srv-cat-block" id="ceSrvCat' + gKey + '">';
            html += '<div class="ce-srv-cat-header" onclick="ceToggleSrvCat(\'' + gKey + '\')">';
            html += '<span class="ce-srv-cat-arrow">▶</span>';
            html += '<span class="ce-srv-cat-title">' + ceEscape(g.name) + '</span>';
            html += '<span class="ce-srv-cat-count">' + Object.keys(g.subs).length + ' подк.</span>';
            html += '</div>';
            html += '<div class="ce-srv-cat-body">';
            
            for (var subId in g.subs) {
              var sub = g.subs[subId];
              html += '<div class="ce-srv-sub-block">';
              if (sub.name) html += '<div class="ce-srv-sub-title">' + ceEscape(sub.name) + '</div>';
              html += '<table class="ce-services-table"><tbody>';
              for (var k = 0; k < sub.items.length; k++) {
                var srv = sub.items[k];
                html += '<tr><td>' + ceEscape(srv.service_name) + (srv.comment ? '<div class="ce-srv-comment">' + ceEscape(srv.comment) + '</div>' : '') + '</td><td class="ce-srv-price">' + (srv.price ? Number(srv.price).toLocaleString('ru') + ' ₽' : '—') + '</td></tr>';
              }
              html += '</tbody></table>';
              html += '</div>';
            }
            html += '</div></div>';
          }
        }
        html += '</div>';
      }
      html += '</div></div>';
    }
    html += '</div></div>';
  }
  list.innerHTML = html;
}

// Старое имя для совместимости
function ceRender() { ceRenderFiltered(); }

function ceToggleBrand(idx) {
  var el = document.getElementById('ceBrand' + idx);
  if (el) el.classList.toggle('expanded');
}
function ceToggleModel(bi, mi) {
  var el = document.getElementById('ceModel' + bi + '_' + mi);
  if (el) el.classList.toggle('expanded');
}
function ceToggleSrvCat(key) {
  var el = document.getElementById('ceSrvCat' + key);
  if (el) el.classList.toggle('expanded');
}

// ============ РЕНДЕР: Работы контрагентов ============
function ceRenderWorks() {
  var list = document.getElementById('ceWorksList');
  if (!list) return;
  if (!CE_WORKS.length) {
    list.innerHTML = '<div class="ce-empty">Нет работ контрагентов</div>';
    return;
  }
  
  // Группировка по авто → категория → подкатегория
  var carGroups = {};
  var carOrder = [];
  for (var i = 0; i < CE_WORKS.length; i++) {
    var w = CE_WORKS[i];
    var car = CE_CARS.find(function(c){return c.id===w.car_id;});
    var carTitle = car ? (car.brand + ' ' + car.model) : '—';
    if (!carGroups[w.car_id]) {
      carGroups[w.car_id] = { title: carTitle, works: [] };
      carOrder.push(w.car_id);
    }
    carGroups[w.car_id].works.push(w);
  }
  
  var html = '';
  for (var ci = 0; ci < carOrder.length; ci++) {
    var cg = carGroups[carOrder[ci]];
    var cKey = 'vwcar_' + ci;
    html += '<div class="ce-car-card" id="ceVwWorkCar' + cKey + '">';
    html += '<div class="ce-car-header" onclick="ceToggleVwWorkCar(\'' + cKey + '\')">';
    html += '<span class="ce-car-icon">🚗</span>';
    html += '<div class="ce-car-info">';
    html += '<div class="ce-car-title">' + ceEscape(cg.title) + '</div>';
    html += '<div class="ce-car-sub">' + cg.works.length + ' работ</div>';
    html += '</div>';
    html += '<span class="ce-car-arrow">▶</span>';
    html += '</div>';
    html += '<div class="ce-car-body">';
    
    var groups = {};
    var groupOrder = [];
    for (var wi = 0; wi < cg.works.length; wi++) {
      var work = cg.works[wi];
      var catId = 'manual';
      var catName = '✍️ Прочее';
      var subId = 'manual';
      var subName = '';
      if (work.service_id) {
        var svc = CE_PRICE_SERVICES.find(function(s){ return String(s.id) === String(work.service_id); });
        if (svc) {
          catId = 'cat_' + svc.category_id;
          var cat = CE_PRICE_CATS.find(function(s){ return String(s.id) === String(svc.category_id); });
          catName = cat ? cat.name : 'Без категории';
          subId = 'sub_' + (svc.subcategory_id || '0');
          if (svc.subcategory_id) {
            var sub = CE_PRICE_SUBCATS.find(function(s){ return String(s.id) === String(svc.subcategory_id); });
            subName = sub ? sub.name : '';
          }
        }
      }
      if (!groups[catId]) {
        groups[catId] = { name: catName, subs: {} };
        groupOrder.push(catId);
      }
      if (!groups[catId].subs[subId]) groups[catId].subs[subId] = { name: subName, items: [] };
      groups[catId].subs[subId].items.push(work);
    }
    
    for (var gi = 0; gi < groupOrder.length; gi++) {
      var g = groups[groupOrder[gi]];
      var gKey = cKey + '_cat' + gi;
      html += '<div class="ce-srv-cat-block" id="ceVwWorkSrvCat' + gKey + '">';
      html += '<div class="ce-srv-cat-header" onclick="ceToggleVwWorkSrvCat(\'' + gKey + '\')">';
      html += '<span class="ce-srv-cat-arrow">▶</span>';
      html += '<span class="ce-srv-cat-title">' + ceEscape(g.name) + '</span>';
      html += '<span class="ce-srv-cat-count">' + Object.keys(g.subs).length + ' подк.</span>';
      html += '</div>';
      html += '<div class="ce-srv-cat-body">';
      
      for (var subId in g.subs) {
        var sub = g.subs[subId];
        html += '<div class="ce-srv-sub-block">';
        if (sub.name) {
          html += '<div class="ce-srv-sub-title">' + ceEscape(sub.name) + '</div>';
        }
        html += '<table class="ce-services-table"><thead><tr><th>Услуга</th><th>Контрагент</th><th>Цена</th></tr></thead><tbody>';
        for (var k = 0; k < sub.items.length; k++) {
          var item = sub.items[k];
          var contractor = CE_CONTRACTORS.find(function(c){return c.id===item.contractor_id;});
          html += '<tr>';
          html += '<td>' + ceEscape(item.service_name) + (item.comment ? '<div class="ce-srv-comment">' + ceEscape(item.comment) + '</div>' : '') + '</td>';
          html += '<td class="ce-srv-contact">' + (contractor ? ceEscape(contractor.name) : '—') + '</td>';
          html += '<td class="ce-work-price">' + (item.price ? Number(item.price).toLocaleString('ru') + ' ₽' : '—') + '</td>';
          html += '</tr>';
        }
        html += '</tbody></table>';
        html += '</div>';
      }
      html += '</div></div>';
    }
    
    html += '</div></div>';
  }
  list.innerHTML = html;
}

function ceToggleVwWorkCar(key) {
  var el = document.getElementById('ceVwWorkCar' + key);
  if (el) el.classList.toggle('expanded');
}
function ceToggleVwWorkSrvCat(key) {
  var el = document.getElementById('ceVwWorkSrvCat' + key);
  if (el) el.classList.toggle('expanded');
}

// ============ ВКЛАДКИ ============
function ceSwitchTab(tab, btn) {
  CE_TAB = tab;
  document.getElementById('ceTabCars').style.display = (tab === 'cars') ? '' : 'none';
  document.getElementById('ceTabWorks').style.display = (tab === 'works') ? '' : 'none';
  var tabs = document.querySelectorAll('.ce-tab');
  tabs.forEach(function(t){ t.classList.remove('active'); });
  if (btn) btn.classList.add('active');
}

// Инициализация
if (typeof SUPABASE_URL !== 'undefined') {
  ceLoadAll();
} else {
  document.addEventListener('DOMContentLoaded', function() {
    if (typeof SUPABASE_URL !== 'undefined') ceLoadAll();
  });
}
</script>
