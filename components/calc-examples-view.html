<!-- Раздел: Примеры расчётов (ПРОСМОТР) -->
<!-- Авто → услуги (прайс) + работы контрагентов -->

<div class="ce-page">
  <div class="ce-header">
    <div>
      <h1 class="ce-title">🧮 Примеры расчётов</h1>
      <div class="ce-subtitle">Авто • услуги • работы контрагентов</div>
    </div>
  </div>

  <div class="ce-status" id="ceStatus"></div>

  <div class="ce-search-wrap">
    <span class="ce-search-icon">🔍</span>
    <input type="text" id="ceSearch" class="ce-search-input" placeholder="Поиск по марке, модели..." oninput="ceRender()">
  </div>

  <div class="ce-tabs">
    <button class="ce-tab active" onclick="ceSwitchTab('cars', this)">🚗 Авто и услуги</button>
    <button class="ce-tab" onclick="ceSwitchTab('works', this)">🔧 Работы контрагентов</button>
  </div>

  <div id="ceTabCars">
    <div class="ce-list" id="ceList">
      <div class="ce-loading">Загрузка...</div>
    </div>
  </div>

  <div id="ceTabWorks" style="display:none;">
    <div class="ce-list" id="ceWorksList">
      <div class="ce-loading">Загрузка...</div>
    </div>
  </div>
</div>

<script>
var CE_CARS = [];
var CE_SERVICES = [];
var CE_WORKS = [];
var CE_CONTRACTORS = [];

function ceHeaders() {
  return { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY };
}

function ceEscape(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function ceLoadAll() {
  var h = ceHeaders();
  Promise.all([
    fetch(SUPABASE_URL + '/rest/v1/calc_cars?select=*&order=brand.asc,model.asc', { headers: h }).then(function(r){return r.json();}),
    fetch(SUPABASE_URL + '/rest/v1/calc_car_services?select=*&order=created_at.asc', { headers: h }).then(function(r){return r.json();}),
    fetch(SUPABASE_URL + '/rest/v1/calc_contractor_works?select=*&order=created_at.desc', { headers: h }).then(function(r){return r.json();}),
    fetch(SUPABASE_URL + '/rest/v1/contractors?select=id,name,category&order=name.asc', { headers: h }).then(function(r){return r.json();})
  ]).then(function(results) {
    CE_CARS = results[0] || [];
    CE_SERVICES = results[1] || [];
    CE_WORKS = results[2] || [];
    CE_CONTRACTORS = results[3] || [];
    ceRender();
    ceRenderWorks();
  }).catch(function(e) {
    console.error('CE load error:', e);
    var list = document.getElementById('ceList');
    if (list) list.innerHTML = '<div class="ce-empty">Ошибка загрузки</div>';
  });
}

// Группировка по марке (как на auto.ru): Марка → Модель → Поколение
function ceGroupCars() {
  var sorted = CE_CARS.slice().sort(function(a, b) {
    var ba = (a.brand || '').toLowerCase();
    var bb = (b.brand || '').toLowerCase();
    if (ba < bb) return -1;
    if (ba > bb) return 1;
    var ma = (a.model || '').toLowerCase();
    var mb = (b.model || '').toLowerCase();
    if (ma < mb) return -1;
    if (ma > mb) return 1;
    return (b.year_from || 0) - (a.year_from || 0);
  });
  var brands = [];
  var brandMap = {};
  for (var i = 0; i < sorted.length; i++) {
    var car = sorted[i];
    var bKey = (car.brand || '').toLowerCase().trim();
    if (!brandMap[bKey]) {
      brandMap[bKey] = { brand: car.brand, models: {} };
      brands.push(brandMap[bKey]);
    }
    var brand = brandMap[bKey];
    var mKey = (car.model || '').toLowerCase().trim();
    if (!brand.models[mKey]) brand.models[mKey] = { model: car.model, cars: [] };
    brand.models[mKey].cars.push(car);
  }
  for (var i = 0; i < brands.length; i++) {
    var modelArr = [];
    for (var mk in brands[i].models) modelArr.push(brands[i].models[mk]);
    brands[i].models = modelArr;
  }
  return brands;
}

function ceCarGenInfo(car) {
  var parts = [];
  if (car.generation) parts.push(car.generation);
  if (car.year_from || car.year_to) parts.push((car.year_from || '?') + '–' + (car.year_to || 'н.в.'));
  return parts.join(' • ');
}

function ceRender() {
  var list = document.getElementById('ceList');
  if (!list) return;
  var search = (document.getElementById('ceSearch') ? document.getElementById('ceSearch').value : '').toLowerCase();
  
  if (!CE_CARS.length) {
    list.innerHTML = '<div class="ce-empty">Пока нет примеров расчётов</div>';
    return;
  }
  
  var brands = ceGroupCars();
  var html = '';
  
  for (var bi = 0; bi < brands.length; bi++) {
    var brand = brands[bi];
    var brandName = brand.brand;
    
    var hasMatch = false;
    if (!search) hasMatch = true;
    else if (brandName.toLowerCase().indexOf(search) !== -1) hasMatch = true;
    else {
      for (var mi = 0; mi < brand.models.length; mi++) {
        var m = brand.models[mi];
        if (m.model.toLowerCase().indexOf(search) !== -1) { hasMatch = true; break; }
      }
    }
    if (!hasMatch) continue;
    
    html += '<div class="ce-car-card" id="ceBrand' + bi + '">';
    html += '<div class="ce-car-header" onclick="ceToggleBrand(' + bi + ')">';
    html += '<span class="ce-car-icon">🚗</span>';
    html += '<div class="ce-car-info">';
    html += '<div class="ce-car-title">' + ceEscape(brandName) + '</div>';
    html += '<div class="ce-car-sub">' + brand.models.length + ' моделей</div>';
    html += '</div>';
    html += '<span class="ce-car-arrow">▶</span>';
    html += '</div>';
    
    html += '<div class="ce-car-body">';
    
    for (var mi = 0; mi < brand.models.length; mi++) {
      var model = brand.models[mi];
      html += '<div class="ce-model-block" id="ceModel' + bi + '_' + mi + '">';
      html += '<div class="ce-model-header" onclick="ceToggleModel(' + bi + ',' + mi + ')">';
      html += '<span class="ce-model-arrow">▶</span>';
      html += '<span class="ce-model-title">' + ceEscape(model.model) + '</span>';
      html += '<span class="ce-model-count">' + model.cars.length + ' покол.</span>';
      html += '</div>';
      html += '<div class="ce-model-body">';
      
      for (var ci = 0; ci < model.cars.length; ci++) {
        var car = model.cars[ci];
        var services = CE_SERVICES.filter(function(s){ return s.car_id === car.id; });
                var genInfo = ceCarGenInfo(car);
        
        html += '<div class="ce-gen-block">';
        html += '<div class="ce-gen-header"><span class="ce-gen-title">' + ceEscape(genInfo || 'Базовая') + '</span></div>';
        if (!services.length) {
          html += '<div class="ce-empty" style="padding:12px;">Нет услуг</div>';
        } else {
          html += '<table class="ce-services-table"><thead><tr><th>Услуга</th><th>Цена</th></tr></thead><tbody>';
          for (var j = 0; j < services.length; j++) {
            var srv = services[j];
            html += '<tr><td>' + ceEscape(srv.service_name) + '</td><td class="ce-srv-price">' + (srv.price ? Number(srv.price).toLocaleString('ru') + ' ₽' : '—') + '</td></tr>';
          }
          
          html += '</tbody></table>';
        }
        html += '</div>';
      }
      html += '</div></div>';
    }
    html += '</div></div>';
  }
  list.innerHTML = html;
}

function ceToggleBrand(idx) {
  var el = document.getElementById('ceBrand' + idx);
  if (el) el.classList.toggle('expanded');
}
function ceToggleModel(bi, mi) {
  var el = document.getElementById('ceModel' + bi + '_' + mi);
  if (el) el.classList.toggle('expanded');
}

// ============ РЕНДЕР: Работы контрагентов ============
function ceRenderWorks() {
  var list = document.getElementById('ceWorksList');
  if (!list) return;
  if (!CE_WORKS.length) {
    list.innerHTML = '<div class="ce-empty">Нет работ контрагентов</div>';
    return;
  }
  var html = '<table class="ce-works-table"><thead><tr>';
  html += '<th>Авто</th><th>Контрагент</th><th>Услуга</th><th>Цена</th><th>Комментарий</th>';
  html += '</tr></thead><tbody>';
  for (var i = 0; i < CE_WORKS.length; i++) {
    var w = CE_WORKS[i];
    var car = CE_CARS.find(function(c){return c.id===w.car_id;});
    var contractor = CE_CONTRACTORS.find(function(c){return c.id===w.contractor_id;});
    var carTitle = car ? (car.brand + ' ' + car.model) : '—';
    html += '<tr>';
    html += '<td>' + ceEscape(carTitle) + '</td>';
    html += '<td>' + (contractor ? ceEscape(contractor.name) : '—') + '</td>';
    html += '<td>' + ceEscape(w.service_name) + '</td>';
    html += '<td class="ce-work-price">' + (w.price ? Number(w.price).toLocaleString('ru') + ' ₽' : '—') + '</td>';
    html += '<td>' + ceEscape(w.comment) + '</td>';
    html += '</tr>';
  }
  html += '</tbody></table>';
  list.innerHTML = html;
}

function ceSwitchTab(tab, btn) {
  document.querySelectorAll('.ce-tab').forEach(function(t){t.classList.remove('active');});
  if (btn) btn.classList.add('active');
  document.getElementById('ceTabCars').style.display = tab === 'cars' ? '' : 'none';
  document.getElementById('ceTabWorks').style.display = tab === 'works' ? '' : 'none';
}


ceLoadAll();
</script>
