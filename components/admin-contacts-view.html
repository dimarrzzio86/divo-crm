<!-- Раздел: Контакты (админка) -->
<!-- Уровень: 4 (админ+) -->
<!-- Полный CRUD через модальное окно (как admin-users) -->

<div class="ac-page">
  <div class="ac-header">
    <div>
      <h1 class="ac-title">📇 Контакты</h1>
      <div class="ac-subtitle">Управление контрагентами • категории • телефоны</div>
    </div>
    <button class="ac-add-btn" id="acAddBtn">➕ Добавить</button>
  </div>

  <div class="ac-status" id="acStatus"></div>

  <div class="ac-search-wrap">
    <span class="ac-search-icon">🔍</span>
    <input type="text" id="acSearch" class="ac-search-input" placeholder="Поиск по имени, телефону, категории, комментарию...">
  </div>

  <div class="ac-toggle-bar">
    <button class="ac-toggle-btn" id="acExpandAll">▸ Развернуть все</button>
    <button class="ac-toggle-btn" id="acCollapseAll">▾ Свернуть все</button>
  </div>

  <div class="ac-list" id="acList">
    <div class="ac-loading">Загрузка контактов...</div>
  </div>
</div>

<!-- Модальное окно -->
<div class="ac-modal-overlay" id="acModalOverlay" style="display:none;">
  <div class="ac-modal">
    <h2 class="ac-modal-title" id="acModalTitle">Новый контакт</h2>
    <label class="ac-label">Имя / название</label>
    <input type="text" class="ac-input" id="acName" placeholder="Например: Иван П.">
    <label class="ac-label">Категория</label>
    <input type="text" class="ac-input" id="acCategory" list="acCategoryList" placeholder="Выберите или введите новую">
    <datalist id="acCategoryList"></datalist>
    <label class="ac-label">Телефон</label>
    <input type="text" class="ac-input" id="acPhone" placeholder="+7 (999) 123-45-67">
    <label class="ac-label">Заметка</label>
    <input type="text" class="ac-input" id="acComment" placeholder="Комментарий...">
    <div class="ac-modal-btns">
      <button class="ac-btn-cancel" id="acCancelBtn">Отмена</button>
      <button class="ac-btn-save" id="acSaveBtn">Сохранить</button>
    </div>
  </div>
</div>

<style>
.ac-page { font-family: inherit; }
.ac-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 16px; }
.ac-title { font-size: 28px; font-weight: 800; color: #fafafa; margin: 0; }
.ac-subtitle { font-size: 14px; color: #71717a; margin-top: 4px; }
.ac-add-btn {
  padding: 10px 20px; background: #1e3a8a; border: 1.5px solid #3b82f6; color: #93c5fd;
  border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; transition: all .15s;
}
.ac-add-btn:hover { background: #3b82f6; color: #0a0a0a; }

.ac-status { display: none; padding: 12px 16px; border-radius: 10px; margin-bottom: 12px; font-size: 14px; }
.ac-status.show { display: block; }
.ac-status.success { background: #14532d; color: #4ade80; }
.ac-status.error { background: #7f1d1d; color: #fca5a5; }
.ac-status.loading { background: #1e293b; color: #93c5fd; }

.ac-search-wrap { position: relative; margin-bottom: 16px; }
.ac-search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #71717a; font-size: 16px; }
.ac-search-input {
  width: 100%; box-sizing: border-box; padding: 12px 14px 12px 42px;
  background: #0a0a0a; border: 1.5px solid #27272a; border-radius: 12px;
  color: #fafafa; font-size: 15px; font-family: inherit; outline: none;
}
.ac-search-input:focus { border-color: #3b82f6; }

.ac-toggle-bar { display: flex; gap: 8px; margin-bottom: 16px; }
.ac-toggle-btn {
  padding: 8px 14px; background: #18181b; border: 1.5px solid #27272a; color: #a1a1aa;
  border-radius: 8px; font-size: 13px; cursor: pointer; font-family: inherit; transition: all .15s;
}
.ac-toggle-btn:hover { border-color: #3b82f6; color: #93c5fd; }

.ac-list { display: flex; flex-direction: column; gap: 12px; }
.ac-loading, .ac-empty { text-align: center; padding: 40px; color: #71717a; font-size: 15px; }

/* Категории */
.ac-category { background: #18181b; border: 1.5px solid #27272a; border-radius: 14px; overflow: hidden; }
.ac-category.expanded .ac-category-body { display: block; }
.ac-category-body { display: none; padding: 12px; }
.ac-category-header {
  display: flex; align-items: center; gap: 10px; padding: 14px 18px; cursor: pointer;
  user-select: none; transition: background .15s;
}
.ac-category-header:hover { background: #1f1f23; }
.ac-cat-arrow { font-size: 12px; color: #71717a; transition: transform .15s; }
.ac-category.expanded .ac-cat-arrow { transform: rotate(90deg); }
.ac-cat-icon { font-size: 16px; }
.ac-cat-name { flex: 1; font-size: 16px; font-weight: 700; color: #fafafa; }
.ac-cat-count {
  padding: 3px 10px; background: #27272a; border-radius: 20px; font-size: 12px; color: #a1a1aa;
}

/* Карточки */
.ac-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.ac-card {
  background: #0f0f12; border: 1.5px solid #27272a; border-radius: 12px; padding: 16px;
  transition: all .15s;
}
.ac-card:hover { border-color: #3b82f6; background: #131316; }
.ac-card-top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.ac-avatar {
  width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 800; color: #fff; background: #3b82f6; flex-shrink: 0;
}
.ac-card-info { flex: 1; min-width: 0; }
.ac-card-name { font-size: 15px; font-weight: 700; color: #fafafa; }
.ac-card-cat { font-size: 12px; color: #71717a; margin-top: 2px; }
.ac-card-field { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; }
.ac-field-icon { font-size: 14px; }
.ac-field-label { color: #71717a; min-width: 60px; }
.ac-field-value { color: #e4e4e7; }
.ac-field-value.is-phone { color: #93c5fd; text-decoration: none; }
.ac-field-empty { color: #52525b; font-style: italic; }
.ac-card-actions { display: flex; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #27272a; }
.ac-action-btn {
  flex: 1; padding: 7px 10px; background: #18181b; border: 1.5px solid #27272a; color: #a1a1aa;
  border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all .15s;
}
.ac-action-btn.edit:hover { border-color: #3b82f6; color: #93c5fd; background: #1e293b; }
.ac-action-btn.delete:hover { border-color: #ef4444; color: #fca5a5; background: #7f1d1d; }

/* Модалка */
.ac-modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center;
  z-index: 200; padding: 16px;
}
.ac-modal {
  background: #18181b; border: 1.5px solid #27272a; border-radius: 16px; padding: 28px;
  max-width: 460px; width: 100%;
}
.ac-modal-title { font-size: 22px; font-weight: 800; color: #fafafa; margin: 0 0 20px; }
.ac-label { display: block; font-size: 12px; color: #71717a; text-transform: uppercase; letter-spacing: 1px; margin: 12px 0 6px; font-weight: 600; }
.ac-input {
  width: 100%; box-sizing: border-box; padding: 10px 14px; background: #0a0a0a; border: 1.5px solid #27272a;
  border-radius: 10px; color: #fafafa; font-size: 15px; font-family: inherit; outline: none;
}
.ac-input:focus { border-color: #3b82f6; }
.ac-modal-btns { display: flex; gap: 10px; margin-top: 24px; }
.ac-btn-cancel {
  flex: 1; padding: 12px; background: #27272a; color: #a1a1aa; border: 1.5px solid #3f3f46;
  border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit;
}
.ac-btn-save {
  flex: 1; padding: 12px; background: #1e3a8a; color: #93c5fd; border: 1.5px solid #3b82f6;
  border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit;
}
.ac-btn-save:hover { background: #3b82f6; color: #0a0a0a; }
</style>

<script>
(function() {
  var contractors = [];
  var filtered = [];
  var editingId = null;
  var SUPABASE_URL = (typeof window.SUPABASE_URL !== 'undefined') ? window.SUPABASE_URL : 'https://jnbqzngsglnjzzpsvvgn.supabase.co';
  var SUPABASE_KEY = (typeof window.SUPABASE_KEY !== 'undefined') ? window.SUPABASE_KEY : 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpuYnF6bmdzZ2xuanp6cHN2dmduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMzIwOTEsImV4cCI6MjEwNDgwODA5MX0.uHVMUKBtO0326KB3bAHQ8rywBvBms7WvfaxPrhm3_Y0';

  function $(id) { return document.getElementById(id); }

  function showStatus(msg, type) {
    var s = $('acStatus');
    if (!s) return;
    s.textContent = msg;
    s.className = 'ac-status show ' + type;
    if (type === 'success' || type === 'error') {
      setTimeout(function() { s.className = 'ac-status'; }, 3000);
    }
  }
  function hideStatus() {
    var s = $('acStatus');
    if (s) s.className = 'ac-status';
  }

  function escapeHtml(text) {
    var d = document.createElement('div');
    d.textContent = text == null ? '' : String(text);
    return d.innerHTML;
  }

  function getInitial(name) {
    if (!name) return '?';
    return name.trim().charAt(0).toUpperCase();
  }

  function formatPhoneLink(phone) {
    if (!phone) return '';
    var digits = phone.replace(/\D/g, '');
    if (digits.length === 11 && digits.charAt(0) === '8') digits = '7' + digits.substring(1);
    if (digits.length === 11 && digits.charAt(0) === '7') return 'tel:+' + digits;
    return 'tel:' + phone.replace(/\s/g, '');
  }

  function loadData() {
    showStatus('Загрузка контактов...', 'loading');
    var url = SUPABASE_URL + '/rest/v1/contractors?select=*&order=category.asc,name.asc';
    fetch(url, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY } })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        contractors = data || [];
        filtered = contractors.slice();
        hideStatus();
        updateCategoryDatalist();
        render();
      })
      .catch(function(e) {
        showStatus('Ошибка загрузки: ' + e.message, 'error');
      });
  }

  function updateCategoryDatalist() {
    var cats = {};
    for (var i = 0; i < contractors.length; i++) {
      var c = contractors[i].category;
      if (c && !cats[c]) cats[c] = true;
    }
    var dl = $('acCategoryList');
    if (dl) {
      dl.innerHTML = '';
      for (var cat in cats) {
        var o = document.createElement('option');
        o.value = cat;
        dl.appendChild(o);
      }
    }
  }

  function filterData(query) {
    query = (query || '').toLowerCase().trim();
    if (!query) {
      filtered = contractors.slice();
    } else {
      filtered = contractors.filter(function(c) {
        return (c.name || '').toLowerCase().indexOf(query) !== -1 ||
               (c.phone || '').toLowerCase().indexOf(query) !== -1 ||
               (c.comment || '').toLowerCase().indexOf(query) !== -1 ||
               (c.category || '').toLowerCase().indexOf(query) !== -1;
      });
    }
    render();
  }

  function render() {
    var container = $('acList');
    if (!container) return;

    if (!filtered.length) {
      container.innerHTML = '<div class="ac-empty">' + (contractors.length ? 'Ничего не найдено' : 'Контактов пока нет. Нажмите «➕ Добавить»') + '</div>';
      return;
    }

    // Группируем по категориям
    var groups = {};
    var groupOrder = [];
    for (var i = 0; i < filtered.length; i++) {
      var cat = filtered[i].category || 'Без категории';
      if (!groups[cat]) { groups[cat] = []; groupOrder.push(cat); }
      groups[cat].push(filtered[i]);
    }
    groupOrder.sort();

    var html = '';
    for (var g = 0; g < groupOrder.length; g++) {
      var categoryName = groupOrder[g];
      var items = groups[categoryName];
      var expanded = (g === 0) ? ' expanded' : '';

      html += '<div class="ac-category' + expanded + '">';
      html += '<div class="ac-category-header" onclick="window.acToggleCategory(this)">';
      html += '  <span class="ac-cat-arrow">▶</span>';
      html += '  <span class="ac-cat-icon">📁</span>';
      html += '  <span class="ac-cat-name">' + escapeHtml(categoryName) + '</span>';
      html += '  <span class="ac-cat-count">' + items.length + '</span>';
      html += '</div>';
      html += '<div class="ac-category-body">';
      html += '  <div class="ac-grid">';

      for (var j = 0; j < items.length; j++) {
        var c = items[j];
        var phoneHtml = c.phone
          ? '<a href="' + formatPhoneLink(c.phone) + '" class="ac-field-value is-phone">' + escapeHtml(c.phone) + '</a>'
          : '<span class="ac-field-empty">не указан</span>';
        var commentHtml = c.comment
          ? '<span class="ac-field-value">' + escapeHtml(c.comment) + '</span>'
          : '<span class="ac-field-empty">—</span>';

        html += '<div class="ac-card">';
        html += '  <div class="ac-card-top">';
        html += '    <div class="ac-avatar">' + escapeHtml(getInitial(c.name)) + '</div>';
        html += '    <div class="ac-card-info">';
        html += '      <div class="ac-card-name">' + escapeHtml(c.name || 'Без имени') + '</div>';
        html += '      <div class="ac-card-cat">' + escapeHtml(c.category || 'Без категории') + '</div>';
        html += '    </div>';
        html += '  </div>';
        html += '  <div class="ac-card-field">';
        html += '    <span class="ac-field-icon">📞</span>';
        html += '    <span class="ac-field-label">Телефон</span>';
        html += phoneHtml;
        html += '  </div>';
        html += '  <div class="ac-card-field">';
        html += '    <span class="ac-field-icon">💬</span>';
        html += '    <span class="ac-field-label">Заметка</span>';
        html += commentHtml;
        html += '  </div>';
        html += '  <div class="ac-card-actions">';
        html += '    <button class="ac-action-btn edit" onclick="window.acEdit(' + c.id + ')">✏️ Изменить</button>';
        html += '    <button class="ac-action-btn delete" onclick="window.acDelete(' + c.id + ')">🗑 Удалить</button>';
        html += '  </div>';
        html += '</div>';
      }

      html += '  </div>';
      html += '</div>';
      html += '</div>';
    }

    container.innerHTML = html;
  }

  // === Модалка ===
  function openModal(isEdit, c) {
    editingId = isEdit ? c.id : null;
    $('acModalTitle').textContent = isEdit ? 'Изменить контакт' : 'Новый контакт';
    $('acName').value = isEdit ? (c.name || '') : '';
    $('acCategory').value = isEdit ? (c.category || '') : '';
    $('acPhone').value = isEdit ? (c.phone || '') : '';
    $('acComment').value = isEdit ? (c.comment || '') : '';
    $('acModalOverlay').style.display = 'flex';
    $('acName').focus();
  }

  function closeModal() {
    $('acModalOverlay').style.display = 'none';
    editingId = null;
  }

  function save() {
    var name = ($('acName').value || '').trim();
    var category = ($('acCategory').value || '').trim();
    var phone = ($('acPhone').value || '').trim();
    var comment = ($('acComment').value || '').trim();

    if (!name) {
      showStatus('Введите имя контакта', 'error');
      $('acName').focus();
      return;
    }

    var payload = { name: name, category: category, phone: phone, comment: comment };

    if (editingId) {
      // UPDATE
      showStatus('Сохранение...', 'loading');
      fetch(SUPABASE_URL + '/rest/v1/contractors?id=eq.' + editingId, {
        method: 'PATCH',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify(payload)
      })
        .then(function(r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          closeModal();
          showStatus('✅ Контакт обновлён', 'success');
          loadData();
        })
        .catch(function(e) {
          showStatus('Ошибка: ' + e.message, 'error');
        });
    } else {
      // INSERT
      showStatus('Добавление...', 'loading');
      fetch(SUPABASE_URL + '/rest/v1/contractors', {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify(payload)
      })
        .then(function(r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          closeModal();
          showStatus('✅ Контакт добавлен', 'success');
          loadData();
        })
        .catch(function(e) {
          showStatus('Ошибка: ' + e.message, 'error');
        });
    }
  }

  function del(id) {
    var c = contractors.find(function(x) { return x.id === id; });
    if (!c) return;
    if (!confirm('Удалить контакт "' + (c.name || '') + '"?')) return;

    showStatus('Удаление...', 'loading');
    fetch(SUPABASE_URL + '/rest/v1/contractors?id=eq.' + id, {
      method: 'DELETE',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Prefer': 'return=minimal'
      }
    })
      .then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        showStatus('✅ Контакт удалён', 'success');
        loadData();
      })
      .catch(function(e) {
        showStatus('Ошибка: ' + e.message, 'error');
      });
  }

  // Глобальные функции
  window.acToggleCategory = function(header) {
    var cat = header.parentElement;
    if (cat) cat.classList.toggle('expanded');
  };
  window.acEdit = function(id) {
    var c = contractors.find(function(x) { return x.id === id; });
    if (c) openModal(true, c);
  };
  window.acDelete = del;

  // === Инициализация ===
  function init() {
    $('acAddBtn').addEventListener('click', function() { openModal(false, null); });
    $('acCancelBtn').addEventListener('click', closeModal);
    $('acSaveBtn').addEventListener('click', save);
    $('acExpandAll').addEventListener('click', function() {
      var cats = document.querySelectorAll('.ac-category');
      for (var i = 0; i < cats.length; i++) cats[i].classList.add('expanded');
    });
    $('acCollapseAll').addEventListener('click', function() {
      var cats = document.querySelectorAll('.ac-category');
      for (var i = 0; i < cats.length; i++) cats[i].classList.remove('expanded');
    });

    // Поиск
    var searchTimeout;
    $('acSearch').addEventListener('input', function() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(function() { filterData($('acSearch').value); }, 300);
    });

    // Enter в модалке → сохранить
    var inputs = ['acName', 'acCategory', 'acPhone', 'acComment'];
    for (var i = 0; i < inputs.length; i++) {
      $(inputs[i]).addEventListener('keypress', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); save(); }
      });
    }

    // Esc → закрыть модалку
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && $('acModalOverlay').style.display === 'flex') closeModal();
    });

    // Клик по overlay → закрыть
    $('acModalOverlay').addEventListener('click', function(e) {
      if (e.target === $('acModalOverlay')) closeModal();
    });

    loadData();
  }

  init();
})();
</script>
