<!-- Раздел: Задачи на сегодня (просмотр) -->
<!-- Уровень: 2 (мастер+) -->

<div class="tv-page">
  <div class="tv-header">
    <div>
      <h1 class="tv-title">📝 Задачи на сегодня</h1>
      <div class="tv-subtitle" id="tvSubtitle">Планируйте задачи по дням</div>
    </div>
    <div class="tv-stats">
      <div class="tv-stat">
        <div class="tv-stat-label">Всего</div>
        <div class="tv-stat-value blue" id="tvTotal">0</div>
      </div>
      <div class="tv-stat">
        <div class="tv-stat-label">Выполнено</div>
        <div class="tv-stat-value green" id="tvDone">0</div>
      </div>
      <div class="tv-stat">
        <div class="tv-stat-label">Осталось</div>
        <div class="tv-stat-value orange" id="tvLeft">0</div>
      </div>
    </div>
  </div>

  <!-- Выбор даты -->
  <div class="tv-date-bar">
    <button class="tv-date-nav" id="tvPrevDay" title="Предыдущий день">←</button>
    <input type="date" id="tvDate" class="tv-date-input">
    <button class="tv-date-nav" id="tvNextDay" title="Следующий день">→</button>
    <button class="tv-today-btn" id="tvTodayBtn">Сегодня</button>
  </div>

  <div class="tv-status" id="tvStatus"></div>

  <!-- Список задач -->
  <div class="tv-list" id="tvList">
    <div class="tv-loading">Загрузка задач...</div>
  </div>
</div>

<style>
.tv-page { font-family: inherit; }
.tv-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 16px; }
.tv-title { font-size: 28px; font-weight: 800; color: #fafafa; margin: 0; }
.tv-subtitle { font-size: 14px; color: #71717a; margin-top: 4px; }
.tv-stats { display: flex; gap: 10px; }
.tv-stat { background: #18181b; border: 1.5px solid #27272a; border-radius: 12px; padding: 10px 16px; text-align: center; min-width: 80px; }
.tv-stat-label { font-size: 10px; color: #71717a; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; font-weight: 600; }
.tv-stat-value { font-size: 22px; font-weight: 800; }
.tv-stat-value.blue { color: #818cf8; }
.tv-stat-value.green { color: #4ade80; }
.tv-stat-value.orange { color: #fb923c; }

.tv-date-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
.tv-date-nav {
  width: 38px; height: 38px; border-radius: 10px; background: #18181b; border: 1.5px solid #27272a;
  color: #fafafa; cursor: pointer; font-size: 16px; font-family: inherit; transition: all 0.15s; flex-shrink: 0;
}
.tv-date-nav:hover { background: #27272a; border-color: #3f3f46; }
.tv-date-input {
  flex: 1; max-width: 250px; padding: 10px 14px; background: #18181b; border: 1.5px solid #27272a;
  border-radius: 10px; color: #fafafa; font-size: 15px; font-family: inherit; outline: none;
}
.tv-date-input:focus { border-color: #3b82f6; }
.tv-today-btn {
  padding: 10px 16px; background: #1e3a8a; border: 1.5px solid #3b82f6; color: #93c5fd;
  border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all 0.15s;
}
.tv-today-btn:hover { background: #3b82f6; color: #0a0a0a; }

.tv-status { display: none; padding: 12px 16px; border-radius: 10px; margin-bottom: 12px; font-size: 14px; }
.tv-status.show { display: block; }
.tv-status.loading { background: #1e293b; color: #93c5fd; }
.tv-status.error { background: #7f1d1d; color: #fca5a5; }

.tv-list { display: flex; flex-direction: column; gap: 6px; }
.tv-loading { text-align: center; padding: 30px; color: #71717a; }
.tv-empty { text-align: center; padding: 40px 20px; color: #52525b; }
.tv-empty-icon { font-size: 40px; margin-bottom: 8px; opacity: 0.5; }

.tv-item {
  display: flex; align-items: center; gap: 12px; background: #18181b; border: 1.5px solid #27272a;
  border-radius: 12px; padding: 16px 18px; transition: all 0.15s; cursor: pointer;
}
.tv-item:hover { border-color: #3b82f6; background: #1f1f23; }
.tv-item:active { transform: scale(0.98); }
.tv-item.done { opacity: 0.45; background: #0a0a0a; border-color: #1c1c1f; }
.tv-item.done .tv-item-text { text-decoration: line-through; color: #52525b; }
.tv-item.done .tv-item-time { background: #18181b; color: #52525b; }

/* Подсветка важности */
.tv-item.importance-1 { border-left: 4px solid #f59e0b; background: #1a1505; }
.tv-item.importance-1:hover { background: #241c08; border-color: #f59e0b; }
.tv-item.importance-2 { border-left: 4px solid #ef4444; background: #1a0a0a; }
.tv-item.importance-2:hover { background: #2a0e0e; border-color: #ef4444; }

.tv-item-importance {
  display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700;
  padding: 4px 10px; border-radius: 6px; margin-top: 6px; margin-left: 6px; width: fit-content;
}
.tv-item-importance.importance-1 { background: #78350f; color: #fbbf24; border: 1px solid #f59e0b; }
.tv-item-importance.importance-2 { background: #7f1d1d; color: #fca5a5; border: 1px solid #ef4444; }

.tv-item-body { flex: 1; min-width: 0; }
.tv-item-text { font-size: 18px; color: #fafafa; font-weight: 600; word-wrap: break-word; line-height: 1.4; }
.tv-item.done .tv-item-text { font-weight: 500; }
.tv-item-time {
  display: inline-flex; align-items: center; gap: 4px; font-size: 14px; color: #60a5fa;
  background: #1e3a8a; padding: 5px 12px; border-radius: 8px; margin-top: 8px; width: fit-content; font-weight: 700;
}
.tv-item-time.hidden { display: none; }

@media (max-width: 600px) {
  .tv-stats { width: 100%; }
  .tv-stat { flex: 1; }
  .tv-date-input { max-width: none; }
}
</style>

<script>
(function() {
  var tasks = [];

  function toLocalDateStr(d) {
    var year = d.getFullYear();
    var month = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return year + '-' + month + '-' + day;
  }
  var currentDate = toLocalDateStr(new Date());

  function $(id) { return document.getElementById(id); }
  function showStatus(msg, type) { var s = $('tvStatus'); s.textContent = msg; s.className = 'tv-status show ' + type; }
  function hideStatus() { $('tvStatus').className = 'tv-status'; }
  function escapeHtml(t) { var d = document.createElement('div'); d.textContent = t == null ? '' : String(t); return d.innerHTML; }
  function getHeaders() { return { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }; }

  function formatDateRu(dateStr) {
    var d = new Date(dateStr + 'T00:00:00');
    var months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
    return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
  }

  function isToday(dateStr) {
    return dateStr === toLocalDateStr(new Date());
  }

  function updateSubtitle() {
    var sub = $('tvSubtitle');
    if (isToday(currentDate)) {
      sub.textContent = 'Сегодня · ' + formatDateRu(currentDate);
    } else {
      sub.textContent = formatDateRu(currentDate);
    }
  }

  function loadTasks() {
    showStatus('Загрузка задач...', 'loading');
    var url = SUPABASE_URL + '/rest/v1/daily_tasks?task_date=eq.' + currentDate + '&select=*&order=sort_order.asc,created_at.asc';
    fetch(url, { headers: getHeaders() })
      .then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function(data) {
        tasks = data || [];
        hideStatus();
        updateStats();
        renderList();
      })
      .catch(function(e) {
        showStatus('Ошибка: ' + e.message, 'error');
        $('tvList').innerHTML = '<div class="tv-empty"><div class="tv-empty-icon">⚠️</div>Не удалось загрузить задачи</div>';
      });
  }

  function updateStats() {
    var total = tasks.length;
    var done = 0;
    for (var i = 0; i < tasks.length; i++) { if (tasks[i].is_done) done++; }
    $('tvTotal').textContent = total;
    $('tvDone').textContent = done;
    $('tvLeft').textContent = total - done;
  }

  function renderList() {
    var list = $('tvList');
    if (!tasks.length) {
      list.innerHTML = '<div class="tv-empty"><div class="tv-empty-icon">📝</div>Задач на этот день нет.</div>';
      return;
    }

    var html = '';
    for (var i = 0; i < tasks.length; i++) {
      var t = tasks[i];
      var doneClass = t.is_done ? ' done' : '';
      var time = t.task_time || '';
      var timeClass = time ? '' : ' hidden';

      var imp = t.importance || 0;
      var impClass = imp > 0 ? ' importance-' + imp : '';
      var impBadge = '';
      if (imp === 1) impBadge = '<div class="tv-item-importance importance-1">⚠️ Важно</div>';
      if (imp === 2) impBadge = '<div class="tv-item-importance importance-2">🔴 Очень важно</div>';

      html += '<div class="tv-item' + doneClass + impClass + '" data-id="' + t.id + '" onclick="window.tvToggle(' + t.id + ')">';
      html += '  <div class="tv-item-body">';
      html += '    <div class="tv-item-text">' + escapeHtml(t.task_text) + '</div>';
      html += '    <div style="display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:6px;">';
      html += '      <div class="tv-item-time' + timeClass + '">🕐 ' + escapeHtml(time) + '</div>';
      html += '      ' + impBadge;
      html += '    </div>';
      html += '  </div>';
      html += '</div>';
    list.innerHTML = html;
  }

  function toggleTask(id) {
    var task = null;
    for (var i = 0; i < tasks.length; i++) { if (tasks[i].id === id) { task = tasks[i]; break; } }
    if (!task) return;
    var newDone = !task.is_done;

    fetch(SUPABASE_URL + '/rest/v1/daily_tasks?id=eq.' + id, {
      method: 'PATCH',
      headers: getHeaders({'Content-Type':'application/json','Prefer':'return=minimal'}),
      body: JSON.stringify({ is_done: newDone })
    })
      .then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        task.is_done = newDone;
        var item = document.querySelector('.tv-item[data-id="' + id + '"]');
        if (item) {
          if (newDone) item.classList.add('done');
          else item.classList.remove('done');
        }
        updateStats();
      })
      .catch(function(e) { showStatus('Ошибка: ' + e.message, 'error'); });
  }

  function changeDate(delta) {
    var d = new Date(currentDate + 'T00:00:00');
    d.setDate(d.getDate() + delta);
    currentDate = toLocalDateStr(d);
    $('tvDate').value = currentDate;
    updateSubtitle();
    loadTasks();
  }

  function goToday() {
    currentDate = toLocalDateStr(new Date());
    $('tvDate').value = currentDate;
    updateSubtitle();
    loadTasks();
  }

  window.tvToggle = toggleTask;

  $('tvDate').value = currentDate;
  updateSubtitle();

  $('tvPrevDay').addEventListener('click', function() { changeDate(-1); });
  $('tvNextDay').addEventListener('click', function() { changeDate(1); });
  $('tvTodayBtn').addEventListener('click', goToday);
  $('tvDate').addEventListener('change', function() {
    currentDate = $('tvDate').value || toLocalDateStr(new Date());
    updateSubtitle();
    loadTasks();
  });

  loadTasks();
})();
</script>
